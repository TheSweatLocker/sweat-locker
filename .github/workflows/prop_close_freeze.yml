name: Prop close-line freezer (fast cron, all sports)

# ══ 2026-09-30 · DELIBERATELY NOT NAMED mlb_* ══
# This was mlb_prop_close_freeze.yml and it never was MLB-only: the step runs
# freeze_prop_closing_lines.py --sport ALL, and that script's SPORT_CONFIG
# covers baseball_mlb AND americanfootball_nfl. So NFL prop closing lines were
# being captured by a workflow filed under baseball.
#
# That is the same defect as project_mlb_workflow_hosts_other_sports_928, where
# money-flow scrapers and matview refreshes ran only from the MLB overnight job
# and would have died with the season. The overnight job was split on 09-29;
# this one was missed because the coupling is in the FILENAME, not the steps.
#
# Baseball ends in weeks. When the MLB workflows get an offseason guard or are
# disabled, anything still named mlb_* goes quiet with them — and NFL props
# would silently stop getting closing lines, which is what every prop ROI
# number is measured against.
#
# Kept at the 10-minute cadence rather than folded into multisport_line_poller
# (every 30 min): a CLOSING line has to be captured in the last minutes before
# lock, and a 3x coarser sweep would systematically miss the real close.

# 2026-09-15 — closes the "close_over_odds / close_under_odds all NULL"
# gap. freeze_prop_closing_lines.py only fires when a game is within
# the sport-specific freeze window (MLB=5min, NFL=15min) before commence.
# The main mlb_pipeline invokes it inside the 2 PM ET cron — hours
# before any game actually starts — so it silently no-ops every day.
# Result confirmed 9/15: 0/877 today's props have close_over_odds
# populated. Same for close_under_odds (0/684).
#
# This workflow fires the freeze script every 10 minutes between 22:00
# UTC (6 PM ET) and 04:00 UTC (midnight ET), covering typical MLB /
# NFL / NCAAF game-start windows across US time zones. Script is
# idempotent (skips rows where close_locked_at is already set) and
# cheap outside game windows (early-returns after commence-time
# lookup finds no eligible games).
#
# See mlb_pipeline/freeze_prop_closing_lines.py for the actual work.

on:
  schedule:
    # Every 10 min from 22:00 UTC through 04:00 UTC next day.
    # Covers 6 PM ET → midnight ET (all MLB windows + NFL SNF/MNF).
    - cron: '*/10 22-23 * * *'
    - cron: '*/10 0-4 * * *'
  workflow_dispatch:

concurrency:
  group: prop-close-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Freeze prop closing lines (all sports)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "freeze_prop_closing_lines.py" python freeze_prop_closing_lines.py --sport ALL

      # 2026-09-24 B18 — turn a green-but-broken run red.
      #
      # Every masked step above used to end in `|| echo "... non-fatal"`,
      # which makes the shell succeed, so the step succeeds, so the job
      # succeeds. A grader could fail nightly and the run still showed a
      # green check. That is the mechanism behind "no games resolved
      # yesterday" and "no prime props today".
      #
      # The masks were not simply deleted: one flaky optional scraper would
      # then abort the graders and writers that run after it. Continuing is
      # correct. Continuing silently and claiming success is the bug.
      # run_step.sh records each failure and still returns 0; this gate
      # fails the run at the end with the list.
      - name: Fail the run if any step failed
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
