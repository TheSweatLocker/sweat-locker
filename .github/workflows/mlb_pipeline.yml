name: MLB Pipeline Daily

on:
  schedule:
    # Cron times pulled 2 hrs earlier than the user-facing "ready by"
    # commitments (11am ET morning lock / 4pm ET afternoon refresh) to
    # absorb GitHub Actions queue delays, which historically run 30-90
    # min late and occasionally 2-3 hrs late. Earlier trigger = larger
    # buffer to hit the in-app ready-by promise.
    - cron: '0 10 * * *'  # 6:00am EDT (10:00 UTC) — was 8:00am
    - cron: '0 18 * * *'  # 2:00pm EDT (18:00 UTC)
    # Post-2pm late-announce coverage: queued for a lightweight standalone
    # workflow (retry_starters.yml) that runs 5pm ET + fires only the
    # retry_missing_starters + patch_projected_ks steps. Not adding here
    # to avoid re-running the full 60-step pipeline for 2 API calls.
  workflow_dispatch:

jobs:
  run-mlb-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for the auto-commit step to push content/*.md

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybaseball requests python-dotenv beautifulsoup4 scikit-learn numpy xgboost playwright
          # Chromium binary for Playwright-rendered external scrapers
          # (Dimers/Action/BettingPros). Adds ~200MB but only runs on external pull step.
          python -m playwright install --with-deps chromium || echo "chromium install failed (non-fatal — Playwright scrapers will skip)"

      - name: Run pitcher stats update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pitcher_stats.py

      - name: Run bullpen stats update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python bullpen_stats.py

      - name: Run team offense stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python team_stats.py

      - name: Run Savant enrichment (OAA, xwOBA, barrel%, catcher framing)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python savant_enrichment.py

      - name: Run game context pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          cd mlb_pipeline
          python game_context.py

      # Backfill L10 team ATS / O/U / ML tendencies onto today's rows
      # (2026-08-17). Populates home/away_ats_last10, ou_last10_overs/unders,
      # covers_as_fav/dog%, ml_last10. Activates the 10 team_form signals
      # in signal_sources — first day fired 14 chips across 9/11 games at
      # DISCOVERY weight. Runs AFTER game_context.py (rows must exist to
      # patch) and BEFORE recompute_primary_play (so ensemble sees the
      # tendencies on its second pass). Non-fatal — a tendencies failure
      # just means today's team_form signals evaluate to None and pass;
      # ensemble still scores the game from other signal classes.
      - name: Backfill team ATS/OU tendencies
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_team_tendencies.py || echo "tendencies backfill failed (non-fatal — signals will pass on None)"

      # 2026-08-18: universal team-form enricher — computes venue-split
      # L10 records (home team's L10 AT HOME, away team's L10 ON ROAD)
      # + H2H last-5 meetings. Feeds 11 new signal_sources rows per sport.
      # Requires migration 20260818_team_form_venue_split_h2h.sql + signals
      # migration 20260818_team_form_venue_h2h_signals.sql.
      - name: Enrich team form — venue split + H2H (universal)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport MLB || echo "team_form_universal non-fatal"

      # 2026-08-17: teamrankings season aggregates for MLB. Stacks with
      # per-game rolling tendencies — season signals catch persistent
      # patterns, rolling catches recent form. Both fire when they agree.
      - name: Pull MLB season trends from teamrankings
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_teamrankings_trends.py --sport MLB || echo "MLB teamrankings pull failed (non-fatal)"

      - name: Enrich MLB game context with season trends
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_trends.py --sport MLB || echo "MLB trend enrichment failed (non-fatal)"

      # ── ADVANCED METRICS (2026-08-15) — 5-part refinement pack ──
      # Runs AFTER game_context.py so base fields (catcher_framing,
      # bp_relievers_3d, pitcher L3 K%, projected_bb/outs) are populated.
      # Additive-only — writes new columns to mlb_game_context:
      #   - expected_starter_ip_home/away + ttto_penalty_runs
      #   - home/away_framing_k_bonus (elite framers → K prop lift)
      #   - home/away_team_babip_l14 + babip_regression_flag
      #   - home/away_bullpen_availability + effective_era (rest-adjusted)
      #   - home/away_sp_siera (Skill-Interactive ERA)
      # Downstream layers can consume these to refine projections; leaving
      # them off = no behavior change (non-blocking, non-breaking).
      # Pull Baseball Savant per-pitcher batted-ball rates for FULL SIERA
      # (K%, BB%, GB%, FB%, LD%, PU%). Simplified formula lost 23% vs xERA
      # in 2026-08-15 backtest — full formula requires the GB-FB-PU
      # interaction terms that only per-pitcher Savant data provides.
      # Runs BEFORE advanced-metrics so the SIERA lookup index is warm.
      - name: Pull Savant pitcher arsenal (full SIERA source)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python savant_pitcher_arsenal.py || echo "savant arsenal pull failed (non-fatal)"

      - name: Compute advanced sabermetrics (TTTO, framing, BABIP, bullpen, SIERA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python mlb_advanced_metrics.py || echo "advanced metrics failed (non-fatal)"

      # Verify starters against MLB Stats API probablePitcher feed (2026-05-27).
      # Catches late lineup changes / surprise debuts / scratched starters that
      # the game_context.py upsert missed. Three attribution slips in 4 days
      # (Yesavage 5/26 → was Fisher, Davis Martin 5/27 → was Sandlin debut,
      # Lodolo conflated 5/27) all traced to stale probables in the DB.
      # Runs RIGHT AFTER game_context.py so corrections land before props /
      # sweat card / Jerry reads pull pitcher-dependent data.
      - name: Verify starting pitchers vs MLB API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python verify_starters.py

      # 2026-08-22: PARALLEL warmup of inning bucket splits for tonight's
      # starters. Before this step, game_context.py would discover late-
      # confirmed starters missing bucket data and refresh each one
      # SERIALLY inline (3-6 min added per slate). Now warmup runs in
      # 6-way parallel here, so game_context finds them all pre-populated.
      # Non-fatal: any warmup miss just falls back to game_context inline
      # refresh (existing behavior).
      - name: Warmup pitcher inning buckets (parallel)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python warmup_pitcher_buckets.py --workers 6 || echo "bucket warmup non-fatal"

      # Data-quality self-audit (2026-05-27). Built after the Matz vs-BAL
      # incident — we publicly cited 0.93 ERA / .200 BAA on 9.7 IP as
      # "mastery" (actual career: 4.23 / 38.3 IP). Audit catches:
      #   - vs-team mastery firing on <15 IP
      #   - pitcher_stats row missing for a confirmed starter
      #   - first-inning sample <2 IP (NRFI/YRFI driver)
      #   - L3 ERA missing
      # Runs AFTER verify_starters (pitchers locked) and BEFORE props
      # so any critical surface fails the workflow with a red badge.
      # continue-on-error: true while we calibrate; flip false once
      # noise drops to zero so red badges always mean real problems.
      - name: Data-quality audit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python _data_quality_audit.py

      - name: Update team HR threats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python team_hr_threats.py

      - name: Compute pitcher offense-class projections (before props — props read this)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_pitcher_class_projections.py

      # Patch projected_ks columns on today's mlb_game_context rows from the
      # JSON cache that compute_pitcher_class_projections.py just wrote. This
      # gives Jerry reads, sweat card, and social copy a single source of
      # truth for "projected Ks tonight" — identical to what the K-Over prop
      # scorer cites. (2026-05-27 DeGrom incident: "Over the projected Ks"
      # without a number was unauditable because every surface rebuilt its
      # own ad-hoc estimate.)
      - name: Patch projected_ks onto mlb_game_context
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python patch_projected_ks.py

      # Monte Carlo simulation — writes mc_probabilities + mc_high_conf_flag
      # + NRFI ensemble back to mlb_game_context. Must run BEFORE Jerry reads
      # + props + sweat card so MC values are on the ctx everyone reads.
      # Wired 2026-07-26 after root-cause audit: enrich_monte_carlo was never
      # in any workflow; MC values only landed via ad-hoc manual runs. That
      # meant compute_primary_play never saw mc_high_conf_flag at build time
      # → MC-HIGH-CONF headline block never fired from the primary path.
      - name: Enrich Monte Carlo (mc_probabilities + high_conf + NRFI ensemble)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_monte_carlo.py

      # Sequencing-bug companion (same pattern as 7/25 panel fix):
      # game_context.py builds primary_play BEFORE enrich_monte_carlo writes
      # mc_high_conf_flag, so the MC-HIGH-CONF headline block short-circuits
      # on the initial compute. This step re-runs compute_primary_play with
      # the just-landed MC values on ctx. Also recomputes NRFI ensemble.
      # Verified 2026-07-26 on 15-game slate: 8/15 primary_plays flipped,
      # 2 new PRIME ML picks landed (COL@MIL + CLE@TB) that MC-HC had been
      # showing but scorer wasn't converting.
      - name: Recompute primary_play + NRFI ensemble post-MC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python recompute_primary_play.py

      # L5 pitcher actuals (2026-06-07). Hits MLB Stats API per starter on
      # today's slate, pulls last-5 starts (outs/Ks/BB/hits/ER), writes to
      # jerry_cache rows keyed pitcher_l5_{date}_{game_id}. Consumed by
      # Jerry reads + props scorer + sweat card via pitcher_l5_lookup.py.
      # Closes the recency-data gap from 6/7 (Baz outs / Flaherty hits /
      # Cameron ER all needed L5 data the user pulled manually because
      # projections weren't using it). Runs AFTER verify_starters +
      # patch_projected_ks (pitcher names locked) and BEFORE Jerry reads
      # + props so same-day surfaces get the L5 lift. continue-on-error:
      # lookup degrades gracefully when missing.
      - name: Fetch L5 pitcher actuals
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_l5_pitcher_actuals.py

      - name: Build HR Watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python build_hr_watch.py

      - name: Generate pipeline props
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          # 5/30 fix: this was missing the Odds API key, which silently broke
          # Phase 1 (K book lines, 5/28) AND Phase 2 (HA/ER/Outs/BB, 5/29)
          # recalibration for the entire interval. attach_book_lines printed
          # "ODDS_API_KEY missing — skipping book line fetch" every cron run
          # but downstream nothing checked. Brandon Young U 5.5 K's shipped
          # tonight as STRONG 80 at internal line; actual book was 3.5 (no
          # edge) — recal would have demoted to SKIP 24. Adding the key here
          # so attach_book_lines actually fires going forward.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_props.py

      # Prop coverage sweeper (2026-07-31 · Tier 3). generate_props.py
      # silent-skips pitchers with no pitcher_stats row (Fedde, Martinez
      # er_under, and ~25 others tonight). Sweeper pulls every pitcher
      # prop the sportsbook publishes and inserts a COVERAGE-tier stub
      # so every book market is represented in mlb_pipeline_props.
      # Downstream generate_prop_jerry_synthesis has an edge gate — only
      # rates props with a real signal (legacy scored it OR projection
      # delta ≥10%), so Jerry-take volume stays manageable (~30–60/day).
      - name: Sweep prop coverage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python sweep_prop_coverage.py || echo "prop coverage sweep failed (non-fatal)"

      # 2026-08-19: Juice-trap gate — hits_over 0.5 STRONG/PRIME at ≤-200
      # juice get demoted to LEAN. Runs AFTER sweep (needs book_over_odds
      # populated) and BEFORE refit/jerry-synth (so downstream sees the
      # demoted tier). Per feedback_batter_hits_juice_trap_803: PRIME
      # hits_over hits ~69% but break-even at -200 is 66.7% — no margin.
      - name: Apply juice-trap gate
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python apply_juice_trap_gate.py || echo "juice-trap gate failed (non-fatal)"

      # Recompute prop + game bucket ROI (2026-08-01 R-6). Nightly
      # rebuild of prop_bucket_roi + game_bucket_roi from graded rows so
      # Jerry synth sees the freshest juice-adjusted edge per bucket.
      # Runs BEFORE Jerry synth so today's take uses today's data.
      # Also implicitly refreshes the "SKIP-tier BACK overrides" so
      # SKIP outs_under +38.8% stays hot.
      - name: Recompute bucket ROI
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_prop_bucket_roi.py || echo "prop bucket recompute failed (non-fatal)"
          python compute_game_bucket_roi.py || echo "game bucket recompute failed (non-fatal)"

      # Prop refit conviction (2026-07-31 · Option C step 1). Post-hoc
      # rescore of every prop's conviction using logistic-fit weights
      # trained on 60d graded outcomes. Legacy conviction column
      # untouched. App reads refit_conviction (with fallback).
      # Backtest lift (top-30% picks): +9.3pp system, +21pp on
      # outs_under, +42pp on hits_under. Weight table at
      # models/prop_refit_weights_v1.json. Sign-flip fix is implicit —
      # data-driven negative coefficients naturally penalize L-predictor
      # signal firings. continue-on-error: if refit fails, legacy
      # conviction still populates everything downstream.
      # 2026-08-10: weekly refit v2 retrain (Sundays only). Runs BEFORE
      # apply_prop_refit so today's picks use fresh weights. Uses trailing
      # 120d of graded data. Skips on non-Sunday cron runs. Failure is
      # non-fatal — apply_prop_refit falls back to prior weights file.
      # Cadence per project_refit_v2_expansion_810: weekly is right
      # tradeoff between freshness and sample-size stability.
      - name: Retrain prop refit v2 weights (Sundays only)
        if: github.event.schedule == '0 10 * * *' && github.event_name == 'schedule'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "7" ]; then
            cd mlb_pipeline
            python _fit_prop_refit_weights_v2.py || echo "refit retrain failed (non-fatal)"
          else
            echo "not Sunday (DOW=$DOW) — skipping weekly retrain"
          fi

      # 2026-08-21: Weekly signal_registry refit — computes per-signal
      # hit_rate + tier from last 90d of graded prop_playbook_decisions +
      # mlb_game_results.primary_play._ensemble_sources. Feeds edge_weight()
      # so signals graduate from RAMP_UP_PRIOR (0.50) to their measured
      # rate after 30 days, and ANTI_VALIDATED fade signals get flipped by
      # the ensemble's sharp-fade branch. First live run 2026-08-21 caught
      # refit_conviction_strong at 46.97% on n=264 (real fade edge).
      - name: Refit signal_registry from graded history (Sundays only)
        if: github.event.schedule == '0 10 * * *' && github.event_name == 'schedule'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "7" ]; then
            cd mlb_pipeline
            python refit_signal_registry.py --days 90 --min-n 10 || echo "signal registry refit failed (non-fatal)"
          else
            echo "not Sunday (DOW=$DOW) — skipping signal registry refit"
          fi

      # 2026-08-10: Nightly scenario audit recompute. Reads all past
      # game_context+results, projects into ~30 canonical MLB scenarios
      # (public-pct bands × side × line/ML bucket, whale signals,
      # confluence×tier), writes hit-rate + ROI + jerry_hint to
      # scenario_audit table. Sport-universal — NFL/NCAAF will pick up
      # their own scenario extraction as those pipelines mature.
      # Non-fatal so bad ctx data doesn't kill the cron.
      - name: Compute scenario audit (cross-sport)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_scenario_audit.py --sport MLB --window lifetime || echo "scenario audit MLB lifetime failed"
          python compute_scenario_audit.py --sport MLB --window 90d || echo "scenario audit MLB 90d failed"
          python compute_scenario_audit.py --sport MLB --window 30d || echo "scenario audit MLB 30d failed"
          # 2026-08-11: NCAAF results-primary path (15k+ games via CFBD).
          # NCAAF ctx is thin — builder pulls scenarios directly from results.
          # Also touches NHL/NCAAB (no-op until their results tables ship).
          python compute_scenario_audit.py --sport NCAAF --window lifetime || echo "scenario audit NCAAF lifetime failed"
          python compute_scenario_audit.py --sport NHL --window lifetime || echo "scenario audit NHL lifetime failed"
          python compute_scenario_audit.py --sport NCAAB --window lifetime || echo "scenario audit NCAAB lifetime failed"
          # 2026-08-12: sharp scenario matrix — 30+ patterns per sport
          # tracked with per-game match cache. Sport-universal, MLB first.
          python compute_sharp_scenario_matrix.py --sport MLB --window 90 || echo "sharp matrix MLB failed"

      - name: Apply prop refit conviction
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python apply_prop_refit.py || echo "prop refit failed (non-fatal)"

      # Backfill L5/L10 player-vs-line lookback on today's props
      # (2026-08-17). Populates player_l5_hit_count / player_l10_hit_count
      # via MLB Stats API. Powers the player_l10_vs_line_extreme playbook
      # signal. Runs AFTER apply_prop_refit + BEFORE prop_ensemble_scorer
      # so the scorer sees fresh L10 data. Non-fatal — the L10-based
      # signals just don't fire if this step fails.
      - name: Backfill prop L5/L10 lookback
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_lookback.py --sport MLB || echo "prop lookback backfill failed (non-fatal)"

      # 2026-08-23 Dedup pass. sweep_prop_coverage.py inserts the
      # OPPOSITE direction as COVERAGE stub so shadow playbook has
      # coverage on both sides; apply_refit_verdict_override.py then
      # auto-demotes COVERAGE → LEAN 55. Net effect users see: every
      # opinionated pitcher has ha_over LEAN 55 AND ha_under LEAN 55
      # as separate cards. dedup_prop_dupes.py collapses the pair to
      # the winning row (fired-signals > stub, higher tier > lower).
      # Runs BEFORE prop_ensemble_scorer + prop_jerry_synth so those
      # only see one clean pick per (player, family).
      - name: Dedup prop dupes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python dedup_prop_dupes.py || echo "prop dedup failed (non-fatal)"

      # 2026-08-23 Sport-universal coverage audit. Runs read-only, reports
      # per-family signal-firing gaps to stdout. Findings map 1:1 to the
      # coverage chip users see on the card. Surfaces wire-up backlog so
      # when NFL/NCAAF/NCAAB/NHL/UFC props start flowing, the same audit
      # tells us which sport-specific scoring functions have gaps.
      # Non-fatal — pure diagnostic.
      - name: Prop coverage audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_coverage_audit.py --sport MLB || echo "coverage audit failed (non-fatal)"

      # 2026-08-23 End-to-end pipeline healthcheck. Verifies all 8 layers
      # of the prop flow (ingest → scoring → conviction → refit → playbook
      # → L10 → render → surface) with sample traces. Read-only. Non-fatal.
      # Catches drift + regressions that the coverage audit alone misses
      # (e.g. yesterday's migration column-not-populated bug surfaced
      # first run). Sport-universal — works for NFL/NCAAF/etc when their
      # pipelines produce rows.
      - name: Prop pipeline healthcheck
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_pipeline_healthcheck.py --sport MLB --sample 3 || echo "healthcheck failed (non-fatal)"

      # 2026-08-23 Per-signal ROI tracker — empirical validation of each
      # signal_key's historical hit rate on graded props. Answers "which
      # signals earn their weight" with real data instead of hand-tuning.
      # Runs on 30d rolling window. Findings feed into refit v3 retrain
      # + candidate weight adjustments. Sport-universal, read-only,
      # non-fatal.
      - name: Signal contribution tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python signal_contribution_tracker.py --sport MLB --days 30 || echo "signal tracker failed (non-fatal)"

      # 2026-08-23 Auto-calibration bridge: writes empirical signal hit
      # rates into signal_registry so playbook's edge_weight() picks up
      # legacy's proven scoring wisdom automatically. Runs AFTER the
      # contribution tracker (which produces the data). Non-fatal.
      # User insight: "if legacy is working, inject those processes into
      # playbook — the math holds." This is the connector.
      - name: Refresh prop signal calibration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport MLB --days 30 || echo "signal calibration refresh failed (non-fatal)"

      # Prop ensemble scorer — SHADOW MODE (2026-08-17). Reads
      # signal_sources rows with subject_scope IN ('prop','player_prop')
      # and writes plug-in playbook decisions to prop_playbook_decisions
      # WITHOUT touching legacy mlb_pipeline_props.tier / .conviction.
      # Legacy stays authoritative until 14d of shadow data proves
      # playbook meets/beats legacy hit-rate. See
      # project_prop_playbook_design_817 for the cutover criteria.
      # Non-fatal — playbook failure never blocks pipeline.
      # 2026-08-21: --refresh-existing added. Any prop_playbook_decisions
      # row whose source prop was pruned between morning-lock and this
      # run gets re-evaluated against the CURRENT signal set. Ensures
      # signals ported mid-day (e.g., pitcher_vs_team_ip_below_outs_line
      # added at 17:23 UTC on 8/21) actually reach already-scored
      # decisions instead of waiting until tomorrow's fresh score pass.
      - name: Prop playbook scorer (shadow mode)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_ensemble_scorer.py --sport MLB --refresh-existing || echo "prop playbook scorer failed (non-fatal, shadow-mode)"

      # Prop Jerry synthesis (2026-07-31 · sport-universal). Runs AFTER
      # apply_prop_refit so Jerry sees refit_conviction. Writes 40-60w
      # take + BACK/FADE/PASS verdict + conviction to prop_jerry_reads.
      # continue-on-error: bad prop take never blocks card / degen / potd.
      - name: Generate Prop Jerry synthesis
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          # 2026-08-22: --tier-gate PRIME,STRONG caps LLM narration to card-worthy
          # props only (~61 calls = ~4 min vs ~332 calls = ~25 min for every non-SKIP
          # prop). Below-gate props still have their ensemble decision + signals;
          # they render deterministically from tier + conviction + signals dict
          # without Claude tokens. Template renderer will land in follow-up commit
          # to fill deterministic short_read for below-gate props.
          # 2026-08-22 KILLED LLM PROP JERRY. Per user directive: prop Jerry
          # was outputting 4 conflicting conviction numbers per prop + prose
          # that contradicted itself in one paragraph ("BACK. [REVISED from
          # FADE...] FADE."). Also only surfacing xERA when users don't know
          # what xERA means. Also 100s from refit saturation (fixed 0a057691).
          #
          # New path: --tier-gate NONE forces ALL props through the
          # deterministic template renderer (render_prop_template.py v2 which
          # now emits ESPN-style last-10 stat table + categorized signals +
          # signal gap audit + ONE verdict, ONE score).
          #
          # Zero Claude cost on props. Zero contradiction. Zero hallucination.
          # If someone wants LLM prose back, change gate to PRIME,STRONG.
          python generate_prop_jerry_synthesis.py --force --tier-gate NONE || echo "prop jerry synthesis failed (non-fatal)"

      # Collapse Prop Jerry contradictions (2026-08-01 C). Runs AFTER
      # generate_prop_jerry_synthesis. Kills Skenes-style BACK+BACK /
      # FADE+FADE paradoxes where each (prop_type, direction) is a
      # separate Claude call that doesn't know what the opposite
      # direction row said. Loser downgraded to PASS (still gradable
      # as NO_ACTION), winner keeps its verdict + conviction.
      - name: Collapse Prop Jerry contradictions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python collapse_prop_jerry_contradictions.py || echo "prop jerry collapse failed (non-fatal)"

      # 2026-08-09: pitcher-thesis contradiction resolver. Complements the
      # collapse above (which handles OVER+UNDER paradoxes on same line).
      # This one handles CROSS-PROP thesis contradictions on same pitcher
      # — the Cristian Javier bug: outs_under BACK + ha_over BACK (early-
      # hook thesis) but ks_under FADE (contradicts thesis). Downgrades the
      # thesis-incoherent verdict to PASS. Runs AFTER above collapse so it
      # operates on post-cleanup state.
      - name: Collapse pitcher-thesis contradictions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python collapse_pitcher_thesis_contradictions.py || echo "pitcher-thesis collapse failed (non-fatal)"

      # 2026-08-10: refit verdict override — force BACK/FADE/PASS on
      # prop_jerry_reads when raw and refit disagree materially. Runs
      # AFTER all other collapse scripts. Wires the refit calibration
      # into Prop Jerry's BACK/FADE decision (previously refit was
      # computed but Jerry ignored it). Rules:
      #   |Δ| >= 30 AND refit <  40  → FORCE FADE (raw fooled by trap)
      #   |Δ| >= 20 AND refit >= 80  → FORCE BACK (refit boost)
      #   |Δ| >= 20 AND refit <  45  → FORCE PASS (too conflicted)
      # No-refit props: cap conviction LEAN 55 with audit tag.
      # Idempotent + safe to re-run same day.
      - name: Refit verdict override (Prop Jerry)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python apply_refit_verdict_override.py || echo "refit override failed (non-fatal)"

      # 2026-08-23 SECOND DEDUP PASS. Wave 1a follow-up: the first
      # dedup_prop_dupes (line ~496) runs before apply_refit_verdict_override
      # + before any downstream writer that could insert dupe rows via
      # [preserved] book_source pattern from generate_props' live-game
      # handling. Empirically today's cron had 47 dupes still present
      # after the first dedup pass because the [preserved] rows landed
      # after dedup ran. This second pass catches them right before
      # aggregate_daily_records reads props for the sharp card. Non-fatal.
      - name: Dedup prop dupes (final pass)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python dedup_prop_dupes.py --sport MLB || echo "final dedup failed (non-fatal)"

      # 2026-08-14 · FADE→PASS discipline for bomb-list prop_types.
      # 30d audit showed outs_over / er_under / bb_over / bb_under / ks_under
      # natural FADEs hit <45% (see apply_fade_type_discipline.py docstring).
      # Runs AFTER refit override so refit-triggered FADEs get through first,
      # then bomb-list filter converts them to PASS. Non-fatal.
      - name: FADE→PASS bomb-list discipline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python apply_fade_type_discipline.py || echo "fade type discipline failed (non-fatal)"

      # Jerry-anchor Daily Degen (2026-07-31 · Tabletop C step 3). Runs
      # AFTER generate_prop_jerry_synthesis so it can pull from both
      # jerry_reads (game-level) and prop_jerry_reads (prop-level) to
      # build a top-conviction parlay. Sport-universal — cross-sport
      # legs will surface once NBA/NFL synthesizers ship. Falls back
      # gracefully to legacy generate_daily_degen output if fewer than
      # MIN_LEGS Jerry legs qualify.
      - name: Jerry-anchor Daily Degen
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python jerry_anchor_daily_degen.py || echo "degen jerry anchor failed (non-fatal)"

      # Prop-signal override (added 2026-05-19): when v4 says OVER big
      # (>=+1.5 vs market) but PRIME/STRONG props concentrate UNDER, props
      # win the head-to-head 64.7% (backtested on n=17). Patches
      # model_pred_total in mlb_game_context so downstream consumers
      # (Daily Degen total lean, Jerry reads, social card, app totals
      # display) all see the corrected lean.
      # Runs AFTER generate_props.py (needs the prop concentrations) and
      # BEFORE generate_daily_degen.py + play_of_day.py + generate_mlb_game_reads.py
      # so they read the post-override totals.
      - name: Apply prop-signal override to v4 totals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python apply_prop_signal_override.py

      # Prop reverse signal (added 2026-06-10). Reverse-aggregates
      # PRIME/STRONG/LEAN/LIGHT_LEAN player props into a game-level total
      # and side vote per game. Stored in jerry_cache row
      # 'prop_reverse_signals_{date}' so play_of_day / Jerry reads can
      # consume as an INDEPENDENT signal from cohort engine (cohort is
      # game-condition driven; prop reverse is lineup-level driven).
      # Runs AFTER apply_prop_signal_override so it sees the final props.
      - name: Compute prop-reverse signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python write_prop_reverse_signals.py

      - name: Generate Daily Degen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_daily_degen.py

      - name: Generate Dawg of the Day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_dawg_of_day.py

      # NFL Phase 1 prep — team-stats puller (Tuesdays during NFL season).
      # NFL season runs Aug-Feb (preseason starts Aug, regular season Sept,
      # playoffs Jan-Feb). Outside that window, no fresh data so we no-op.
      # Tuesday cadence picks up Sun/Mon games in nflverse without missing
      # latency for the Thursday slate-card drop (Phase 2).
      - name: Pull NFL team stats (Tuesdays during season)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          MONTH=$(date -u -d '-4 hours' +%m)
          # Tuesday = 2; in-season = Aug (08) - Feb (02)
          if [ "$DAY" = "2" ] && { [ "$MONTH" -ge 08 ] || [ "$MONTH" -le 02 ]; }; then
            echo "Tuesday in NFL season — pulling team stats"
            cd mlb_pipeline
            python nfl_pipeline.py
          else
            echo "Not Tuesday or out of NFL season (day=$DAY month=$MONTH) — skipping"
          fi

      # NCAAB Phase 1 prep — server-side KenPom puller (Mondays only).
      # Once season starts (Nov 2026), bump cadence to daily by removing
      # the day gate. Until then KenPom is mostly static offseason and
      # weekly is plenty.
      - name: Pull NCAAB KenPom snapshot (Mondays only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          KENPOM_KEY: ${{ secrets.KENPOM_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          # 2026-07-22 debug: KENPOM_KEY was reporting "missing" per 6/1
          # audit despite secret set. Print length only (never the value)
          # so we can tell empty-string vs actually-populated at a glance.
          # Remove this echo once the KenPom pull is confirmed working.
          echo "KENPOM_KEY length: ${#KENPOM_KEY}"
          # 2026-08-22: KenPom Monday pull REMOVED from MLB cron. This was
          # duplicating the identical paid-API call already running in
          # ncaab_pipeline.yml Monday cron (which writes to ncaab_team_stats
          # AND ncaab_rating_snapshots). Paying twice for the same snapshot.
          # If ncaab_pipeline.yml is down, trigger it manually via
          # workflow_dispatch rather than reintroducing this duplicate.
          echo "KenPom pull is owned by ncaab_pipeline.yml — not re-running here"

      # HR Watch audit (2026-06-01) — resolves prior days' predictions
      # against MLB Stats API gameLog, computes hit rate by score band,
      # writes findings to mlb_tier_calibration for the trend dashboard.
      # Runs daily after evening games finish (this workflow's later runs).
      - name: HR Watch audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_hr_watch.py

      # CLV history logger (2026-06-20) — persists per-tier CLV nightly so
      # decay/improvement is trackable over time. Reads recent graded games,
      # writes positivity rate + win rate per (tier × pick_type × window)
      # into mlb_tier_calibration. Idempotent on (tier, window_label,
      # computed_date) so re-runs same day overwrite cleanly.
      - name: CLV history logger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python log_clv_history.py

      # Starter-change detection (2026-06-20) — diffs mlb_game_context
      # pitchers against MLB API probable pitchers. Catches same-day
      # starter swaps that silently invalidate pitcher-prop picks (6/20
      # Skenes/Sugano + Connelly Early incidents). Writes findings to
      # jerry_cache.starter_changes_<date> so downstream tools (morning
      # audit, engine_tier_brief, validators) can read "data freshness"
      # 2026-08-22: check_starter_changes.py step REMOVED. Redundant with
      # verify_starters.py which also compares stored starters vs MLB API
      # AND patches drift (check_starter_changes only logs). Detection is
      # covered by verify_starters + retry_missing_starters chain. Script
      # moved to _legacy/ for reference.

      # Late-announce starter retry (added 2026-07-25). Some teams
      # announce home starter after 12pm cron — we get context rows
      # with home_pitcher NULL, breaking v4/MC. This detects any NULL
      # pitcher, checks MLB API for updates, PATCHes + re-triggers
      # patch_projected_ks. Runs on all crons; idempotent no-op when
      # no gaps. 5pm cron (added same day) is the intended primary
      # firing since late-announces cluster ~3-5pm ET for evening games.
      - name: Retry missing starters + downstream recompute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python retry_missing_starters.py || echo "retry_missing_starters non-fatal"

      # v5 nightly retrain (2026-06-21) — rolling 90d window. v5_ml +
      # v5_total are stacked ensembles read by play_of_day's POTD
      # selector via v5_inference.py. Without nightly retrain, the
      # model decays as recent games shift the feature distribution.
      # Both training scripts are self-contained, idempotent on (date,
      # window), and write meta JSON alongside the model file.
      #
      # Only runs in the night/morning slot so we don't burn compute
      # on every mid-day refresh. Failures are non-fatal — the rest
      # of the pipeline keeps using the prior-day model files.
      - name: v5 nightly retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" -ge 5 ] && [ "$HOUR_UTC" -le 12 ]; then
            echo "Morning slot — running v5 retrain"
            python train_v5_ml.py || echo "v5_ml retrain failed (non-fatal)"
            python train_v5_total.py || echo "v5_total retrain failed (non-fatal)"
          else
            echo "Outside morning slot ($HOUR_UTC UTC) — skipping retrain"
          fi
        continue-on-error: true

      - name: Update umpire database (Mondays only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — updating umpire database"
            cd mlb_pipeline
            python umpires_scrape.py
          else
            echo "Not Monday (day=$DAY) — skipping umpire update"
          fi

      - name: Run UFC card scraper (Thursdays only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "4" ]; then
            echo "Thursday — running UFC card scraper (v3 ESPN-backed)"
            cd mlb_pipeline
            # v3 replaces v1 (UFCStats.com added JS bot-check May 2026).
            # ESPN scoreboard API is the reliable source. Kept v1 script
            # in repo for reference until fighter-DB gap is closed.
            python ufc_card_scraper_v3.py
          else
            echo "Not Thursday (day=$DAY) — skipping UFC scraper"
          fi

      - name: Score UFC card (Thursdays only, post-scraper)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "4" ]; then
            echo "Thursday — scoring UFC card via v1 model"
            cd mlb_pipeline
            python ufc_score_card.py
          fi

      - name: Resolve UFC fights (Sundays/Mondays after weekend cards)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "7" ] || [ "$DAY" = "1" ]; then
            echo "Sun/Mon — resolving completed UFC fights"
            cd mlb_pipeline
            python ufc_resolve_fights.py
          fi

      # Server-side Jerry UFC fight reads — runs every cron, self-no-ops when
      # 2026-08-22: UFC + NFL game-reads MOVED OUT of MLB cron.
      # UFC reads now run from ufc_pipeline.yml (Wed/Fri/Sat/Sun crons).
      # NFL reads run from nfl_pipeline.yml (weekly slate cadence) with
      # its own season gate — this cron was blindly firing --force every
      # cycle year-round, including off-season and preseason. Waste eliminated.
      # If UFC/NFL reads need to run outside their own workflow's cron,
      # trigger those workflows manually (workflow_dispatch).

      - name: Resolve prop grades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          cd mlb_pipeline
          # 2026-08-08 / retired 2026-08-22: grade_props.py is authoritative.
          # resolve_props.py fallback removed after 14-day parallel-run window
          # closed cleanly (grade_props no known misses). File moved to
          # _legacy/resolve_props.py for reference.
          python grade_props.py || echo "grade_props non-fatal"
          # 2026-08-18: copy result + compute unit_pnl using SNAPSHOTTED
          # odds so historical PnL uses the odds at card-lock, not whatever
          # was live at grade time. Backfills last 7 days each run so late
          # settles catch up automatically.
          python grade_pick_snapshots.py --days 7 || echo "grade_pick_snapshots non-fatal"
          # 2026-08-22: grade prop_playbook_decisions. Was --backfill 21
          # for one-shot catchup; trimmed to 3 for steady-state. Grader
          # runs every cron cycle so a 3-day window is more than enough
          # to catch late grades — 21 was adding ~8 min of MLB stats API
          # calls per cron for zero incremental benefit after catchup.
          python grade_prop_playbook.py --backfill 3 || echo "grade_prop_playbook non-fatal"

      # Prop playbook shadow audit (2026-08-17). Compares legacy prop
      # scoring vs plug-in playbook decisions over rolling 14-day window
      # using freshly-graded results from grade_props.py above. Reports:
      #   * Agreement rate (both same tier / same side)
      #   * Disagreement wins (playbook right vs legacy right)
      #   * Hit-rate + ROI per tier for each system
      # Non-fatal — runs daily but the CUTOVER criterion is 14 consecutive
      # days of playbook meeting or beating legacy ROI. See project_prop
      # _playbook_design_817 memory.
      - name: Prop playbook shadow audit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_prop_playbook_shadow.py --days 14 || echo "shadow audit failed (non-fatal)"

      # Resolve yesterday's Daily Degen parlay. Runs after resolve_props +
      # resolve_game_results so leg outcomes (props via mlb_pipeline_props.result;
      # ML via mlb_game_results.spread_result / home_win) are already graded.
      # Wired 2026-07-26 alongside daily_degen.legs_resolved / result / resolved_at
      # migration — before this, "how often does Daily Degen hit?" was unanswerable
      # because no tracking existed.
      - name: Resolve Daily Degen parlays
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_daily_degen.py

      - name: Resolve NRFI results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_nrfi.py

      - name: Resolve game results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_game_results.py

      # Grade the day's card automatically (added 2026-07-25). Runs after
      # resolve_game_results, so primary_play + mc_high_conf + nrfi_ensemble
      # + PRIME/STRONG props all have final outcomes. Writes to daily_grades
      # so morning audit is one-shot (no manual grade pull). Also seeds
      # long-term tier calibration on primary_play performance.
      - name: Grade daily card
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python grade_daily_card.py || echo "grade_daily_card non-fatal"

      # CLV computation (NEW 2026-08-15). Runs AFTER grading so every pick
      # has a resolved close_total / close_spread / close_home_ml + our
      # picked line/odds. Computes per-pick closing line value + upserts
      # to clv_snapshots. CLV is the industry-standard proxy for pick
      # quality that's independent of W/L variance. Sport-universal.
      - name: Line movement — compute CLV per pick
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_clv.py --sport ALL || echo "compute_clv non-fatal"

      # Jerry synthesis graders (2026-07-31 · Tier 3). Runs alongside
      # legacy grade_daily_card. Populates jerry_reads.result +
      # prop_jerry_reads.result so the Receipts tab can show live
      # Jerry track record starting day one. Sport-universal via
      # RESULTS_TABLE / PROPS_TABLE registries.
      # continue-on-error: bad grading never blocks morning audit.
      - name: Grade Jerry synthesis reads (game + prop)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python grade_jerry_reads.py || echo "grade_jerry_reads non-fatal"
          python grade_prop_jerry_reads.py || echo "grade_prop_jerry_reads non-fatal"

      # 2026-08-16: nightly Playbook rescore. Reads resolved evidence from
      # the past 30 days and refreshes signal_registry hit rates + tiers +
      # weights. Runs after grading so newest results are in the pool.
      # Sport-universal writes but signal handlers are MLB-scoped today
      # (refit bands, mc_ml_high_conf). Non-fatal — registry stays stale
      # rather than blocking cron on any single-signal query failure.
      - name: Rescore signal_registry (Playbook refresh)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python rescore_signal_registry.py || echo "rescore_signal_registry non-fatal"

      # 2026-08-16: backfill signal_sources → signal_registry tiers from
      # the past 60 days of resolved games. Every signal_sources row
      # gets its tier (VALIDATED / DISCOVERY / UNVALIDATED / ANTI_VALIDATED)
      # + recommended_weight refreshed based on actual predictive
      # performance. This is what keeps the ensemble scorer's weights
      # honest — a signal that stops working gets auto-demoted. Runs
      # after rescore so the registry is fresh first. Non-fatal.
      - name: Backfill signal_sources tiers (60d replay, all sports)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_signal_tiers.py --days 60 --sport ALL || echo "backfill_signal_tiers non-fatal"

      # 2026-08-16: prop signal audit — mines signals JSON on resolved props
      # to auto-tier which prop signals actually predict. Companion to
      # backfill_signal_tiers (which handles game-level signals).
      # Runs both MLB (mlb_pipeline_props) and NFL (nfl_props). Once NFL
      # season starts + week 1 resolves, NFL will start producing rows.
      - name: Audit prop signals (all sports)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_prop_signals.py --days 90 --sport ALL || echo "audit_prop_signals non-fatal"

      # 2026-08-18: prop signal_sources rule backfill — grades the plug-in
      # rules the playbook ensemble consumes (e.g. `batter_l14_heat` with
      # condition `"l14_heat" in p.signals`) against 60d of resolved props.
      # Complements audit_prop_signals.py which grades raw signal keys.
      # This one is what promotes signal_sources rules to VALIDATED so the
      # playbook can give them real weight instead of the 0.15 default.
      # Without this, playbook can't reach STRONG on any pick — first run
      # 2026-08-18 promoted 10 rules to VALIDATED, 2 to DISCOVERY,
      # 1 to ANTI_VALIDATED (batter_l14_cold — invert or drop).
      - name: Backfill prop signal_sources tiers (60d)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_signal_tiers.py --days 60 --sport ALL || echo "backfill_prop_signal_tiers non-fatal"

      # 2026-08-16: nightly ensemble health check. Replays the last 30d,
      # computes rolling hit rate + ROI, sets status_flag on ensemble_health.
      # ensemble_scorer reads that at score time — auto-tightens or hard-
      # suppresses when cold. Self-regulation without human intervention.
      - name: Monitor ensemble health (MLB)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python monitor_ensemble_health.py --sport MLB --window 30 || echo "monitor_ensemble_health non-fatal"

      # 2026-08-16: ensemble wiring verifier. Catches silent bugs like
      # zeroed track records, unloaded registries, weight-lookup mismatches.
      # Exits non-zero if any critical check fails — surfaces in GHA logs.
      # continue-on-error so a wiring alarm doesn't kill the rest of the run.
      - name: Verify ensemble wiring (MLB)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python verify_ensemble_wiring.py --sport MLB || echo "verify_ensemble_wiring found issues — inspect logs"

      # POTD auto-resolver — reads jerry_cache best_bet_* entries, looks
      # up game outcomes via mlb_game_results, writes Win/Loss/Push back
      # to data.result. Idempotent + backfills any unresolved historic
      # POTDs. Added 2026-05-19 so we stop manually tracking POTD record.
      - name: Resolve Play of the Day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_potd.py

      # Grade external picks now that game_results is filled — enables
      # per-source calibration + consensus-fade detector (transparency
      # differentiator, 2026-07-22). continue-on-error so a bad
      # result-map query never blocks downstream POTD walk.
      - name: Resolve external picks
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_externals.py --sport MLB --days 7 || echo "external resolver failed (non-fatal)"

      # Refresh per-source rolling calibration (7d/30d/lifetime hit rates
      # per source × surface × fade_flag). Feeds dynamic fade tag refresh
      # + consensus_fade_alert detector + app-side track record display.
      - name: Refresh external source calibration
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_external_source_calibration.py --sport MLB || echo "external calibration audit failed (non-fatal)"

      # 2026-08-20: Sharp-source rolling calibration (FR / CZ / OC hit rates +
      # 3/3-agree vs dissent buckets). The moat table pair per
      # project_per_source_tracker_moat_818. Runs after finals grade so
      # per-source rows and agreement buckets stay current for The Split tab
      # (in-app track-record display + MINORITY DISSENT badge).
      - name: Refresh sharp-source calibration
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_sharp_source_calibration.py --sport MLB || echo "sharp-source calibration failed (non-fatal)"

      # Consensus-bucket audit (substantiates consensus_fade detector).
      # Without this the detector has no bucket calibration and every
      # high-consensus game shows MONITORING instead of FADE.
      - name: Refresh consensus bucket calibration
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_consensus_bucket_calibration.py --sport MLB || echo "consensus bucket audit failed (non-fatal)"

      # Re-walk the sweat card after POTD is graded (2026-05-26 fix).
      # The card walk inside resolve_game_results.py reads
      # daily_best_bet_history for the POTD row's result — but the FIRST
      # walk happens BEFORE resolve_potd.py writes the Win/Loss/Push,
      # so the POTD entry stayed Pending on the card for an extra day.
      # This second pass picks up the POTD result that was just graded.
      - name: Re-walk Sweat Card (post-POTD)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_game_results.py --card-only

      # Recompute cohort stats (2026-06-07). Reads from the freshly-graded
      # mlb_game_results above and writes models/cohort_stats.json. Consumed
      # by play_of_day.py + generate_dawg_of_day.py via cohort_lookup.py
      # so user-facing cohort percentages reflect live data instead of
      # frozen backtest snapshots. The lookup has a 36h freshness gate and
      # min-n filter — a skipped run falls back to a generic label rather
      # than shipping a stale number. continue-on-error since cohort
      # surfaces gracefully degrade if the recompute fails.
      - name: Recompute cohort stats
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python cohort_stats.py

      # Refresh attribution cohort signals (2026-06-08). Re-runs the
      # full attribution backtest on every graded mlb_game_results row,
      # applies Bayesian shrinkage (prior_n=30), filters out cohorts
      # decaying or reversed in last 30d, writes ~600+ surviving rules
      # to jerry_cache row 'cohort_signals'. Consumed at runtime by
      # cohort_signals.evaluate_game_for_play() which the Jerry reads
      # struct now surfaces. Phase 2+ wires conviction deltas in
      # props/POTD/DAWG.
      #
      # Runs after resolve_game_results.py so last night's outcomes are
      # incorporated. continue-on-error since the lookup degrades to
      # empty (no rules applied) when refresh fails — production
      # surfaces never break.
      - name: Refresh cohort signals
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_cohort_signals.py

      # Cohort calibration report (2026-06-09 Phase 1.5). After cohort_signals
      # refreshes from the freshly-graded games, run a 1-day calibration check
      # against yesterday's outcomes. Tier-level verdict (DELIVERING /
      # UNDERPERFORMING / FADE CORRECT / FADE FAILED) tells us at a glance
      # whether Phase 2's rules predicted what landed. JSON archive in
      # models/calibration_*.json so we can track drift day-over-day.
      # continue-on-error so calibration reporting failures never block
      # the rest of the cron.
      - name: Cohort calibration report
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python cohort_calibration_report.py

      # Buy-down calibration (2026-06-17 Phase 6 of engine clarity refactor).
      # Computes live buy-down cheat-line hit rates from resolved games and
      # writes to jerry_cache.buy_down_calibration. Consumed by
      # generate_mlb_game_reads.py so Jerry cites real cohort percentages
      # instead of the hardcoded numbers stripped earlier today. Runs after
      # resolve_game_results.py so today's outcomes feed the rolling windows.
      # continue-on-error so a calibration failure never blocks downstream
      # surfaces — buy-down hit rate just stays None when stale (Jerry omits
      # the % claim, doesn't fabricate it).
      - name: Buy-down calibration
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python buy_down_calibration.py

      # 2026-08-17: NBA pipeline steps DELETED. User decision to reset NBA
      # from scratch. Legacy scripts (nba_pipeline.py, nba_pick_logger.py,
      # nba_picks_generator.py, generate_nba_game_reads.py) removed.
      # BDL data source killed. New nba_data_client.py uses stats.nba.com.
      # Rebuild scheduled for pre-season (Oct 22). See
      # project_nba_reset_817 memo for status.

      - name: Generate Play of the Day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python play_of_day.py

      # v7 total model SHADOW predictions. Logs per-game OVER/UNDER probability
      # from the retrained GradientBoost model (trained 2026-06-23, 59% holdout,
      # 64% conf-UNDER) into jerry_cache key v7_total_shadow_<date>. NOT user-
      # facing. Run audit_v7_shadow.py to compare v7 vs composite over 14d.
      # Promote to production once v7 sustainably beats composite.
      - name: v7 total shadow inference
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python shadow_total_inference.py || echo "shadow inference failed, continuing"

      # v1 ML model SHADOW predictions. Logs per-game HOME/AWAY win probability
      # from XGBoost trained 2026-06-23 (53% holdout, 64% conf-HOME on n=42).
      # Writes to jerry_cache key ml_v1_shadow_<date>. NOT user-facing.
      # Same 14d promotion gate via audit_ml_v1_shadow.py.
      - name: v1 ML shadow inference
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python shadow_ml_inference.py || echo "ML shadow inference failed, continuing"

      # Server-side POTD narrative — replaces the client-side Claude call
      # that used to run on first POTD load. Single source of truth: the
      # row's data.narrative field. Built with proper "pitches FOR / FACES
      # lineup" attribution, same as generate_mlb_game_reads.py per-game.
      # Runs in BOTH morning + afternoon crons so afternoon POTD overrides
      # (line move / lineup confirm) get a fresh narrative.
      - name: Generate POTD narrative
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_potd_narrative.py --force

      # Server-side Jerry game reads — one structured read per game written to
      # jerry_cache (narrative + the pipeline-edge struct the app renders as a
      # "The Numbers" panel). Prompts come from the prompt_templates table so
      # rules can be edited without an app build. Runs after Play of the Day so
      # the POTD flag is available.
      #
      # --force on every run: lineups confirm between the 8am and 2pm crons,
      # props re-rank, POTD lines move. Without --force, the 2pm run was
      # skipping all rows because the morning rows already exist — users saw
      # stale reads. Cost is ~15 Claude calls per cron, well worth refresh.
      - name: Generate MLB game reads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_mlb_game_reads.py --force

      # External aggregation pull (2026-07-21) — pulls public handicapper
      # picks + consensus + sharp $ signals from 13 sources into external_picks
      # table with per-source pull_id provenance in external_pull_log.
      # Runs on both crons; --refresh on 2pm-ET (18:00 UTC) hits only sources
      # that publish mid-day (Action Network sharp $, VSiN column drops, Doc
      # Sports finalizations). Per-source scrapers currently live for Covers +
      # VSiN + Doc Sports; rest stubbed and returning 0 gracefully.
      # continue-on-error so a source outage never breaks downstream steps.
      - name: External source aggregation pull
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          if [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then
            python pull_externals_mlb.py --refresh
          else
            python pull_externals_mlb.py
          fi

      # After externals land, run consensus-fade detector to flag games
      # where public heat + fade sources = card-level Tier 1 alert.
      # continue-on-error so an empty picks day never blocks downstream.
      - name: Detect consensus-fade alerts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python detect_consensus_fade.py --sport MLB || echo "fade detector failed (non-fatal)"

      # Jerry synthesis (added 2026-07-31) — new analytical layer that
      # reads every internal model + external pick (with 30d track
      # records) + money flow + primary_play + cohorts and emits ONE
      # actionable call per game with conviction 0-100. Writes to
      # jerry_reads. Runs AFTER externals so Jerry sees today's picks;
      # runs AFTER generate_mlb_game_reads so the struct-build helper +
      # legacy jerry_cache stay in sync.
      #
      # --force on every run: 8am cron writes AM read on partial data
      # (no lineups), 2pm cron overwrites with final read on confirmed
      # lineups + late-published externals + fuller money flow. App
      # labels the AM version as "AM · updates 2pm ET".
      # continue-on-error: never let a bad Jerry call block the pipeline.
      - name: Generate Jerry synthesis reads
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_jerry_synthesis.py --force || echo "jerry synthesis failed (non-fatal)"

      # 2026-08-10: Sharp-fade discipline enforcement. Runs AFTER Jerry synth.
      # Wires the documented sharp-fade + model-consensus rules into the
      # pipeline (previously the rules lived in memory docs but Jerry synth
      # didn't enforce them). Flips totals where:
      #   Rule A: sharp $ >=65% same side + 2+ models on opposite side
      #   Rule B: all 3 models agree (>=0.5 gap) opposite Jerry's pick
      # Idempotent (skips already-flipped reads via short_read marker).
      # non-fatal so a bad DB read doesn't kill the cron — audit step below
      # will catch anything the collapse missed.
      - name: Sharp-fade discipline flips (game-level Jerry)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python collapse_sharp_fade_violations.py || echo "sharp-fade collapse failed (non-fatal)"

      # 2026-08-18: reconcile Jerry call_side to primary_play.side when the
      # ensemble is the authority. Fixes the UI mismatch where the tier
      # pill above the analysis says "HOME ML" but Jerry's prose below
      # argues for the opposite team (STL@CIN 8/18: pp=HOME Reds,
      # jerry_reads=AWAY Cardinals). Runs AFTER all synthesis + fade flips
      # so we reconcile the final Jerry take, not an intermediate one.
      # continue-on-error: reconciler failure never blocks the pipeline;
      # worst case the UI shows the pre-existing mismatch.
      - name: Reconcile Jerry call_side to primary_play
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python reconcile_jerry_to_primary.py --sport MLB || echo "jerry reconcile failed (non-fatal)"

      # 2026-08-10: Pre-publish sanity audit. Runs AFTER all collapse scripts
      # + BEFORE generate_sweat_card. Scans today's reads for known bug
      # patterns (null call_text, opposing-starter leaks, sharp-fade violations
      # missed by auto-flip, duplicate-pitcher hallucinations, orphan numeric
      # flags). Exits 1 on critical findings — GHA step fails, we get notified,
      # sweat card build gets skipped so bad reads don't ship to users.
      # Use --warn-only for a soft version during initial rollout window.
      # 2026-08-11: post-conviction calibration pass. Runs AFTER refit
      # override + collapse scripts, BEFORE the pre-publish audit. Applies:
      #   * 60-64 UNDER hole correction (30d data: 36.4% hit rate)
      #   * Multi-signal promotion rule (confluence+MC+refit → conv >= 78)
      #   * Sub-component scoring (_cc_model_agreement / market_edge / etc)
      #   * Live calibration feedback (recomputes hole detection nightly)
      # Continue-on-error: calibration failure never blocks the audit.
      - name: Conviction calibration pass
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python conviction_calibration_pass.py --sport MLB || echo "calibration pass failed (non-fatal)"

      - name: Jerry pre-publish sanity audit (soft-warn — never blocks card)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # 2026-08-22 PERMANENT FIX: --warn-only + continue-on-error + ||true.
          # THREE-LAYER BYPASS after user flagged this failing repeatedly and
          # burning 50+ min of pipeline API calls only to die at the LAST step
          # before sweat card generation. Previous behavior: sys.exit(1) on
          # any critical Jerry read, killing every downstream step (card,
          # ledger, POTD narrative, degen).
          #
          # New posture: critical issues STILL get logged to
          # jerry_pre_publish_health for monitoring. --repair still auto-fixes
          # known patterns (Layer D scrub + trend-contradict force-PASS).
          # But sanity audit CANNOT kill the pipeline anymore. If Jerry
          # reads are broken, publish the ones that pass and log the failures.
          # Better a partial card than no card after 50 min of compute.
          python jerry_pre_publish_audit.py --sport MLB --repair --warn-only || echo "jerry pre-publish audit reported issues (non-fatal — see log + jerry_pre_publish_health table)"

      # Snapshot game_context (2026-08-02 · adaptive ensemble Phase 1B).
      # Runs AFTER generate_jerry_synthesis so we capture the state Jerry
      # actually saw — mc_probabilities, jerry_pred_*, model_pred_*,
      # panel_*, align_status, oddscrowd, primary_play — write-once per
      # (game_id, snapshot_date). Foundation for per-model backtest 30d
      # from now when we've accumulated ~450 games per model.
      # continue-on-error: snapshot failure never blocks downstream cards.
      - name: Snapshot game_context for adaptive weighting
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python snapshot_mlb_game_context.py || echo "context snapshot failed (non-fatal)"

      # Recompute model_track_records (2026-08-02 · Phase 1B nightly).
      # Reads jerry_cache historical + fresh snapshots; recomputes rolling
      # per-model accuracy so Jerry synth tomorrow has today's data
      # baked in. Runs after snapshot so latest state is captured first.
      - name: Recompute model track records
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_model_track_records.py || echo "model track records failed (non-fatal)"

      # ─── SHARP MONEY MONITORING STACK (2026-08-08 → 2026-08-09) ───
      # Full pipeline: bucket cap → rule cap → per-game audit → self-calibrate.
      #
      # 1) Recompute per-bucket hit rates (sharp_20+ / sharp_15+ etc.)
      # 2) Recompute per-rule hit rates (MODELS_OPPOSE_SHARP / ROAD_TEAM / …)
      # 3) Write today's audit rows (which rules fired on each Jerry pick)
      # 4) Backfill outcomes onto previous audit rows
      # 5) Self-calibrate rule thresholds from full audit trail
      # 6) [Sundays] emit weekly digest w/ trends + P&L
      - name: Sharp — recompute bucket stats
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_divergence_tracker.py || echo "bucket stats failed (non-fatal)"

      - name: Sharp — recompute per-rule stats
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_rules_stats.py || echo "per-rule stats failed (non-fatal)"

      - name: Sharp — write today's audit rows
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_audit.py --write-today || echo "audit write failed (non-fatal)"

      - name: Sharp — backfill audit outcomes
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_audit.py --backfill-results || echo "audit backfill failed (non-fatal)"

      - name: Sharp — self-calibrate rule thresholds
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_audit.py --calibrate || echo "calibrate failed (non-fatal)"

      # Weekly sharp-money digest (Sundays only).
      # Emits week-over-week trend + recency kill switch check +
      # blind-fade P&L simulation. Stored in
      # jerry_cache['sharp_money_weekly_digest_YYYY-WW'].
      # Runs Sundays (day-of-week 0 in cron UTC).
      - name: Weekly sharp money digest
        if: (github.event.schedule == '0 18 * * 0' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_money_weekly_digest.py || echo "weekly sharp digest failed (non-fatal)"

      # Weekly CLV rollup (Sundays only, 2026-08-15).
      # Aggregates clv_snapshots by sport × window (7d/30d/90d) with
      # per-market/tier/model breakdown. Appends to clv_weekly_rollup
      # so we retain the trajectory of model CLV performance over time.
      # CLV is the best proxy for pick quality independent of W/L variance.
      - name: Weekly CLV rollup
        if: (github.event.schedule == '0 18 * * 0' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python clv_weekly_rollup.py --sport ALL || echo "clv rollup failed (non-fatal)"

      # Weekly refresh of Jerry's prompt MODEL PERFORMANCE CONTEXT block.
      # Interim adaptive weighting (2026-08-02) — pulls current lifetime hit
      # rates from model_track_records + live-computes MONEY hit rate from
      # 90d oddscrowd_snapshot vs results, then PATCHes the jerry_synthesis
      # prompt so Jerry sees fresh numbers instead of stale July audit
      # estimates. Runs Sunday only (day-of-week 0) so it doesn't churn the
      # prompt daily — one refresh/week keeps signals fresh without noise.
      # Fully replaced by Phase 3 (dynamic per-request weights) once 30d of
      # Option B snapshot data lands.
      - name: Refresh Jerry prompt performance context (weekly)
        if: (github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          if [ "$(date -u +%u)" = "7" ]; then
            python refresh_jerry_prompt_context.py --sport MLB || echo "prompt refresh failed (non-fatal)"
          else
            echo "skip (not Sunday UTC)"
          fi

      # Jerry-anchored POTD (2026-07-31 · Sweat Card swap). Runs AFTER
      # generate_jerry_synthesis so jerry_reads is populated. Overwrites the
      # legacy play_of_day.py POTD selection with the highest-conviction
      # Jerry read (>=70). If no read clears threshold, marks POTD "no play"
      # (discipline preserved). Card format + app render unchanged — just
      # the pick source is now Jerry's synthesis instead of the composite
      # sweat_score / primary_play.tier logic.
      # continue-on-error: if this fails, users still see legacy POTD.
      - name: Jerry-anchor tonight's POTD
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python jerry_anchor_potd.py --threshold 70 || echo "jerry POTD anchor failed (non-fatal)"

      # Auto-generate tonight's content card after the 2pm ET pipeline run
      # (skip on 8am run since lineups/lines aren't locked yet — content
      # would just be replaced anyway)
      - name: Generate tonight's content card
        if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python generate_tonight_card.py

      # Tomorrow-preview pass (2pm cron only, added 2026-05-27).
      # Builds mlb_game_context rows for tomorrow's slate so the app's
      # "Tomorrow" tab shows real probable pitchers + opening lines +
      # weather forecast + all projected_* stats. Previously the tab
      # rendered Odds-API-only data with no pitcher analytics, and the
      # team→pitcher lookup occasionally surfaced YESTERDAY'S pitcher
      # next to tomorrow's matchups (cache-leak class).
      #
      # Tomorrow rows get the full game_context build minus the
      # training-row log (no result to log). Conviction tiers / NRFI
      # scores / sweat scores / Jerry reads do NOT run on tomorrow
      # rows — those require confirmed lineups + closing lines that
      # land in the morning cron next day. The 6am ET cron overwrites
      # the row fresh once today rolls over.
      - name: Build tomorrow preview slate
        if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          cd mlb_pipeline
          TOMORROW=$(date -u -d '-4 hours +1 day' +%Y-%m-%d)
          echo "Tomorrow ET: $TOMORROW"
          python game_context.py --date "$TOMORROW"
          python verify_starters.py "$TOMORROW"
          # 2026-08-22: parallel bucket warmup (same fix as main run) so
          # tomorrow's context build doesn't inline-refresh serially.
          python warmup_pitcher_buckets.py --date "$TOMORROW" --workers 6 || echo "tomorrow bucket warmup non-fatal"
          python patch_projected_ks.py --date "$TOMORROW"

      # Auto tier calibration — runs daily, computes rolling 7d/30d/STD hit rates
      # per NRFI / confluence / spread_delta tier. Stores to mlb_tier_calibration
      # so app reads LIVE tier hit rates instead of hardcoded "78.9%" claims.
      - name: Refresh tier calibration audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_tier_calibration.py

      # Tier-integrity audit (2026-05-23) — checks whether PRIME hits worse
      # than STRONG etc. across (prop_type, direction). Writes findings to
      # tier_integrity_findings table; exits non-zero on `critical` drift
      # (>=5pt inversion) so the workflow turns red. `continue-on-error`
      # so a critical finding flags the run but doesn't block downstream
      # steps (sweat card still generates, we just see the red badge).
      - name: Tier-integrity drift check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_tier_integrity.py

      # v4 health check (2026-05-23) — tracks v4 ML direction accuracy
      # across 5d / 7d / 14d / 30d windows. Writes to model_health table.
      # When 5d ML drops below 48% the script returns cold status so the
      # workflow can branch on it (today: just warns; later: dynamic
      # throttling of v4 vote weight in confluence).
      - name: v4 model health check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_v4_health.py

      # v4 totals deep audit (2026-05-24) — quantifies OVER vs UNDER hit
      # rates per window + edge size + park split. Companion to v4 health
      # but specifically diagnoses the totals model bias. Output is the
      # 7d OVER hit % that auto-flips model_health.over_suppressed.
      # Runs after audit_v4_health which writes the model_health row;
      # audit_v4_totals just logs (doesn't write) but the visibility is
      # what triggers manual investigation when things drift.
      - name: v4 totals deep audit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_v4_totals.py

      # Signal-attribution scan (2026-05-23) — decomposes losses by signal
      # and signal-pair to find buried negative correlations. Not gating
      # anything yet — just logs to stdout for now. Once findings table
      # ships + sample stabilizes, will recommend specific gate additions.
      - name: Signal attribution scan
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_signal_attribution.py

      # Team recency enrichment (2026-05-23) — self-aggregates L7/L14 team OPS
      # from MLB Stats API gameLog and writes back to mlb_team_offense. Built
      # because Savant doesn't expose date-filtered leaderboards (verified —
      # all variants silently return season-wide). Self-aggregation is more
      # durable anyway: we own the rollup, official MLB data source.
      - name: Team recency enrichment (L7/L14 OPS)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_recency.py

      # Team-vs-opponent H2H recency (2026-05-24) — opponent-specific rolling
      # stats. Built after the LAA-vs-TEX miss: LAA overall L14 was ice cold
      # (51 wRC+ proxy) but they had 14 runs in 2 H2H games vs TEX. Wired as
      # confluence override when |rpg_vs_opp_delta| >= 1.5 R/G with n>=2.
      - name: Team-vs-opponent H2H enrichment
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_vs_opp.py

      # Build Tonight's Sweat Card — server-generated structured card for
      # the app's MLB tab. Reads everything upstream wrote (POTD, Dawg,
      # props, NRFI, tier rates) and emits one JSON row the app reads via
      # get_todays_sweat_card RPC. Runs every cron so card refreshes as
      # lineup confirmations / ump landings flow through pipeline data.
      - name: Generate Sweat Card
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python generate_sweat_card.py

      # Post-build refit re-hydration (2026-08-15 pm fix). Refit_conviction
      # gets partially wiped during downstream card-build steps (some prop
      # regen / patch cycles leave rows with null refit). Re-run at very
      # end of pipeline so app reads see fully-hydrated refit values.
      # Idempotent — upserts on (game_id, prop_id).
      - name: Re-apply prop refit (post-card hydration)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python apply_prop_refit.py || echo "post-card refit re-apply failed (non-fatal)"

      # 2026-08-18: prop_pick_snapshots — IMMUTABLE snapshot of every
      # shipping pick's odds/tier at card-lock time. Fixes the accountability
      # gap where book_over_odds on mlb_pipeline_props can be overwritten by
      # later cron runs, so historical PnL was using flat -110 fallback and
      # overstating results by ~46%. Runs LAST so we capture the final
      # settled state the user actually sees. Requires migration
      # 20260818_prop_pick_snapshots.sql to have been applied.
      - name: Snapshot picks at card-lock (accountability)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python snapshot_pick_lock.py --sport MLB --source card_lock || echo "snapshot non-fatal"

      # ─── Steam Room (2026-08-13) ───────────────────────────────────
      # write_line_history: per-book odds snapshot (fuels sparklines)
      # detect_line_movement: steam / RLM / limit pattern detection
      # steam_room_ladder: evaluate today's plays against strict qualifier
      #                     gates; sets ladder_state to active|waiting
      # resolve_ladder_results: backfill W/L on pending rungs after games
      #                          grade; updates streak counters on state.
      # Runs across ALL sports (per-sport dispatch inside each script).
      # Failures non-fatal — Steam Room tab shows empty state, doesn't
      # break the card generation upstream.
      - name: Steam Room — per-book line snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python write_line_history.py --sport ALL || echo "line_history write failed"

      - name: Steam Room — detect line movement patterns
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python detect_line_movement.py --sport ALL --lookback-hours 6 || echo "line detector failed"

      # ─── Line movement intelligence (NEW 2026-08-15) ──────────────
      # Cross-references the raw steam/RLM/limit flags detected above with
      # oddscrowd money%/bets% + fadereport bettors%/handle% to classify
      # each move as SHARP_MOVE / PUBLIC_MOVE / RLM / CONSENSUS. This
      # classification is what turns "line moved 0.5pt" from noise into
      # a real signal — used by play_of_day's sharp-conflict driver.
      # Sport-universal (--sport ALL).
      - name: Line movement — classify sharp vs public
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python classify_line_moves.py --sport ALL || echo "line classifier failed"

      # Fadereport sharp-signal scrape (Playwright). Second source of
      # public splits (handle%/bettors%) alongside OddsCrowd. Cross-source
      # agreement is the quality gate for classify_line_moves — only fires
      # loud SHARP_CONFIRMED / PUBLIC_CONFIRMED when both sources agree.
      # Without FR flowing, everything falls to _LEAN and pattern engine
      # "both_sources_*" seeds never accumulate. Wired 2026-08-15 pm.
      - name: Fadereport — scrape sharp signals (all sports)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python fadereport_scraper.py || echo "fadereport scraper failed (non-fatal)"

      # Cleatz.com public splits scraper (2026-08-15 pm) — 3rd public-splits
      # source alongside OddsCrowd + Fadereport. Full-slate coverage with
      # both handle% and bets% per side across ML/RL/Total. Cross-source
      # agreement across all 3 = highest confidence signal (SHARP_TRIPLE_
      # CONFIRMED once classifier extended). Writes to cleatz_signals table.
      - name: Cleatz — scrape full-slate public splits (MLB/NFL/CFB)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python cleatz_scraper.py || echo "cleatz scraper failed (non-fatal)"

      # ScoresAndOdds scraper (2026-08-23) — 4th public-splits source.
      # Writes directly to public_splits_v2 (source-agnostic schema
      # shipped tonight in Phases 1-3). Prior to this workflow step,
      # SO only ran when manually invoked → data went stale between
      # user checks. Now populates every cron cycle alongside FR + CZ.
      - name: ScoresAndOdds — scrape 4th splits source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python pull_scoresandodds.py --sport MLB || echo "SO scraper failed (non-fatal)"

      # Splits v2 aggregator (2026-08-23) — normalizes rows from
      # oddscrowd (public_splits_archive) + fadereport_signals +
      # cleatz_signals into public_splits_v2 long-form, then computes
      # game_context.splits_summary JSONB per game. Runs AFTER all
      # source scrapers so the aggregator sees the newest per-source
      # values. Silent no-op if no sources landed.
      - name: Splits v2 aggregator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python splits_v2_pipeline.py --sport MLB || echo "splits v2 aggregator failed (non-fatal)"

      # Archive both public split sources side-by-side per snapshot
      # (2026-08-15). Feeds the living pattern-discovery engine below —
      # nothing is meaningful the day it happens; it's the cumulative
      # archive that surfaces edge over time.
      - name: Line movement — archive public splits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python archive_public_splits.py --sport ALL || echo "splits archive failed"

      # Living pattern engine — refresh registered hypotheses nightly
      # + aggressive background discovery scan. Sport-universal. Only
      # patterns that clear VALIDATED tier get consumed downstream by
      # play_of_day drivers. DISCOVERY tier is where auto-surfaced
      # candidates land; they need to accumulate n>=50 + edge>=5pp
      # before promoting.
      - name: Line movement — mine patterns (refresh + discover)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python mine_line_patterns.py --refresh --sport ALL || echo "pattern refresh failed"
          python mine_line_patterns.py --discover --sport ALL || echo "pattern discover failed"

      # Freeze TRUE closing lines at T-Xmin (per line_movement_config).
      # Distinguishes "close_total was set by most recent pull" from
      # "close_total is the actual line at first pitch minus X min."
      # Stamps close_locked_at on <sport>_game_context so downstream
      # CLV computation knows the freeze is real.
      - name: Line movement — freeze true closing lines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python freeze_closing_lines.py --sport ALL || echo "close freezer failed"

      - name: Steam Room — ladder qualifier check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python steam_room_ladder.py || echo "ladder engine failed"

      - name: Steam Room — resolve ladder rung results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python resolve_ladder_results.py || echo "ladder resolver failed"

      # The Ledger — auto-generate today's chalk parlays + teasers
      # (2026-08-17). Cross-sport: reads MLB + NFL + NCAAF + NCAAB
      # ensemble picks and produces 2-4 suggested combos for the
      # Steam Room's 4th sub-tab. Non-fatal — Ledger empty just
      # means no eligible combos today.
      # 2026-08-18: alt-line puller BEFORE ledger so teased combos use
      # real book prices (Over 6.5 @ -280 actual) instead of teaser_price
      # estimator. Only runs on the morning cron (10 UTC = 6am ET) to
      # keep Odds API cost low — alt lines don't need per-cron refresh.
      - name: Pull alt-line prices (morning only, all sports)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python pull_alt_lines.py || echo "alt lines fetch failed (Ledger falls back to estimator)"

      - name: Steam Room — generate Ledger suggestions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python generate_ledger.py || echo "ledger generator failed"

      # 2026-08-18: snapshot every shipped Ledger suggestion IMMUTABLY —
      # transparency parity with Sharp Card / prop_pick_snapshots.
      # Grader (grade_ledger_snapshots) backfills W/L + unit_pnl.
      - name: Snapshot Ledger suggestions (accountability)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python snapshot_ledger.py || echo "ledger snapshot failed (non-fatal)"

      # Ledger grader — runs after grade_props to catch newly-resolved games
      - name: Grade Ledger snapshots (last 7 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python grade_ledger_snapshots.py --days 7 || echo "ledger grader failed (non-fatal)"

      # 2026-08-22: aggregate daily records for every surface (sharp_card,
      # ledger_*, ladder, potd, dawg_of_day, daily_degen) into
      # daily_surface_records. Root cause: script existed since 8/20 but was
      # never in cron so the table was empty and app record cards for every
      # sub-tab were computed on the fly (fragile / inconsistent) or showed
      # stale/wrong numbers. Runs AFTER all graders so today's outcomes are
      # counted. Backfills 3 days each run so late-graded rows catch up.
      # Idempotent — writer deletes existing (surface, sport, date) row
      # before insert.
      - name: Aggregate daily surface records
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python aggregate_daily_records.py --backfill 1 || echo "daily records aggregator failed (non-fatal)"

      # ─── Session A monitoring dashboard (2026-08-14) ─────────────
      # Populates hit_rate_snapshots + rule_fire_stats + dashboard_alerts.
      # Sport-universal — one nightly run covers every registered sport.
      # Runs AFTER all sport pipelines finish so today's grades are counted
      # in the 7d/30d/90d rolling windows. continue-on-error: monitoring
      # failure never blocks the main pipeline (dashboard staleness would
      # itself trigger the stale_snapshot alert on the next successful run).
      - name: Monitoring — hit-rate snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python compute_hit_rate_dashboard.py --sport ALL || echo "hit-rate compute failed"

      - name: Monitoring — rule-fire stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python compute_rule_fire_stats.py --sport ALL || echo "rule-fire compute failed"

      - name: Monitoring — anomaly alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python alert_dashboard_anomalies.py || echo "alert engine failed"

      # 2026-08-14 Session B: data quality event aggregator + sanity checks
      # Promotes recurring silent-failure trips to dashboard_alerts and runs
      # spot cross-checks (e.g., ctx.last_ip vs MLB API). Sport-universal.
      - name: Monitoring — data quality daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python check_data_quality_daily.py || echo "DQ daily failed"

      # 2026-08-14 Session C: rule backtest + auto-promotion
      # Backfills actual outcomes on rule_shadow_log rows for graded picks,
      # computes 30d rolling hit rates per rule, promotes shadow→active for
      # rules that hit their gate, writes regression alerts for active rules
      # that drift below baseline. Sport-universal.
      - name: Monitoring — rule backtest + auto-promote
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python backtest_rules.py || echo "rule backtest failed"

      # 2026-08-14 Session D: in-app user notes dispatcher
      # Reads monitoring signals + generates notes surfaced as dismissible
      # cards at top of Home tab. Data-first tone per LANGUAGE_GUARDRAILS.md.
      # Frequency-capped 1-per-21-days per category. In-app only (no email,
      # no push per user direction).
      - name: Monitoring — user notes dispatch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        continue-on-error: true
        run: |
          cd mlb_pipeline
          python dispatch_user_notes.py || echo "user note dispatch failed"

      # Pipeline health check — catches silent skips like the 5/19 case
      # where play_of_day.py's late-slate defer was returning before the
      # sweat-score write loop, leaving every game with sweat_score = null.
      # Non-zero exit on critical field misses fails this workflow step so
      # the red status surfaces in the Actions run list.
      - name: Pipeline health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python check_pipeline_health.py

      # 2026-08-22: signal-wiring verifier (soft-warn) — walks every enabled
      # signal_sources row, regex-extracts ctx.X references, compares against
      # actual game_context columns per sport. Reports any signal reading a
      # missing ctx column. Silent-bug audit 8/22 found 19 signals broken
      # this way (see project_pipeline_audit_822). This step catches
      # regressions immediately in the workflow log instead of them
      # silently returning None for months.
      # Non-fatal (continue-on-error) so warnings surface without red-X-ing
      # the workflow — the check_pipeline_health above is authoritative for
      # workflow status.
      - name: Signal wiring verifier (soft-warn)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python verify_signal_wiring.py || echo "verify_signal_wiring reported issues (non-fatal, see log)"

      # Commit the generated content card so Andy can pull it locally.
      # 5/29 incident: two parallel runs both generated the same dated
      # card file; second run hit `CONFLICT (add/add)` on rebase and
      # the workflow died. Fix: auto-resolve in favor of our freshly-
      # generated card (it's deterministic from current supabase state).
      # Rebase's ours/theirs are inverted from merge's: in `git pull
      # --rebase`, "theirs" means our local commits being replayed —
      # which is what we want to keep.
      - name: Commit content card
        if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          cd ${{ github.workspace }}
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add content/*.md
          if git diff --cached --quiet; then
            echo "No content card changes to commit"
            exit 0
          fi
          git commit -m "Auto-generated tonight's card $(date +%Y-%m-%d)"
          # Auto-resolve add/add conflicts on the content card in favor
          # of our freshly-generated version. The card is deterministic
          # from current supabase state — taking the later run's card
          # is always the safe call.
          #
          # --autostash added 2026-06-09 after a workflow run hit
          # "cannot pull with rebase: You have unstaged changes" when
          # earlier steps (cohort_signals refresh, model artifacts) left
          # files dirty. autostash transparently stashes + restores so
          # the rebase always has a clean tree to work with.
          if ! git pull --rebase --autostash -X theirs origin main; then
            echo "::warning::Rebase conflict on content card — taking our version"
            git checkout --theirs content/*.md
            git add content/*.md
            GIT_EDITOR=true git rebase --continue
          fi
          git push