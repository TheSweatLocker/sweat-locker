name: MLB Pipeline Daily

on:
  schedule:
    - cron: '0 12 * * *'  # 8:00am EDT (12:00 UTC)
    - cron: '0 18 * * *'  # 2:00pm EDT (18:00 UTC)
  workflow_dispatch:

jobs:
  run-mlb-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for the auto-commit step to push content/*.md

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybaseball requests python-dotenv beautifulsoup4 scikit-learn numpy xgboost

      - name: Run pitcher stats update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pitcher_stats.py

      - name: Run bullpen stats update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python bullpen_stats.py

      - name: Run team offense stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python team_stats.py

      - name: Run Savant enrichment (OAA, xwOBA, barrel%, catcher framing)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python savant_enrichment.py

      - name: Run game context pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          cd mlb_pipeline
          python game_context.py

      - name: Update team HR threats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python team_hr_threats.py

      - name: Compute pitcher offense-class projections (before props — props read this)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_pitcher_class_projections.py

      - name: Build HR Watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python build_hr_watch.py

      - name: Generate pipeline props
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python generate_props.py

      - name: Generate Daily Degen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_daily_degen.py

      - name: Generate Dawg of the Day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_dawg_of_day.py

      # NFL Phase 1 prep — team-stats puller (Tuesdays during NFL season).
      # NFL season runs Aug-Feb (preseason starts Aug, regular season Sept,
      # playoffs Jan-Feb). Outside that window, no fresh data so we no-op.
      # Tuesday cadence picks up Sun/Mon games in nflverse without missing
      # latency for the Thursday slate-card drop (Phase 2).
      - name: Pull NFL team stats (Tuesdays during season)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          MONTH=$(date -u -d '-4 hours' +%m)
          # Tuesday = 2; in-season = Aug (08) - Feb (02)
          if [ "$DAY" = "2" ] && { [ "$MONTH" -ge 08 ] || [ "$MONTH" -le 02 ]; }; then
            echo "Tuesday in NFL season — pulling team stats"
            cd mlb_pipeline
            python nfl_pipeline.py
          else
            echo "Not Tuesday or out of NFL season (day=$DAY month=$MONTH) — skipping"
          fi

      # NCAAB Phase 1 prep — server-side KenPom puller (Mondays only).
      # Once season starts (Nov 2026), bump cadence to daily by removing
      # the day gate. Until then KenPom is mostly static offseason and
      # weekly is plenty.
      - name: Pull NCAAB KenPom snapshot (Mondays only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KENPOM_KEY: ${{ secrets.KENPOM_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — pulling KenPom snapshot"
            cd mlb_pipeline
            python ncaab_pipeline.py
          else
            echo "Not Monday (day=$DAY) — skipping NCAAB pull"
          fi

      - name: Update umpire database (Mondays only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — updating umpire database"
            cd mlb_pipeline
            python umpires_scrape.py
          else
            echo "Not Monday (day=$DAY) — skipping umpire update"
          fi

      - name: Run UFC card scraper (Thursdays only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "4" ]; then
            echo "Thursday — running UFC card scraper"
            cd mlb_pipeline
            python ufc_card_scraper.py
          else
            echo "Not Thursday (day=$DAY) — skipping UFC scraper"
          fi

      - name: Score UFC card (Thursdays only, post-scraper)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "4" ]; then
            echo "Thursday — scoring UFC card via v1 model"
            cd mlb_pipeline
            python ufc_score_card.py
          fi

      - name: Resolve UFC fights (Sundays/Mondays after weekend cards)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DAY=$(date -u -d '-4 hours' +%u)
          if [ "$DAY" = "7" ] || [ "$DAY" = "1" ]; then
            echo "Sun/Mon — resolving completed UFC fights"
            cd mlb_pipeline
            python ufc_resolve_fights.py
          fi
      
      - name: Resolve prop grades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_props.py

      - name: Resolve NRFI results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_nrfi.py

      - name: Resolve game results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_game_results.py

      - name: Run NBA team stats update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_pipeline.py

      - name: Log NBA picks (per-game features + market lines)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_pick_logger.py

      - name: Generate NBA conviction-tier picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_picks_generator.py

      # Server-side Jerry NBA game reads — one structured read per game (model
      # spread/total edge, efficiency splits, recency drift, injuries, picks)
      # written to jerry_cache. Prompts come from the prompt_templates table.
      - name: Generate NBA game reads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_nba_game_reads.py

      - name: Resolve NBA results (BDL boxscores)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_pick_logger.py --resolve

      - name: Generate Play of the Day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python play_of_day.py

      # Server-side Jerry game reads — one structured read per game written to
      # jerry_cache (narrative + the pipeline-edge struct the app renders as a
      # "The Numbers" panel). Prompts come from the prompt_templates table so
      # rules can be edited without an app build. Runs after Play of the Day so
      # the POTD flag is available.
      - name: Generate MLB game reads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_mlb_game_reads.py

      # Auto-generate tonight's content card after the 2pm ET pipeline run
      # (skip on 8am run since lineups/lines aren't locked yet — content
      # would just be replaced anyway)
      - name: Generate tonight's content card
        if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python generate_tonight_card.py

      # Auto tier calibration — runs daily, computes rolling 7d/30d/STD hit rates
      # per NRFI / confluence / spread_delta tier. Stores to mlb_tier_calibration
      # so app reads LIVE tier hit rates instead of hardcoded "78.9%" claims.
      - name: Refresh tier calibration audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_tier_calibration.py

      # Build Tonight's Sweat Card — server-generated structured card for
      # the app's MLB tab. Reads everything upstream wrote (POTD, Dawg,
      # props, NRFI, tier rates) and emits one JSON row the app reads via
      # get_todays_sweat_card RPC. Runs every cron so card refreshes as
      # lineup confirmations / ump landings flow through pipeline data.
      - name: Generate Sweat Card
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python generate_sweat_card.py

      # Commit the generated content card so Andy can pull it locally.
      # Stripped the `|| true` chain that was hiding failures for 4 days
      # (5/1 - 5/4 ran with no auto-commit and no error surface). Now:
      #   - git add only fails loud if content/ doesn't exist (it should)
      #   - empty diff is the only path that exits early without a commit
      #   - rebase before push handles race with manual local commits
      - name: Commit content card
        if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          cd ${{ github.workspace }}
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add content/*.md
          if git diff --cached --quiet; then
            echo "No content card changes to commit"
            exit 0
          fi
          git commit -m "Auto-generated tonight's card $(date +%Y-%m-%d)"
          # Rebase against the remote in case a manual push landed between
          # this job's checkout and now. Surface conflicts loudly instead
          # of swallowing them.
          git pull --rebase origin main
          git push