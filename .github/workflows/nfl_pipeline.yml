name: NFL Pipeline Weekly

on:
  schedule:
    # 7-cron NFL cadence (see project_nfl_phase1_ready_721.md).
    # Times are 30-60 min earlier than user-facing "ready by" to absorb
    # GitHub Actions queue drift (same pattern as MLB pipeline).
    - cron: '0 15 * * 2'   # Tue 11am ET  — nflverse schedule + opening lines
    - cron: '0 22 * * 3'   # Wed 6pm ET   — externals pull + props v1 (Phase 2)
    - cron: '0 18 * * 4'   # Thu 2pm ET   — TNF finalize (weekly card LOCK)
    - cron: '0 14 * * 6'   # Sat 10am ET  — Sunday early-slate lock
    - cron: '0 12 * * 0'   # Sun 8am ET   — final Sunday card
    - cron: '0 14 * * 1'   # Mon 10am ET  — MNF finalize + Sunday resolver
    - cron: '0 15 * * 2'   # (duplicated Tue — full-week resolver + cohort grades)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which sub-pipeline to run manually'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - odds_only
          - card_only
          - resolver_only
          - cohorts_only

jobs:
  nfl-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4 nfl_data_py pandas scikit-learn numpy xgboost

      - name: Detect run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H); DOW=$(date -u +%u)
            # Sun 12:00 UTC → final Sunday card; Sat 14:00 UTC → early-slate lock;
            # Tue 15:00 UTC → weekly resolver + cohorts; else → full run.
            if [ "$DOW" = "7" ] && [ "$HOUR" = "12" ]; then echo "mode=card_only" >> $GITHUB_OUTPUT
            elif [ "$DOW" = "6" ] && [ "$HOUR" = "14" ]; then echo "mode=card_only" >> $GITHUB_OUTPUT
            elif [ "$DOW" = "2" ] && [ "$HOUR" = "15" ]; then echo "mode=resolver_only" >> $GITHUB_OUTPUT
            elif [ "$DOW" = "1" ] && [ "$HOUR" = "14" ]; then echo "mode=resolver_only" >> $GITHUB_OUTPUT
            else echo "mode=full" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Pull Odds API NFL lines
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'odds_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_odds_pull.py || echo "nfl_odds_pull failed (non-fatal)"

      - name: Pull Odds API preseason lines (Aug only)
        if: (steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'odds_only')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          MONTH=$(date -u +%m)
          if [ "$MONTH" = "08" ]; then
            cd mlb_pipeline && python nfl_odds_pull.py --preseason || echo "preseason pull failed"
          else
            echo "skipping preseason pull (month=$MONTH)"
          fi

      - name: Refresh team + player stats (nflverse)
        if: steps.mode.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_pipeline.py || echo "nfl_pipeline (team stats) failed"
          python nfl_player_stats.py || echo "nfl_player_stats failed"

      # 2026-08-09 Phase 2: pull fresh Sleeper + ESPN player projections
      # BEFORE game_context builds, so Panel model has fresh data. Both
      # pullers are idempotent (upserts on (source,season,week,player_id)).
      - name: Pull NFL player projections (Sleeper + ESPN)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # Compute NFL week from date. 2026-08-25: pre-season within 21d
          # of Week 1 pulls Week 1 anyway — Sleeper publishes Week 1 lines
          # in mid-August, ESPN closer to first game. Prior "days<0 → skip"
          # meant nfl_player_projections sat empty for ~3 weeks pre-season.
          SEASON=$(date +%Y)
          WEEK=$(python -c "
          from datetime import date
          d = date.today()
          y = d.year
          sept1 = date(y,9,1)
          first_thu = (3 - sept1.weekday()) % 7
          wk1_start = date(y, 9, 1 + first_thu)
          days = (d - wk1_start).days
          if days >= 0:
              print(max(1, min(18, days // 7 + 1)))
          elif days >= -21:
              print(1)  # pull Week 1 early (pre-season window)
          else:
              print(0)
          ")
          if [ "$WEEK" -gt 0 ]; then
            python nfl_sleeper_projections_pull.py --season $SEASON --week $WEEK || echo "sleeper failed"
            python nfl_espn_projections_pull.py --season $SEASON --week $WEEK || echo "espn failed"
          fi

      - name: Build NFL game context (projections + confluence + sweat + Panel)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_game_context.py || echo "game_context failed"

      # 2026-08-24: Madden NFL 27 talent prior seed + enrich.
      # Seed is idempotent (upsert on team,season,week_snapshot) — safe
      # to run every cron. Weekly refresh scraper (madden27.wiki) will
      # replace the seed call once built. Enricher patches nfl_game_context
      # with madden_ovr_gap_home / madden_off_gap_home / madden_qb_delta_home
      # so shadow signals ncaaf_madden_* fire on next scoring pass.
      # See project_madden_top100_nfl_signal_824.
      - name: Seed / refresh Madden NFL 27 launch snapshot
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          SEASON=$(date +%Y)
          python seed_nfl_madden_launch.py --season $SEASON || echo "Madden seed failed (non-fatal)"

      - name: Enrich NFL ctx with Madden ratings + Top 100
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_ctx_nfl_madden.py --days-ahead 14 || echo "Madden ctx enrich failed (non-fatal)"

      # 2026-08-22: LIVE ORPHAN WIRES — these scripts existed but had no
      # cron caller despite SQL migrations and app code (GameDetailV2.tsx)
      # depending on their output tables. Adding them now so NFL launch
      # 9/4 has weather + injuries + starters populated for game reads.
      - name: Pull NFL weather (OpenWeather, next 7 days)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_weather_pull.py || echo "NFL weather pull failed (non-fatal)"

      - name: Pull NFL injuries (nfl_data_py)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_injuries_pull.py || echo "NFL injuries pull failed (non-fatal)"

      - name: Pull NFL starters (ESPN scoreboard)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_weekly_starters.py || echo "NFL starters pull failed (non-fatal)"

      # Backfill L4 team ATS / O/U / ML tendencies on today's rows
      # (2026-08-17). Activates the 10 NFL team_form signals in
      # signal_sources. Runs AFTER nfl_game_context.py (rows must
      # exist to patch) and BEFORE any downstream Jerry / sweat card
      # step so tendencies land in ctx before consumption.
      # Non-fatal — failure just means team_form signals evaluate
      # to None and pass.
      - name: Backfill NFL team ATS/OU tendencies
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_nfl_team_tendencies.py || echo "nfl tendencies backfill failed (non-fatal)"

      # 2026-08-17: teamrankings season aggregates + enrichment for
      # season_trend signals. Runs AFTER rolling tendencies so both
      # signal sets stack. Non-fatal.
      - name: Pull NFL season trends from teamrankings
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_teamrankings_trends.py --sport NFL || echo "teamrankings NFL pull failed (non-fatal)"

      - name: Enrich NFL game context with season trends
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_trends.py --sport NFL || echo "NFL trend enrichment failed (non-fatal)"

      # 2026-08-18: universal team-form (venue-split L10 + H2H last 5)
      - name: Enrich team form — venue split + H2H
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NFL --days-ahead 14 || echo "team_form_universal non-fatal"

      # 2026-08-28: derive per-team defense stats (PPG, pass_ypg,
      # rush_ypg, pass_epa_allowed, rush_epa_allowed) from opponent
      # offense. Fills the gap where nfl_team_stats only holds offense
      # + defensive-event counts (sacks, INTs) but no yards allowed.
      # Fuels the 4 nfl_def_matchup_* signals and the team-defense
      # section of the game detail card.
      - name: NFL team defense stats backfill
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_team_defense_backfill.py || echo "NFL defense backfill non-fatal"

      # 2026-08-13 · 5-model coverage rollout: NFL MC simulator.
      # Runs AFTER game_context so it can read team stats + close_total,
      # then writes mc_probabilities blob back. compute_primary_play
      # (called on next game_context run) picks it up as the 5th lens.
      # Ordering intentional — the MC output is stored ready for next
      # cycle's primary_play resolver to consume.
      - name: NFL Monte Carlo simulator
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_mc_simulator.py || echo "NFL MC failed (non-fatal)"

      # 2026-08-13 · 5-lens rollout: V3 situational-regression.
      # Reads projected_spread/projected_total (Matchup-EPA base) + weather +
      # rest + division flag, applies additive adjustments. Writes v3_spread
      # + v3_total + v3_adjustments. Runs AFTER game_context so base
      # projections + weather/rest fields are populated first.
      - name: NFL V3 regression model
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_v3_regression.py || echo "NFL V3 failed (non-fatal)"

      # 2026-08-13 · 5-lens rollout: V4 XGBoost inference.
      # Loads models/nfl_v4_{spread,total}.pkl (trained via nfl_v4_train.py
      # in an offline job — retrain ~yearly post-season). Runs inference on
      # tonight's slate, writes v4_spread/v4_total/v4_confidence.
      # No-op gracefully if models file missing (pre-first-train state).
      - name: NFL V4 XGBoost inference
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_v4_inference.py || echo "NFL V4 inference failed (non-fatal)"

      - name: Generate NFL picks (play-of-day + lock_of_week)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_play_of_day.py || echo "play_of_day failed"

      - name: Generate NFL player props
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_generate_props.py || echo "props failed (non-fatal)"

      # 2026-08-17: NFL prop playbook shadow-mode pipeline.
      # Same pattern as MLB: backfill L10 lookback → run prop_ensemble_scorer.
      # NFL doesn't have apply_prop_refit yet (refit weights are MLB-only),
      # so playbook works from legacy_conviction + player_l10 signals only.
      # Non-fatal — playbook is shadow-mode.
      - name: Backfill NFL prop L5/L10 lookback
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_lookback.py --sport NFL || echo "NFL prop lookback failed (non-fatal)"

      - name: NFL prop playbook scorer (shadow mode)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_ensemble_scorer.py --sport NFL --refresh-existing || echo "NFL prop playbook failed (non-fatal)"

      - name: External source aggregation pull
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_nfl.py || echo "external pull failed (non-fatal)"

      # 2026-08-22: Compute alignment + write oddscrowd_snapshot to
      # nfl_game_context. Required prerequisite for the sharp-split
      # signals to fire on NFL games (registry exists but was silent
      # because oddscrowd_snapshot was never populated). Runs after
      # external pull so OC data is fresh in external_picks.
      - name: Compute alignment + oddscrowd snapshot
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_align_status_nfl.py || echo "align status failed (non-fatal)"

      # 2026-08-22: Flatten oddscrowd_snapshot into line_snapshot so the
      # cross-sport classify_line_moves.py --sport ALL step (in
      # mlb_pipeline.yml) can generate line_movement_flags for NFL.
      - name: Write line_snapshot from oddscrowd data
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python write_line_snapshot.py --sport NFL || echo "write_line_snapshot NFL failed (non-fatal)"

      - name: Generate NFL game reads (Jerry)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_nfl_game_reads.py || echo "game reads failed (non-fatal)"

      # 2026-08-28 Phase 3: sync jerry_reads from primary_play + narrative.
      # NFL prompt writes prose only; without sync, jerry_reads never fills.
      # See docs/JERRY_UNIFICATION.md.
      - name: Sync NFL jerry_reads from ctx
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sync_jerry_reads_from_ctx.py --sport NFL --window 8 || echo "NFL jerry_reads sync failed"

      - name: Build weekly slate card
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_weekly_card.py || echo "weekly card failed"

      - name: Resolve completed games + backfill scores
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_nfl_results.py || echo "resolver failed"
          # 2026-08-23 season-ready: grade NFL props (was game-results-only)
          python resolve_nfl_props.py || echo "prop resolver failed (non-fatal)"

      # 2026-08-25: refresh home/road tendencies materialized view after
      # results resolver. Powers the Trends & Tendencies card in the NFL
      # slot redesign. Uses refresh_home_road_tendencies(sport) RPC from
      # 20260826b migration.
      - name: Refresh NFL home/road tendencies view
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_home_road_tendencies" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_sport": "NFL"}' || echo "tendencies refresh failed"

      # 2026-08-23 season-ready: refresh signal_registry from freshly graded
      # NFL props. Feeds the sign-constrained refit training (once Weeks 1-3
      # accumulate enough graded rows for MIN_SAMPLE gates to fire). Silent
      # no-op until then. Sport-universal script.
      - name: Refresh NFL signal_registry from graded props
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport NFL --days 30 || echo "NFL signal calibration failed (non-fatal)"

      - name: Recompute cohort calibration
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'cohorts_only' || steps.mode.outputs.mode == 'resolver_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nfl_cohort_backfill.py || echo "cohort backfill failed"

      # 2026-08-09 Phase 2: sharp-money audit trail for NFL games.
      # Same infra as MLB — writes per-game rules_triggered + cap outcome
      # so we can build NFL fade-rule stats over time.
      - name: NFL — write today's sharp-fade audit rows
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_audit.py --write-today --sport NFL || echo "NFL audit write failed"

      - name: NFL — backfill sharp-fade audit outcomes
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
