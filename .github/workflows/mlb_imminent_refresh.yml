name: MLB Imminent Game Refresh

# Watchdog: every 30 min from ~12pm to ~10pm ET, refresh lineups + umpires
# for games starting in the next 30-120 min. Plugs the gap between the fixed
# 6am/2pm pipeline runs and game-time confirmations.

on:
  schedule:
    # 12:00, 12:30 ... 7:30pm ET = 16:00, 16:30 ... 23:30 UTC
    - cron: '*/30 16-23 * * *'
    # 8:00, 8:30, 9:00, 9:30, 10:00pm ET = 00:00, 00:30, 01:00, 01:30, 02:00 UTC
    - cron: '*/30 0-2 * * *'
  workflow_dispatch:

jobs:
  refresh-imminent:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Refresh imminent-game lineups + umpires
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_imminent_games.py

      # 2026-08-20: recompute primary_play every 30 min so late-arriving
      # data (external_pick feeds, sharp_source_calibration, refit updates,
      # OddsCrowd refresh) actually flows into the tier + label. Audit on
      # 8/20 caught 3/9 games with STALE primary_play — Yankees/Orioles
      # was on the wrong side entirely (persisted Yankees ML but live
      # ensemble picked Orioles ML after external picks landed). The AM
      # pipeline run computes primary_play once and never revisits it, so
      # the app renders an increasingly stale snapshot as the day
      # progresses. This step closes the loop — cheap (~1 min for 9-15
      # games, no external API calls beyond Supabase).
      - name: Recompute primary_play (catch late-arriving signal data)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python recompute_primary_play.py

      # 2026-09-30: "Classify fresh line moves (Split refresh)" MOVED OUT of
      # this workflow to multisport_line_poller.yml. It ran
      # classify_line_moves.py --sport ALL — cross-sport work hosted by a
      # baseball workflow, the same defect as
      # project_mlb_workflow_hosts_other_sports_928. Every other sport's Split
      # would have gone stale the day MLB was turned off. It now runs 37x/day
      # from the multi-sport poller instead of 22x/day from here.
      #
      # The remaining steps in this workflow ARE MLB-only and belong here:
      # refresh_imminent_games.py and apply_prop_refit.py are hardcoded to
      # mlb_game_context / mlb_pipeline_props, and recompute_primary_play.py is
      # the MLB one (NFL and NCAAF have their own recompute_* scripts).

      # 2026-08-20: also re-apply prop refit each cycle. Today's audit
      # found every prop with refit_conviction=NULL — main pipeline runs
      # apply_prop_refit once in AM but props get regenerated later
      # (lineup confirmations, odds sweeps) which wipes refit values.
      # Re-applying keeps refit_conviction fresh alongside primary_play.
      - name: Re-apply prop refit (keep refit_conviction fresh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "apply_prop_refit.py" python apply_prop_refit.py

      # 2026-09-24 B18 — turn a green-but-broken run red.
      #
      # Every masked step above used to end in `|| echo "... non-fatal"`,
      # which makes the shell succeed, so the step succeeds, so the job
      # succeeds. A grader could fail nightly and the run still showed a
      # green check. That is the mechanism behind "no games resolved
      # yesterday" and "no prime props today".
      #
      # The masks were not simply deleted: one flaky optional scraper would
      # then abort the graders and writers that run after it. Continuing is
      # correct. Continuing silently and claiming success is the bug.
      # run_step.sh records each failure and still returns 0; this gate
      # fails the run at the end with the list.
      - name: Fail the run if any step failed
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
