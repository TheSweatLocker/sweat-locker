name: MLB OddsCrowd Refresh (6-shot daily cadence)

# OddsCrowd public/money% throughout the day. 2026-08-15: bumped from
# 4 to 6 shots so the pattern-discovery archive gets denser trajectory
# density in the T-3h → T-15min sharp-money window. User's 100k odds API
# credit tier absorbs the extra pulls comfortably.
#
# Each pull re-fires compute_align_status + writes line_snapshot +
# appends public_splits_archive (both sources side-by-side for pattern
# miner). RLM detector runs at the end.
#
# Times (America/New_York, DST-aware — cron is UTC so we cover both):
#   8am ET  · morning line (12:00 UTC EDT / 13:00 UTC EST)
#   11am ET · morning-lock check (15:00 UTC EDT / 16:00 UTC EST)  ← NEW 8/15
#   12pm ET · midday adjust (16:00 UTC EDT / 17:00 UTC EST)
#   3pm ET  · afternoon-slate lock (19:00 UTC EDT / 20:00 UTC EST)
#   6pm ET  · pre-primetime whale money (22:00 UTC EDT / 23:00 UTC EST)
#   9pm ET  · late-night close monitor (01:00 UTC EDT / 02:00 UTC EST) ← NEW 8/15
#
# Backfill: pull is idempotent via (source, game_id, surface, pick_side,
# game_date) unique index (20260727b) — repeat pulls overwrite in place.

on:
  schedule:
    # EDT window (Mar–Nov)  — 12/15/16/19/22/01 UTC
    - cron: '0 12,15,16,19,22 * * *'
    - cron: '0 1 * * *'
    # EST window (Nov–Mar) — 13/16/17/20/23/02 UTC (double-fire OK, idempotent)
    - cron: '0 13,16,17,20,23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  refresh-oddscrowd:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4

      - name: Pull oddscrowd for today's slate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_mlb.py --source oddscrowd

      # 2026-08-10: append time-series snapshot to line_snapshot table.
      # Each poll gets its own row so we build a full trajectory of
      # sharp/public/line-movement per game over the day. Enables
      # reverse-line-move detection + sharp-entry timing analytics.
      # Idempotent — snapshot_ts truncated to minute so same-minute
      # reruns dedupe. Non-fatal.
      - name: Append line_snapshot rows
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python write_line_snapshot.py --sport MLB || echo "line_snapshot write failed"

      # 2026-08-11: reverse-line-move detector runs AFTER snapshot writer.
      # Compares first + latest snapshot per (game, market). Public 70%+
      # on side A + line moved against A = sharp on B (RLM). Annotates
      # primary_play.rlm_flag so sweat card + Jerry synth can consult.
      # Non-fatal — line_snapshot may be thin early in slate window.
      - name: Detect reverse line moves
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python detect_reverse_line_move.py --sport MLB || echo "RLM detector failed"

      # 2026-08-15: dense archive of OC + FR splits side-by-side per pull.
      # Runs every refresh so the pattern-discovery engine has permanent
      # trajectory data across ALL sports (--sport ALL). This is the raw
      # fuel for mine_line_patterns.py. Non-fatal.
      - name: Archive public splits (both sources)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python archive_public_splits.py --sport ALL || echo "splits archive failed"
