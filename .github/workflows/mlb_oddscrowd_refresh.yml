name: MLB OddsCrowd Refresh (4-shot daily cadence)

# OddsCrowd public/money% moves throughout the day. Prior cadence was every
# 30 min (26 pulls/day) which was expensive and mostly noise. Per user
# 2026-07-30: 4 discrete scrapes at meaningful money-move windows so we see
# where money's going without hitting the source or our Supabase writes
# unnecessarily. Each pull re-fires compute_align_status downstream.
#
# Trade-off vs the old cadence: we lose intraday reverse-line-move detection
# in the final ~30 min before first pitch (whale-money window). If RLM tier
# ships and needs that resolution, add a 5th scrape at ~9pm ET (01:00 UTC).
#
# Times (America/New_York, DST-aware — cron is UTC so we cover both):
#   8am ET  · morning line (12:00 UTC EDT / 13:00 UTC EST)
#   12pm ET · midday adjust (16:00 UTC EDT / 17:00 UTC EST)
#   3pm ET  · afternoon-slate lock (19:00 UTC EDT / 20:00 UTC EST)
#   6pm ET  · pre-primetime whale money (22:00 UTC EDT / 23:00 UTC EST)
#
# Backfill: pull is idempotent via (source, game_id, surface, pick_side,
# game_date) unique index (20260727b) — repeat pulls overwrite in place.

on:
  schedule:
    # EDT window (Mar–Nov)
    - cron: '0 12,16,19,22 * * *'
    # EST window (Nov–Mar) — safe to double-fire, upsert is idempotent
    - cron: '0 13,17,20,23 * * *'
  workflow_dispatch:

jobs:
  refresh-oddscrowd:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4

      - name: Pull oddscrowd for today's slate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_mlb.py --source oddscrowd
