name: MLB OddsCrowd Refresh (6-shot daily cadence)

# OddsCrowd public/money% throughout the day. 2026-08-15: bumped from
# 4 to 6 shots so the pattern-discovery archive gets denser trajectory
# density in the T-3h → T-15min sharp-money window. User's 100k odds API
# credit tier absorbs the extra pulls comfortably.
#
# Each pull re-fires compute_align_status + writes line_snapshot +
# appends public_splits_archive (both sources side-by-side for pattern
# miner). RLM detector runs at the end.
#
# Times (America/New_York, DST-aware — cron is UTC so we cover both):
#   8am ET  · morning line (12:00 UTC EDT / 13:00 UTC EST)
#   11am ET · morning-lock check (15:00 UTC EDT / 16:00 UTC EST)  ← NEW 8/15
#   12pm ET · midday adjust (16:00 UTC EDT / 17:00 UTC EST)
#   3pm ET  · afternoon-slate lock (19:00 UTC EDT / 20:00 UTC EST)
#   6pm ET  · pre-primetime whale money (22:00 UTC EDT / 23:00 UTC EST)
#   9pm ET  · late-night close monitor (01:00 UTC EDT / 02:00 UTC EST) ← NEW 8/15
#
# Backfill: pull is idempotent via (source, game_id, surface, pick_side,
# game_date) unique index (20260727b) — repeat pulls overwrite in place.

on:
  schedule:
    # EDT window (Mar–Nov)  — 12/15/16/19/22/01 UTC
    - cron: '0 12,15,16,19,22 * * *'
    - cron: '0 1 * * *'
    # EST window (Nov–Mar) — 13/16/17/20/23/02 UTC (double-fire OK, idempotent)
    - cron: '0 13,16,17,20,23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  refresh-oddscrowd:
    runs-on: ubuntu-24.04
    # 2026-11-02: 10 -> 25. The fade record reads 64,981 archive rows
    # and takes over two minutes on its own; with the refresh steps
    # ahead of it a 10-minute job is a second way for it to produce
    # nothing.
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4

      # ═══ 2026-11-03 · MLB OFFSEASON GATE ═══════════════════════════════
      # ~74 of the 231.9 scheduled runs a day were MLB-only, on a season
      # whose last game was 2026-10-28. That congestion is the measured
      # cause of every other sport's pipeline landing 7-10h late, which is
      # why the Sweat Card composes on yesterday's non-MLB data
      # (project_card_builds_before_every_other_sport_1102).
      #
      # A STEP, not a separate job: a gate job costs a second runner
      # acquisition on every in-season run, and runner acquisition is the
      # scarce thing here. This workflow is 12 runs/day.
      #
      # sport_gate.py fails OPEN on any error and workflow_dispatch always
      # runs, so neither a gate bug nor a manual rerun can leave MLB dark.
      - name: Offseason gate
        id: sport_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sport_gate.py --sport MLB --require-games

      - name: Pull oddscrowd for today's slate
        if: steps.sport_gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_mlb.py --source oddscrowd

      # 2026-08-10: append time-series snapshot to line_snapshot table.
      # Each poll gets its own row so we build a full trajectory of
      # sharp/public/line-movement per game over the day. Enables
      # reverse-line-move detection + sharp-entry timing analytics.
      # Idempotent — snapshot_ts truncated to minute so same-minute
      # reruns dedupe. Non-fatal.
      - name: Append line_snapshot rows
        if: steps.sport_gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python write_line_snapshot.py --sport MLB

      # 2026-08-11: reverse-line-move detector runs AFTER snapshot writer.
      # Compares first + latest snapshot per (game, market). Public 70%+
      # on side A + line moved against A = sharp on B (RLM). Annotates
      # primary_play.rlm_flag so sweat card + Jerry synth can consult.
      # Non-fatal — line_snapshot may be thin early in slate window.
      - name: Detect reverse line moves
        if: steps.sport_gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python detect_reverse_line_move.py --sport MLB

      # 2026-08-15: dense archive of OC + FR splits side-by-side per pull.
      # Runs every refresh so the pattern-discovery engine has permanent
      # trajectory data across ALL sports (--sport ALL). This is the raw
      # fuel for mine_line_patterns.py. Non-fatal.
      - name: Archive public splits (both sources)
        # NOT gated by MLB: archive_public_splits.py --sport ALL.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python archive_public_splits.py --sport ALL

      # ── THE FADE ───────────────────────────────────────────────────────
      # 2026-10-07. Lives here and not in cross_sport_lines.yml on purpose:
      # that workflow is dispatch-only and workflow_heartbeat shows it has
      # never once run, so a step added there would never fire. This job is
      # the OddsCrowd refresh, and oddscrowd is the single source The Fade
      # reads (it is the only archive source keyed on the real pick_side
      # rather than sharp_side_norm — see compute_fade_records.py SOURCES).
      # So the consumer sits directly behind its own producer.
      #
      # Two different cadences on purpose:
      #   --today  every refresh. Public ticket share moves through the day,
      #            so tonight's qualifying list has to move with it.
      #   record   ONCE a day. It only changes when games grade, and Andy's
      #            standing instruction is not to re-run work that cannot
      #            have changed. Gated on the UTC hour in bash rather than
      #            github.event.schedule — this workflow has four cron lines
      #            and dispatch sends none, and a schedule-string gate is
      #            exactly how clv_weekly_rollup's Sunday check silently
      #            never matched (see cross_sport_lines.yml).
      - name: The Fade - tonight's qualifying plays
        # NOT gated by MLB: compute_fade_records.py, all sports.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_fade_records.py --today --apply

      - name: The Fade - graded record (once daily)
        # NOT gated by MLB: compute_fade_records.py, all sports.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # == 2026-11-02 - THE WALL-CLOCK GATE NEVER MATCHED =========
          # This was:
          #     HOUR=$(date -u +%H)
          #     if [ "$HOUR" = "12" ] || [ "$HOUR" = "13" ] || dispatch
          #
          # GitHub delivers this repo's crons 3-9 HOURS late (measured over
          # 23 runs of nba_pipeline's 12:00 slot: min 3.0h, median 4.9h,
          # max 9.0h), so a run scheduled at 12:00 STARTS between 15:00 and
          # 21:00 and `date -u +%H` is never 12 or 13. fade_public_ats was
          # frozen at 2026-10-07T02:00 -- the day this step was added --
          # with last_pick_date 10-05, and those rows exist only because the
          # gate also admits workflow_dispatch and it was run by hand that
          # day. It has never once run on a schedule, which is what Andy saw
          # as "not seeing a record on the fade".
          #
          # The comment above warns against a schedule-STRING gate for this
          # very reason and then used a wall-CLOCK gate that fails the same
          # way. So the once-a-day decision now asks the DATA whether today
          # is already done, which is true whenever the run lands.
          cd mlb_pipeline
          python compute_fade_records.py --apply --once-daily
