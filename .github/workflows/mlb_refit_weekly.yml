name: MLB Refit Weekly Retrain

# 2026-08-20: weekly re-training of prop refit weights.
# refit_conviction is trained from historical outcomes — its calibration
# drifts as signal environment shifts. Weekly rebuild keeps refit
# calibrated to recent data.
#
# Original manual scratch script `_fit_prop_refit_weights_v2.py` had a
# hardcoded Windows path. Now `refit_train_v2.py` (keeper) with
# cross-platform Path resolution.

on:
  schedule:
    # Every Monday at 8am ET (12:00 UTC) — after weekend games have graded
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  refit-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # committing the new weights JSON back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv numpy scikit-learn

      - name: Refit training run (prop weights)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refit_train_v2.py

      # 2026-09-08: NCAAF historical odds backfill BEFORE LR retrain.
      # CFBD /lines endpoint returns free historical betting lines; this
      # pulls current-year (in-season) fills so training set grows week
      # over week as more games resolve. Runs BEFORE ncaaf_ml_logreg_train
      # so the fresh rows are in the training corpus. Non-fatal.
      - name: NCAAF historical odds backfill (CFBD)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_historical_odds_backfill.py --year 2026 || echo "ncaaf odds backfill non-fatal"

      # 2026-09-14: NHL + NBA historical odds backfill via The Odds API
      # historical endpoint. Fills close_* on newly-resolved 2026-27
      # regular-season games week-over-week so training corpus grows.
      # Only touches game_results rows with NULL close_home_ml so it's
      # a no-op once a game's lines have been captured. Non-fatal.
      - name: NHL + NBA historical odds backfill (The Odds API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_historical_odds_hoops_hockey.py --sport nhl || echo "nhl odds backfill non-fatal"
          python backfill_historical_odds_hoops_hockey.py --sport nba || echo "nba odds backfill non-fatal"

      # 2026-09-03: LR predictors are trained from resolved outcomes and
      # drift as data grows. Weekly retrain keeps coefficients calibrated.
      # Non-fatal per model — one failure doesn't kill the others.
      - name: LR predictor retrain (MLB + NFL + NCAAF)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python mlb_ml_logreg_train.py    || echo "mlb_ml_logreg non-fatal"
          python mlb_prop_logreg_train.py  || echo "mlb_prop_logreg non-fatal"
          python mlb_total_logreg_train.py || echo "mlb_total_logreg non-fatal"
          python nfl_ml_logreg_train.py    || echo "nfl_ml_logreg non-fatal"
          python ncaaf_ml_logreg_train.py  || echo "ncaaf_ml_logreg non-fatal"
          python ncaaf_total_logreg_train.py || echo "ncaaf_total_logreg non-fatal"
          # 2026-09-14: NHL + NBA newly unblocked (v1.0.1 #12 backfill).
          # NHL 1335 games test acc 64.8% +7.5pp; NBA 1324 games 67.1% +10.3pp.
          # NCAAB still data-blocked pending Nov 3 season start.
          python nba_ml_logreg_train.py    || echo "nba_ml_logreg non-fatal"
          python nhl_ml_logreg_train.py    || echo "nhl_ml_logreg non-fatal"
          python ncaab_ml_logreg_train.py  || echo "ncaab_ml_logreg data-blocked (expected)"

      # 2026-09-13: signal-registry refit reads freshly-graded signal_attribution
      # rows (LR_SHADOW, GOAT, ANCHOR, cohort chips, EPA_GAP, ...) plus prop
      # decisions + game ensemble sources. Writes hit_rate/sample_n/tier into
      # signal_registry so the ensemble scorer picks up real Week-N performance
      # data instead of my static seed weights. Non-fatal.
      - name: Signal registry refit (all sports, 90d window)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refit_signal_registry.py --days 90 || echo "refit_signal_registry non-fatal"

      # 2026-09-13: rebuild NFL + NCAAF cohort_tag_records from the fresh set of
      # graded games. Feeds the "48.5% · fade" chip labels + colors on the game
      # card SignalsRow (data-driven, not assumed). Non-fatal.
      - name: Cohort tag records rebuild (NFL + NCAAF)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python build_cohort_tag_records.py || echo "build_cohort_tag_records non-fatal"

      - name: Commit fresh weights if changed
        run: |
          cd mlb_pipeline
          # Compose glob of everything the retrain could produce
          CHANGED_FILES="models/prop_refit_weights_v2.json models/mlb_ml_logreg.json models/mlb_prop_logreg.json models/mlb_total_logreg.json models/nfl_ml_logreg.json models/ncaaf_ml_logreg.json models/ncaaf_total_logreg.json models/nhl_ml_logreg.json models/nba_ml_logreg.json"
          if git diff --quiet $CHANGED_FILES; then
            echo "No model change this week"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $CHANGED_FILES
            git commit -m "Weekly refit + LR retrain $(date +%Y-%m-%d)"
            git push
          fi
