name: MLB Refit Weekly Retrain

# 2026-08-20: weekly re-training of prop refit weights.
# refit_conviction is trained from historical outcomes — its calibration
# drifts as signal environment shifts. Weekly rebuild keeps refit
# calibrated to recent data.
#
# Original manual scratch script `_fit_prop_refit_weights_v2.py` had a
# hardcoded Windows path. Now `refit_train_v2.py` (keeper) with
# cross-platform Path resolution.

on:
  schedule:
    # Every Monday at 8am ET (12:00 UTC) — after weekend games have graded
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  refit-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # committing the new weights JSON back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv numpy scikit-learn

      - name: Refit training run (prop weights)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refit_train_v2.py

      # 2026-09-08: NCAAF historical odds backfill BEFORE LR retrain.
      # CFBD /lines endpoint returns free historical betting lines; this
      # pulls current-year (in-season) fills so training set grows week
      # over week as more games resolve. Runs BEFORE ncaaf_ml_logreg_train
      # so the fresh rows are in the training corpus. Non-fatal.
      - name: NCAAF historical odds backfill (CFBD)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaaf_historical_odds_backfill.py" python ncaaf_historical_odds_backfill.py --year 2026

      # 2026-09-14: NHL + NBA historical odds backfill via The Odds API
      # historical endpoint. Fills close_* on newly-resolved 2026-27
      # regular-season games week-over-week so training corpus grows.
      # Only touches game_results rows with NULL close_home_ml so it's
      # a no-op once a game's lines have been captured. Non-fatal.
      - name: NHL + NBA historical odds backfill (The Odds API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "backfill_historical_odds_hoops_hockey.py" python backfill_historical_odds_hoops_hockey.py --sport nhl
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "backfill_historical_odds_hoops_hockey.py" python backfill_historical_odds_hoops_hockey.py --sport nba

      # 2026-09-03: LR predictors are trained from resolved outcomes and
      # drift as data grows. Weekly retrain keeps coefficients calibrated.
      # Non-fatal per model — one failure doesn't kill the others.
      - name: LR predictor retrain (MLB + NFL + NCAAF)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "mlb_ml_logreg_train.py" python mlb_ml_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "mlb_prop_logreg_train.py" python mlb_prop_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "mlb_total_logreg_train.py" python mlb_total_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "nfl_ml_logreg_train.py" python nfl_ml_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaaf_ml_logreg_train.py" python ncaaf_ml_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaaf_total_logreg_train.py" python ncaaf_total_logreg_train.py
          # 2026-09-14: NHL + NBA newly unblocked (v1.0.1 #12 backfill).
          # NHL 1335 games test acc 64.8% +7.5pp; NBA 1324 games 67.1% +10.3pp.
          # NCAAB still data-blocked pending Nov 3 season start.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "nba_ml_logreg_train.py" python nba_ml_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "nhl_ml_logreg_train.py" python nhl_ml_logreg_train.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaab_ml_logreg_train.py" python ncaab_ml_logreg_train.py

      # 2026-09-13: signal-registry refit reads freshly-graded signal_attribution
      # rows (LR_SHADOW, GOAT, ANCHOR, cohort chips, EPA_GAP, ...) plus prop
      # decisions + game ensemble sources. Writes hit_rate/sample_n/tier into
      # signal_registry so the ensemble scorer picks up real Week-N performance
      # data instead of my static seed weights. Non-fatal.
      - name: Signal registry refit (all sports, 90d window)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "refit_signal_registry.py" python refit_signal_registry.py --days 90

      # 2026-09-13: rebuild NFL + NCAAF cohort_tag_records from the fresh set of
      # graded games. Feeds the "48.5% · fade" chip labels + colors on the game
      # card SignalsRow (data-driven, not assumed). Non-fatal.
      - name: Cohort tag records rebuild (NFL + NCAAF)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "build_cohort_tag_records.py" python build_cohort_tag_records.py

      - name: Commit fresh weights if changed
        run: |
          cd mlb_pipeline
          # Compose glob of everything the retrain could produce
          CHANGED_FILES="models/prop_refit_weights_v2.json models/mlb_ml_logreg.json models/mlb_prop_logreg.json models/mlb_total_logreg.json models/nfl_ml_logreg.json models/ncaaf_ml_logreg.json models/ncaaf_total_logreg.json models/nhl_ml_logreg.json models/nba_ml_logreg.json"
          if git diff --quiet $CHANGED_FILES; then
            echo "No model change this week"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $CHANGED_FILES
            git commit -m "Weekly refit + LR retrain $(date +%Y-%m-%d)"
            git push
          fi

      # 2026-09-24 B18 — turn a green-but-broken run red.
      #
      # Every masked step above used to end in `|| echo "... non-fatal"`,
      # which makes the shell succeed, so the step succeeds, so the job
      # succeeds. A grader could fail nightly and the run still showed a
      # green check. That is the mechanism behind "no games resolved
      # yesterday" and "no prime props today".
      #
      # The masks were not simply deleted: one flaky optional scraper would
      # then abort the graders and writers that run after it. Continuing is
      # correct. Continuing silently and claiming success is the bug.
      # run_step.sh records each failure and still returns 0; this gate
      # fails the run at the end with the list.
      - name: Fail the run if any step failed
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
