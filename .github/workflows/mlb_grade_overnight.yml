name: MLB Grade Overnight

# Dedicated grader that runs late night after all MLB games finish.
# Separate from the main mlb_pipeline.yml because grading takes 2-3
# minutes and blocking the 45-min pipeline behind it delays morning
# picks. Runs stand-alone so even if the morning pipeline is delayed
# by GH Actions load, users logging in still see prior-day results.
#
# Also: with the main pipeline hitting 4-7hr cron delays lately,
# splitting grading out means the DAILY RECORDS surface ALWAYS lands
# by 5am ET regardless of morning pipeline state.

on:
  schedule:
    # ══ 2026-10-05 · SHIFTED EARLIER BY THE MEASURED DELAY ══
    # These used to be 06:30 / 08:30 / 09:30 UTC, intended to land 2:30 /
    # 4:30 / 5:30am ET. They never did. Measured from 88 start-heartbeats,
    # actual minus scheduled:
    #
    #     slot 630  median +317m   p90 +426m   worst +556m
    #     slot 830  median +317m
    #     slot 930  median +317m
    #
    # i.e. the "overnight" grader routinely ran between 8am and noon ET —
    # AFTER Andy checked the app — and on 10-05 none of the three had fired
    # 22.8h after the previous run. GitHub Actions treats scheduled
    # workflows as best-effort and drops or delays them under load; this is
    # not specific to this file (every workflow we have shows a 3.4-5.6h
    # median delay).
    #
    # So the schedule now carries the delay: each slot is set ~5.3h earlier
    # than the time it is meant to land. Firing EARLY is harmless here —
    # every step is idempotent and only fills NULLs, so an early run simply
    # grades less and a later slot finishes the job. Firing late is what
    # costs us.
    #
    # The real fix is an external trigger (workflow_dispatch is not subject
    # to the schedule queue). Documented in docs/ for Andy to approve; this
    # is the mitigation until then.
    - cron: '10 1 * * *'     # intended landing ~06:30 UTC / 2:30am ET
    - cron: '10 3 * * *'     # intended landing ~08:30 UTC / 4:30am ET
    - cron: '10 4 * * *'     # intended landing ~09:30 UTC / 5:30am ET
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4

      # 2026-09-06 heartbeat wiring — grader was invisible to
      # workflow_heartbeat telemetry (only GH Actions UI showed it ran).
      # Same pattern as mlb_pipeline.yml so /workflow-status queries hit
      # both. Non-fatal (continue-on-error) so a missing table doesn't
      # block grading.
      - name: Heartbeat — start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          CRON_SLOT="${{ github.event.schedule }}"
          case "$CRON_SLOT" in
            '10 1 * * *')   SLOT='630' ;;
            '10 3 * * *')   SLOT='830' ;;
            '10 4 * * *')   SLOT='930' ;;
            *)              SLOT='manual' ;;
          esac
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"mlb_grade_overnight\",\"event\":\"start\",\"sport\":\"MLB\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"$SLOT\"}"

      # 1. Grade yesterday's MLB games (mlb_game_results scores +
      #    outcomes → jerry_reads.result + prop.result + ledger_snapshots)
      # 1a. Persist yesterday's player box scores.
      #
      # 2026-09-23: mlb_player_game_log was backfilled for the whole
      # 2026 season (69,820 rows) and then had NOTHING scheduled to keep
      # it current — a store that stops the day it is built is worse
      # than none, because the lookback silently thins out instead of
      # failing. backfill_prop_lookback now reads this table instead of
      # a live gameLog fetch, so a stale table means every L5/L10 on the
      # card quietly goes empty.
      #
      # Runs BEFORE the resolver so the box scores are in place for
      # anything downstream that wants to check a grade against them.
      # --resume makes it idempotent; a 7-day window catches suspended
      # games that finish on a later date than they started.
      - name: Persist MLB player game logs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          START=$(date -u -d '7 days ago' +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          python backfill_mlb_player_game_log.py --start "$START" --end "$END" --resume

      - name: Resolve MLB game results
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python resolve_game_results.py

      # 1b. Resolve the Ladder rung.
      #
      # 2026-09-20: added here. resolve_ladder_results.py previously ran
      # ONLY in mlb_pipeline.yml, near the end of a very long workflow, so
      # the rung sat unresolved until the morning pipeline reached it:
      #   09-18 rung resolved 09-19 11:55am ET
      #   09-19 rung resolved 09-20 10:31am ET
      # against 1-5am ET for rungs earlier in the month. Andy, two days
      # running: "the ladder still isn't resolved."
      #
      # It belongs in the overnight grader with every other grading task,
      # and specifically AFTER resolve_game_results, which writes the
      # scores the rung is graded against. Three crons (2:30 / 4:30 /
      # 5:30am ET) also give it two retries if a late West-coast game has
      # not posted at the first pass.
      #
      # Still runs in mlb_pipeline.yml too — idempotent, and that stays as
      # the backstop for a night the overnight grader misses entirely.
      # ══════════════════════════════════════════════════════════════════
      # CROSS-SPORT NIGHTLY — second caller, added 2026-10-01
      #
      # The block that used to sit here claimed the script was "called by BOTH
      # this workflow and nightly_cross_sport.yml". It was not. Nothing in this
      # file invoked it — the step below is the first time that sentence is
      # true, and the MLB-ONLY block directly beneath contradicted it the whole
      # time. Two comments describing opposite designs, neither matching the
      # YAML, which is how this stayed invisible.
      #
      # WHY IT MATTERS — measured off workflow_heartbeat, 21 days:
      #   nightly_cross_sport  slot 30 10  median +376 min late -> ~16:46 UTC
      #   mlb_grade_overnight  slot 630    median +330 min late -> ~12:00 UTC
      #   mlb_grade_overnight  slot 830/930                     -> ~13:45/14:20
      # GH Actions almost never DROPS an established daily slot (630/830/930 all
      # fired 22 of 22 days, 0%), but it is routinely 2-6 HOURS late. So the
      # cross-sport chain — grade_potd, grade_public_receipts,
      # compute_surface_records, SOS/SOR, and NHL's only daily resolver — did
      # not finish until mid-afternoon ET.
      #
      # Andy 2026-10-01, 11:27am ET: "all picks from last night in app should be
      # resolved". They were not, and could not be: the only caller had not run
      # yet. Yesterday's POTD still read Pending, NHL 9/30 was unresolved, and
      # every record was a day stale. Running the chain from this workflow's
      # 06:30 slot lands it ~08:00 ET instead, before he looks.
      #
      # Every step goes through run_step.sh and is idempotent, so the overlap is
      # a safety net rather than double work. nightly_cross_sport.yml stays the
      # PRIMARY caller and the one that survives — when baseball ends and this
      # workflow retires, nothing needs reinstating there.
      # ══════════════════════════════════════════════════════════════════
      - name: Cross-sport nightly (shared sequence)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PYTHONIOENCODING: utf-8
        # Same env and same invocation as nightly_cross_sport.yml — the script
        # does `cd "${GITHUB_WORKSPACE:-.}/mlb_pipeline"`, so pass the absolute
        # path rather than a relative one. Deliberately NOT adding secrets the
        # primary caller doesn't pass: if a step needs one, it should be added
        # in both places at once, not discovered here.
        run: bash "$GITHUB_WORKSPACE/.github/scripts/nightly_cross_sport.sh"
      # ══════════════════════════════════════════════════════════════════
      # THIS WORKFLOW IS NOW MLB ONLY — 2026-09-29
      #
      # Andy: "Can we diligently split the mlb overnight from other sports?"
      #
      # It used to run sixteen cross-sport steps plus morning_brief and the
      # heartbeat watchdog. All of that now lives in
      #   .github/scripts/nightly_cross_sport.sh
      # run by nightly_cross_sport.yml at 10:30 + 12:30 UTC.
      #
      # The 10:30 slot is deliberately AFTER this workflow's last attempt
      # (09:30), so POTD grading, records and receipts still see freshly
      # resolved MLB results.
      #
      # 2026-10-01 CORRECTION: this block used to end "Nothing was lost by
      # removing the overlap." Something was. Nominal ordering is not real
      # ordering — GH Actions runs this workflow 5-6h late and
      # nightly_cross_sport 6.3h late, so "10:30 after 09:30" became "16:46
      # after 14:20" and the cross-sport chain finished mid-afternoon ET with
      # no second attempt behind it. The step above restores the overlap.
      #
      # WHY THE SPLIT MATTERS: baseball goes offline after the playoffs. Every
      # step left below is MLB-specific and SHOULD stop with the season. Adding
      # anything cross-sport back here would re-create the dependency that put
      # NCAAF's only daily resolver and all six sports' stat history inside a
      # workflow with an expiry date.
      # ══════════════════════════════════════════════════════════════════



      # 2. Grade ledger snapshots (chalk_parlays, teasers, hits_parlays)

      # 2b. Grade POTD (best_bet_YYYY-MM-DD rows in jerry_cache) — added
      # 2026-09-08 to close the gap where POTD narratives were being
      # generated + cached but never graded post-game. Users saw ungraded
      # POTD entries every morning until manually backfilled. Runs after
      # resolve_game_results so mlb_game_results is fresh.

      # 2c. Grade public_receipts — the immutable published-pick ledger.
      # Added 2026-09-21. grade_public_receipts.py shipped on 09-20 but was
      # never scheduled anywhere, so every receipt it was built to grade sat
      # at result=NULL: all 22 football Sweat Card picks back to 09-05, and
      # the Sharp prop backlog. A receipts product whose receipts are never
      # settled is the one failure we cannot ship, and it was invisible
      # because nothing errored — the script simply never ran.
      #
      # Surface-agnostic and sport-agnostic by design, so this one step
      # covers NHL/NBA/NCAAB the moment they start publishing. 3-day window
      # picks up late finals without rewalking the season every night.

      # 3. Aggregate daily records — writes sharp_card / ladder / ledger /
      #    potd / prop_card daily rows so the app hero shows yesterday's
      #    result immediately when user opens in the morning.

      # 3b. Morning brief verification — runs full 5-section audit + exits
      # non-zero if any grading gap or regression detected. Wired 2026-09-08.
      # 2026-09-08 upgrade: --fix flag added so overnight auto-heals gaps
      # by re-running graders + aggregators. Idempotent; safe unattended.
      # continue-on-error kept so the workflow itself never breaks on this
      # step. Auto-repair runs first, THEN morning brief re-verifies clean.

      # 4. Recompute surface_records (mtd / d7 / d30 / epoch / lifetime rollups)
      #    so the record chips + hero P/L update overnight.

      # 3c. RECEIPTS — the evidence trail behind every published record.
      #
      # 2026-09-20: wired. public_receipts held 9,872 rows written only by
      # MANUAL runs of this script, which is why its newest game_date was
      # 09-18 while the date was 09-20. Two days of published picks had no
      # receipt. Unwired, coverage decays the moment nobody remembers.
      #
      # Runs for every sport in one step (all six are cheap; sports with
      # no slate return 0 rows). Placed AFTER grading so results are
      # already attached — a receipt with its outcome is worth far more
      # than one written before grading.
      #
      # Idempotent: on_conflict=(sport,surface,game_date,source_id) with
      # ignore-duplicates, so re-runs never rewrite an existing receipt.
      # Rows are stamped capture_mode='reconstructed' — see 20260920a.

      # 3d. CONTEXT SNAPSHOT — preserve what the engine thought.
      #
      # 2026-09-20: the live *_game_context tables are a working window,
      # not an archive. mlb_game_context holds ~2 weeks; April-August 2026
      # is already unrecoverable. Without this step there is no data to
      # backtest or self-calibrate against, which is why neither exists.
      #
      # Write-once per (sport, game_id, snapshot_date): the first capture
      # of a day wins and is never overwritten, so it records what was
      # published rather than what was last computed.
      #
      # --days 2 re-attempts yesterday in case a night was missed; the
      # write-once rule makes that harmless.

      # 4b. Team-alias gap audit (2026-09-03). Surfaces unresolved raw
      # names logged by team_resolver so we can add missing aliases before
      # they cause silent zero-external coverage. Only surfaces gaps with
      # ≥2 hits (single-hit noise from cross-sport misroutes is filtered
      # by the --min-hits guard).

      # 5. NCAAF grader (during football season) — same overnight window

      # 5b. Refresh team_recent_games matview — universal cross-sport
      #     rollup feeding the Recent Schedule card. Runs AFTER both MLB +
      #     NCAAF resolvers so newly graded games appear in the card by
      #     morning. Refresh is cross-sport in one shot (union of all
      #     sport game_results), so calling once here is enough. Migration:
      #     supabase/migrations/20260901_team_recent_games_matview.sql

      # 5c. Refresh team_situational_records matview — long-format W-L-P
      #     per (team × market × filter) feeding the Situational Results
      #     card. Same cross-sport refresh pattern as recent_games; one
      #     shot covers all wired sports.
      #     Migration: supabase/migrations/20260901b_team_situational_records_matview.sql

      # 5d. Refresh team_stats_rolling matview — universal per-team stat
      #     + rank rollup. NCAAF-only content today; other sports queued.
      #     Migration: supabase/migrations/20260901c_team_stats_rolling_matview.sql

      # 5e. Snapshot the values 5d just rebuilt into team_stats_rolling_history.
      #     Migration: 20260926a_team_stats_rolling_history.sql
      #
      #     WHY: study_stat_edge (09-25) came back 0-for-30 — the five stats
      #     with leak-free history (ppg, points allowed, margin, ATS rate,
      #     over rate) carry no ATS edge across 16,736 games. The stats most
      #     likely to carry one — EPA, success rate, explosiveness, SP+ —
      #     could not be tested AT ALL, because team_stats_rolling is a
      #     matview holding only the current value. That history was never
      #     written down and cannot be recovered; this step is the only
      #     thing that makes those stats testable a season from now.
      #
      #     MUST run after 5d, not before — the point is to capture the
      #     post-refresh values. Change-only writes, so a quiet day costs
      #     nothing. Non-fatal: a missed day leaves a gap in the series,
      #     which is recoverable, whereas failing the job would also stop
      #     the data-quality and alerting steps below it.

      # 6. Data quality checker — surfaces cross-attribution + MC-stale
      #    anomalies before users see them. Non-fatal in cron (findings
      #    logged, not blocked) but exits non-zero when findings exist
      #    so external monitor can alert. Motivated by 2026-09-01 finding:
      #    73 tainted external picks accumulated over 30 days silently.

      # 7. External monitor ping (healthchecks.io) — separate check from
      #    the main pipeline. Once user configures HC_GRADE_OVERNIGHT_URL
      #    secret, missed nightly grades alert immediately.
      - name: External monitor — grader ping
        if: success()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_GRADE_OVERNIGHT_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "${HC_URL}" || true
          fi

      # 8. Heartbeat end (2026-09-06). Pairs with start heartbeat above.
      # If start fires but end doesn't, we know grader died mid-run.
      # 2026-09-19: resolution reconciliation. Read-only detector, runs
      # AFTER grading so it sees the finished state. Every resolution bug
      # found on 9/18 — NFL props graded off 0.0, MLB top_8 stuck Pending
      # on line drift, POTD hardcoded to sport=MLB, NCAAF duplicate
      # contexts, two NCAAF games final with nothing graded — was found
      # because Andy noticed. This is the thing that notices instead.
      #
      # continue-on-error: findings are reported LOUDLY in the log but do
      # not fail the run. The workflow-failure inbox is already noisy and
      # a detector that adds to it gets muted, which defeats it. Flip to
      # blocking once the CRITICAL count is reliably 0.

      # 2026-09-28 · SOMETHING FINALLY READS workflow_heartbeat.
      #
      # The table was created 2026-08-27 specifically to tell "cron dropped"
      # apart from "started and died", and its own note says "If no start row
      # for today, GitHub Actions dropped the cron." Nothing in the repo ever
      # read it — the only file touching it was an underscore-prefixed
      # scratch script, which is gitignored. Answering "where is my card?"
      # on 09-28 took six ad-hoc queries and produced a wrong first
      # conclusion before the table settled it.
      #
      # It lives HERE rather than in mlb_pipeline on purpose: a watchdog that
      # only runs inside the pipeline it is watching cannot report that
      # pipeline failing to start. mlb_grade_overnight is a separate workflow
      # on a separate schedule, so it can see an mlb_pipeline that never ran.
      #
      # Lateness is judged against each slot's own measured p90, not its
      # nominal cron time — the '0 10' trigger has historically started
      # 13:20-16:22 UTC, so a cron-time comparison would flag every day and
      # train everyone to ignore it.

      # if: always() so a failed grade step doesn't skip the heartbeat.
      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          CRON_SLOT="${{ github.event.schedule }}"
          case "$CRON_SLOT" in
            '10 1 * * *')   SLOT='630' ;;
            '10 3 * * *')   SLOT='830' ;;
            '10 4 * * *')   SLOT='930' ;;
            *)              SLOT='manual' ;;
          esac
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"mlb_grade_overnight\",\"event\":\"end\",\"sport\":\"MLB\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"$SLOT\"}"

      # 2026-10-01: the cross-sport step above is continue-on-error so a bad
      # step never blocks MLB grading or the heartbeat — but without this gate
      # it would also never be VISIBLE, which is the bare-`|| echo` mask this
      # repo has been removing (project_bare_mask_review_920). run_step.sh
      # --gate reads only THIS run's tally, so a red run here means a
      # cross-sport step genuinely failed in this invocation. Deliberately
      # LAST, after the heartbeat, so failing it cannot cost us the telemetry
      # that told us about the lateness in the first place.
      - name: Fail the run if any cross-sport step failed
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
