name: Keep Alive (prevent GH scheduled-workflow skip)

# 2026-09-03: GitHub Actions silently skips scheduled workflows on
# repos with low commit activity or during GH platform slowdowns.
# Symptom: our morning MLB/NFL/NCAAF pipeline crons (6/7:15/8:30 EDT)
# were not firing reliably, forcing manual runs from user.
#
# Fix: this workflow runs every 30 min via cron, does effectively
# nothing (just a shell echo), but the schedule "touch" is enough
# to keep the repo's scheduled-workflow queue active. GH removes
# repos from the schedule queue if there's no scheduled workflow
# activity — this heartbeat guarantees activity.
#
# Cost: ~0.5s/run × 24 runs/day = 12s/day of Actions minutes. Trivial.
#
# 2026-09-08: reduced 30m → hourly. Now that all 7 sport pipelines have
# real heartbeat cron activity (see project_pipeline_overhaul_909), the
# GH schedule queue has plenty of scheduled-workflow activity to stay
# warm without a 48/day heartbeat. Hourly is enough belt-and-suspenders.

# ══ 2026-10-05 · SCHEDULE DISABLED (reversible — uncomment to restore) ══
# This workflow exists to keep GitHub's scheduled-workflow queue "warm" so
# other crons are not skipped. Measured today, it is not achieving that and
# it costs 24 runner acquisitions a day to not achieve it:
#
#   * every workflow we have runs 3.4-5.6h late (median, 870 heartbeats)
#   * three had not started in 26+ hours on 10-05
#   * mlb_line_poller is scheduled 72x/day and LANDS 3-4 times (4-6%)
#   * Andy is seeing "The job was not acquired by Runner of type hosted"
#
# All of that is happening WITH this heartbeat running hourly, so the premise
# is disproven by our own data. Its own 09-08 note already said the other
# 24 workflows supply plenty of queue activity on their own — there are now
# 266 scheduled acquisitions a day without it.
#
# Disabled rather than deleted so it is one uncomment to restore. WHAT TO
# WATCH: if scheduled-workflow skip rates get WORSE over the next few days
# (check watchdogs.check_workflow_stale and the landed-run counts in
# line_history), restore it. If they are unchanged, delete the file.
on:
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Heartbeat
        run: |
          echo "keep-alive ping — $(date -u +%FT%TZ)"
          echo "GitHub Actions scheduled-workflow queue kept warm."
