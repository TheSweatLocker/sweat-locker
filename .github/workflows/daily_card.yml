name: Daily Card (sport-agnostic surfaces)

# ══ WHY THIS EXISTS ══
#
# Andy, 9:26am 2026-09-28: "dont see a sweat card in app or POTD", then
# "i just want to make sure top sport picks are surfacing".
#
# Seven of the nine user-facing surfaces were produced ONLY inside
# mlb_pipeline.yml:
#
#     Sweat Card · The Sharp · POTD · Dawg of the Day
#     Ladder · Ledger · Daily Degen
#
# Only money-flow splits, game reads and externals were distributed across
# the six sport pipelines. So every headline surface in the product hung
# off the baseball workflow — and baseball's regular season ended 2026-09-27.
# The morning the card went missing was not a one-off, it was the first day
# of a permanent condition.
#
# This runs the surfaces that DO NOT need baseball, on their own schedule,
# so the product keeps producing picks through the MLB offseason and through
# every future gap between sports.
#
# ── WHAT IS HERE, AND WHY EACH ONE QUALIFIES ──
# Audited by the tables each script actually reads:
#
#   jerry_anchor_potd.py    AGNOSTIC  — reads jerry_reads (every sport
#                                       writes it) + jerry_cache. POTD has
#                                       always been able to pick from any
#                                       sport; it was only ever SCHEDULED
#                                       inside the MLB workflow.
#   settle_prop_receipts.py AGNOSTIC  — and was in NO workflow at all. It
#                                       is the fallback grader for props
#                                       whose source row was pruned, and
#                                       only ever ran when
#                                       grade_public_receipts imported it.
#   snapshot_ledger.py      AGNOSTIC
#   generate_sweat_card.py  sport-aware; counts all six sports as of
#                           2026-09-28 and composes football picks already
#   steam_room_ladder.py    sport-aware; shared ladder_* tables
#   generate_ledger.py      sport-aware; shared ledger_suggestions
#   consistency_watchdog.py sport-aware; shared watchdog_alerts
#   compute_surface_records sport-aware; already runs in four workflows
#
# ── WHAT IS DELIBERATELY NOT HERE ──
#   generate_dawg_of_day.py    reads daily_dawg + mlb_game_context +
#                              mlb_pipeline_props only — genuinely MLB-bound
#   generate_daily_degen.py    same
# Moving those needs them made multi-sport first, which is real work, not a
# scheduling change. They stay in mlb_pipeline and stop with baseball. That
# is a known gap, not an oversight.
#
# ── mlb_pipeline STILL RUNS ITS COPIES ──
# These steps are NOT removed from mlb_pipeline yet. Every one is
# idempotent (the card is wipe-and-refresh, POTD is threshold-gated,
# ladder/ledger are upserts), so running twice produces the same result,
# and leaving them in place means this workflow can be proven in
# production before anything is taken away from a pipeline that is mid
# postseason. Removal belongs to the offseason restructure.
#
# ── SCHEDULE ──
# GitHub delivers this repo's crons 3.5-6 HOURS late, measured over 20 days
# of workflow_heartbeat. Times below are therefore set early on purpose;
# the comment on each says when it actually lands.

# 2026-11-03 MINUTE SPREAD. 57.1% of all cron firings landed on :00
# (60 of 105 across 20 workflows), the most contended minute on
# GitHub's scheduler, and these pipelines were running 7-10h late
# while daily_card was the only one on time
# (project_card_builds_before_every_other_sport_1102). This file now
# fires at :07. Any `github.event.schedule` comparison below was
# rewritten in lockstep -- a stale literal makes the mode fall
# through to its default silently.

on:
  schedule:
    - cron: '7 5 * * *'    # lands ~08:30-11:00 UTC = 04:30-07:00 ET
    - cron: '7 11 * * *'   # lands ~14:30-17:00 UTC = 10:30-13:00 ET
    - cron: '7 17 * * *'   # lands ~20:30-23:00 UTC = 16:30-19:00 ET
  # ══ 2026-11-03 · THE CARD WAS BUILT BEFORE EVERY OTHER SPORT ══════
  # ANDY: "Sweat card is very thin ... Plenty of options for sports sweat
  # card cant be this thin THIS IS FUCKINGUNSAT".
  #
  # The card is the only workflow in this repo that runs close to on time,
  # and it runs FIRST. Measured 2026-11-02:
  #
  #     daily_card           13:00 cron -> 13:07   ON TIME
  #     nightly_cross_sport  10:30 cron -> 20:27   9h57 late
  #     ncaab_pipeline       11:00 cron -> 20:35   9h35 late
  #     nba_pipeline         12:00 cron -> 21:27   9h27 late
  #     nhl_pipeline         12:05 cron -> 21:39   9h34 late
  #
  # So the Sweat Card composed on YESTERDAY's NBA/NHL/NCAAB data every
  # single day. On 2026-11-03 it shipped ONE pick against a 32-game slate
  # it had itself labelled slate_density 'overload', with sport_counts
  # {NBA 0, NFL 0, MLB 0}.
  #
  # Crons CANNOT fix this. Lateness is 7-10h, varies run to run and is
  # growing (NBA's 12:00 slot: 4h45 late 10-30, 9h27 on 11-02), so any
  # fixed offset is a guess that silently stops holding. workflow_run is
  # event-driven and immune: the card rebuilds when a sport pipeline
  # actually finishes, whenever that turns out to be.
  #
  # Safe to add: the card already builds 3x a day, so another build is not
  # a new risk class, and `concurrency: daily-card` with
  # cancel-in-progress:false serialises the burst instead of letting two
  # runs write the same tables (the 2026-09-18 defect).
  workflow_run:
    workflows:
      - NBA Pipeline Daily
      - NHL Pipeline Daily
      - NCAAB Pipeline Daily
      - Nightly Cross-Sport
    types: [completed]
  workflow_dispatch:

# Serialise against itself only. The repo has history here: a single shared
# group let GitHub cancel QUEUED scheduled runs when a push queued behind
# them (2026-09-11), and splitting groups by trigger source then let two
# runs execute simultaneously against the same tables (2026-09-18). One
# group for this workflow, cancel-in-progress off so a later run waits
# rather than killing a half-written card.
concurrency:
  group: daily-card
  cancel-in-progress: false

env:
  # ══ 2026-11-04 · B152/B153/B154 — sb_observer, loaded for EVERY step ══
  # `site` imports `sitecustomize` at interpreter startup, searching sys.path,
  # which includes PYTHONPATH. mlb_pipeline/sitecustomize.py imports
  # sb_observer, so one variable here puts the non-2xx observer in front of
  # all 386 silent-swallow call sites without editing one of them.
  #
  # Verified before shipping: of 1,523 .py files in mlb_pipeline, ZERO shadow
  # a stdlib or third-party module name, so adding the directory to the import
  # path cannot hijack `json`, `statistics`, `requests` and friends.
  #
  # The observer only REPORTS. It never raises, retries or alters a response,
  # so a step that swallowed a 400 still swallows it — it just can no longer
  # do so silently. SB_OBSERVER_STRICT=1 is the opt-in that turns schema and
  # constraint errors into a failed run; deliberately NOT set here, so the
  # nightly gets louder without getting more fragile.
  PYTHONPATH: ${{ github.workspace }}/mlb_pipeline

jobs:
  surfaces:
    runs-on: ubuntu-24.04
    # ══ 2026-11-02 · RAISED 45 -> 90 ══════════════════════════════════
    # 45 was never hit in 30 runs (2.6-21.0m) and then was hit by ALL
    # THREE runs on NFL Sunday, killing the back half of the job — the
    # Steam Room surfaces, the Ladder, the Ledger, the watchdog and the
    # matview refresh. The slate that makes this job longest is the slate
    # whose output matters most, so a wall tuned to quiet days silently
    # removes the busy ones.
    #
    # 90 is headroom, not a diagnosis: the 11-01 runs were killed
    # mid-flight so their true length is unknown. The step-duration report
    # below is what will say where the time actually goes.
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Heartbeat — start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          CRON_SLOT="${{ github.event.schedule }}"
          case "$CRON_SLOT" in
            '7 5 * * *')   SLOT='05' ;;
            '7 11 * * *')  SLOT='11' ;;
            '7 17 * * *')  SLOT='17' ;;
            # 2026-11-03: a workflow_run rebuild carries no cron. Label it
            # with the sport that triggered it so the ordering this fix is
            # for stays auditable in workflow_heartbeat.
            *)             if [ "${{ github.event_name }}" = "workflow_run" ]; then
                             SLOT="after:${{ github.event.workflow_run.name }}"
                           else
                             SLOT='manual'
                           fi ;;
          esac
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"daily_card\",\"event\":\"start\",\"sport\":\"MULTI\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"$SLOT\"}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 2026-09-29 · python-dotenv ADDED. Its absence failed three steps
          # instantly on the first real run:
          #
          #   settle_prop_receipts.py — exit 1 after 0s
          #   jerry_anchor_potd.py    — exit 1 after 0s
          #   generate_sweat_card.py  — exit 1 after 0s
          #
          # "after 0s" was the whole diagnosis: they died before doing any
          # work, i.e. at import. Each calls load_dotenv, and this workflow —
          # split out of mlb_pipeline.yml on 09-28 — inherited the scripts but
          # not their dependency list. mlb_pipeline.yml installs python-dotenv;
          # this did not.
          #
          # compute_surface_records.py runs in the SAME step and passed, which
          # ruled out env vars and working-directory as causes and pointed
          # straight at a per-script import.
          #
          # Resolved by walking the imports of all eight scripts AND the local
          # modules they import (19 files), rather than fixing the three that
          # happened to fail: dotenv and requests are the only third-party
          # needs. Deliberately NOT copying mlb_pipeline's full list —
          # scikit-learn, xgboost and playwright would add minutes to a job
          # that needs none of them.
          pip install requests python-dotenv python-dateutil pytz

      # Settle anything gradeable BEFORE composing, so today's surfaces
      # carry yesterday's results rather than a page of "Pending" — which
      # is exactly what the 09-28 card showed.
      - name: Settle receipts + refresh records
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # --commit is REQUIRED: this script defaults to a dry run and
          # prints "DRY RUN — add --commit to write." Without the flag the
          # step would pass every day and settle nothing, which is a worse
          # failure than not scheduling it at all — it would look fixed.
          #
          # 2026-10-06 · --sport is deliberately NOT passed. It used to default
          # to MLB, so this line — the settler's only scheduled caller — settled
          # MLB and silently skipped the NFL branch for the four days it
          # existed, leaving 25 settleable NFL receipts ungraded while the step
          # exited 0. The default is now ALL and the script iterates its own
          # supported-sport list, so adding a sport in the script is enough and
          # this file never has to change again. Do not "fix" this by hardcoding
          # a sport here; that reintroduces the exact failure.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "settle_prop_receipts.py" python settle_prop_receipts.py --commit
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "compute_surface_records.py" python compute_surface_records.py
          # 2026-10-24 B172 - snapshot the record so a CHANGE to it is
          # detectable. On 10-23 the all-time Sharp went +81.21u to
          # +36.77u overnight and nothing noticed, because
          # surface_records holds one row per key UPDATED IN PLACE: once
          # the number moved the previous value was gone and could not be
          # diffed at all. Runs right after the writer above so the
          # snapshot always reflects what was just published.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "snapshot_surface_records.py" python snapshot_surface_records.py --apply
          # 2026-10-23 - Andy: "the record up top is 530-384-10 but below says
          # sides 87-45 props 56-48, the math isn't mathing."
          #
          # It wasn't. split_sharp_card_record.py exists precisely to make
          # sides+props equal the headline, and it was in NO workflow - it ran
          # once by hand on 2026-09-24, so the breakdown under the headline was
          # a MONTH stale while the headline updated nightly. Third time this
          # exact shape has shipped; see the refresh_calibration_notes.py note
          # directly below, added two days ago for the same reason.
          #
          # It also silently computed 0-0-0 once the leg writer switched from
          # 'W'/'L' to 'WIN'/'LOSS' - fixed in the same commit.
          #
          # Immediately AFTER compute_surface_records and in the same step, so
          # it splits the records this run just wrote.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --detector             --label "split_sharp_card_record.py"             python split_sharp_card_record.py --sport ALL --write
          # 2026-10-21 - Andy: "make sure it updates record by itself if we
          # are going to put record". The UFC banner quotes a live W-L ("UFC
          # reads are 11-7 (61.1%) across 18 graded picks") and
          # refresh_calibration_notes.py builds that sentence out of
          # surface_records - but it was in NO workflow. It ran only when
          # someone ran it by hand, so the record in front of users was
          # frozen at whenever that last was. A banner quoting a number
          # nobody refreshes is worse than a banner with no number in it.
          #
          # Here rather than in ufc_pipeline.yml: the script owns NHL, NCAAB
          # and UFC (OWNED in the module), so it belongs on the cross-sport
          # cadence. Immediately AFTER compute_surface_records and in the
          # same step, so it reads the records this run just wrote instead of
          # yesterday's. It touches only sports in OWNED and leaves
          # operator-written copy alone, so it cannot overwrite a
          # hand-authored banner - NBA's "fix is in review" message is safe.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "refresh_calibration_notes.py" python refresh_calibration_notes.py

      # 2026-11-07 - RESTORE A SPREAD PICK'S MISSING LINE BEFORE ANYTHING
      # PRICES OR PUBLISHES IT.
      #
      # fix_nhl_rl_pick_lines.py was written 2026-11-04, already takes
      # --sport for NHL/NBA/NCAAB/NFL/NCAAF, and was in NO workflow - the
      # same shape as the Dawg that stayed dark after being fixed. Measured
      # 2026-11-07 before wiring it: 32 picks across four sports held
      # primary_play.line = null with the number sitting in close_spread /
      # close_puckline on their OWN row (NCAAF 18, NBA 7, NFL 6, NHL 1).
      #
      # Root cause per that script: the pick is resolved BEFORE the odds
      # land, and pick_lock then preserves the published unlined
      # primary_play on every later pass, so the gap never heals by itself
      # (feedback_late_data_must_invalidate_derived_output). It therefore has
      # to run on the daily cadence, not once.
      #
      # Why it sits HERE, ahead of POTD rather than ahead of the card:
      # receipt_invariants REFUSES a line-bearing market with no pick_line,
      # so those picks publish UNGRADEABLE, and the POTD price path falls
      # back to -110 for a side market - Buffalo -1.5 closed at +180.
      # Grading a +180 play at -110 is not a rounding error. Both the anchor
      # below and the card after it need the line already restored.
      #
      # The SIDE is never chosen, only re-derived for the side already
      # stored, so a pick cannot change teams. The script confirms every
      # PATCH by readback and stamps _line_restored_from_ctx so a later
      # audit can tell a restored line from a resolver-written one.
      # || true: a line repair failing must never stop the card.
      - name: Restore missing spread lines (all sports)
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          for S in NHL NBA NCAAB NFL NCAAF; do
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
              --label "fix_nhl_rl_pick_lines.py $S" \
              python fix_nhl_rl_pick_lines.py --sport "$S" || true
          done

      # POTD first: generate_sweat_card reads best_bet_<date> out of
      # jerry_cache, so composing the card before the anchor runs gives a
      # card with an empty POTD slot.
      - name: Play of the Day (any sport)
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "jerry_anchor_potd.py" python jerry_anchor_potd.py --threshold 70
          # 2026-10-22 - Andy: "Why was POTD recoreded wrong, ensure that
          # doesnt happen again."
          #
          # 10-21's POTD was 'Toronto Raptors -8.5'. TOR won 135-92 and it
          # was stored as 'no-pick' - the record of a day we played and won
          # said we never played. The parser hole is fixed, but the deeper
          # problem was that NOTHING CHECKED. verify_potd_coverage.py existed
          # and was in no workflow, and it treated 'no-pick' as a settled
          # outcome, so it would have passed on that row anyway.
          #
          # Both fixed: 'no-pick' is now only terminal when the lean does not
          # name a play, and the checker runs here, right after the anchor
          # that writes the pick. --warn-only so an integrity report never
          # stops the card being built; the point is that it is VISIBLE in
          # the log every run instead of being discovered by Andy.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "verify_potd_coverage.py" \
            python verify_potd_coverage.py --warn-only

      - name: Sweat Card
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "generate_sweat_card.py" python generate_sweat_card.py

      # 2026-10-03 · CHECK THE CARD BEFORE ANYONE ACTS ON IT.
      # The 10-02 Sharp shipped three defects at once, all of which this
      # catches: Liberty ML at -300 (past the documented -200 trap),
      # "State · 85% vs 59% implied" (team_short took the last word of
      # "Penn State"), and a write-up that closed "Delaware has value" under
      # a Liberty pick. Verified against that card: 3 FAIL, and it also
      # found the Sweat Card had published with ZERO items.
      #
      # The Sweat Card HARD-LOCKS at noon ET, so a bad card published at
      # 10:55 is awkward to retract — the check is worth more before the
      # lock than after. continue-on-error so a check bug can never block
      # the card itself; it reports, a human decides.
      - name: Card integrity check
        if: always()
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python check_card_integrity.py

      # ══ 2026-10-06 · PRICE WHAT WE JUST PUBLISHED ══
      # 2,523 of 17,932 receipts (14.1%) carry no price, and it is the
      # user-facing surfaces that are missing it:
      #
      #     dawg         130/130  100%     game_read  1014/1340  76%
      #     daily_degen  156/156  100%     potd        100/146   68%
      #     sweat_card   827/1030  80%     sharp_card    31/602   5%
      #
      # A record without prices cannot say whether the money went up: 5-3 on
      # -250 favourites loses, 5-3 on +120 dogs wins well. The Dawg is the
      # sharpest case — its real prices turn out to be -180 to -200, so every
      # Dawg figure ever shown assumed juice it never had.
      #
      # THE FIX IS NOT A NEW SCRIPT. backfill_receipt_prices.py was written
      # 2026-10-04, works, and was in NO workflow — run by hand once, never
      # again. That is why game_read sits at 24% priced instead of 0% or
      # 100%. Scheduling the thing that already exists is the whole fix.
      #
      # It runs AFTER the card, POTD and ledger so it prices the receipts
      # this run just wrote, and it only ever fills columns that are NULL —
      # it never overwrites a published price, and it reads each write back
      # (a 204 is not a write).
      #
      # == 2026-11-07 - THE WINDOW THIS COMMENT CLAIMED DID NOT EXIST ==
      # This said "A 7-day window keeps it cheap; the historical sweep is a
      # manual --since run." There was no --since flag and no window: every
      # run reconstructed every game ever recorded, for all 7 sports, 3x a
      # day. Combined with a dedupe that had been dead since 10-31 (see
      # upsert_batch), each run re-POSTed its whole history one row at a
      # time and took a 23505 on every row that already existed -- MLB
      # alone measured 1,028 rejected INSERTs per run. That is what
      # depleted the Supabase disk IO budget.
      #
      # --days 14 now makes the claim true. The backlog is already drained
      # (the broken loop did write every genuinely-new row, expensively),
      # so nothing is lost today; an older gap needs a manual
      # `--days 0` sweep, which is still the default when run by hand.
      # ══ 2026-10-07 · CAPTURE THE RECEIPTS BEFORE PRICING THEM ══
      # backfill_public_receipts.py was in NO workflow — the same failure as
      # the price backfill below. Run by hand once, never again.
      #
      # What that cost: the Ledger went cross-sport around 09-28 (its legs
      # now pair e.g. a Yankees ML with an Avalanche ML, so sport_scope is
      # 'MULTI'), and 16 of the 17 snapshots since then had no receipt at
      # all. The app's October Ledger card read "1-0 +1.15u" while
      # ledger_snapshots held 9-4 +8.21u — including yesterday's two
      # parlays, both WON, showing as no record whatsoever.
      #
      # Runs BEFORE the pricing step so a receipt written today is priced in
      # the same pass. Idempotent: ignore-duplicates on
      # (sport, surface, game_date, source_id).
      - name: Capture receipts from the source tables
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # ══ 2026-10-20 · A HARDCODED SPORT LIST, AGAIN ══
          # NBA and UFC were absent, so neither produced a single
          # game_read receipt. Measured over the last 7 days:
          #
          #   reads -> receipts   NFL 29->29  NCAAF 79->79  NHL 79->79
          #                       MLB  7->7   NBA 37->0     UFC 15->0
          #
          # So NBA went into opening night with reads publishing and no
          # record behind any of them, and UFC has never had one. Same
          # shape as the kickoff_utc SELECT and the ctx chain that ended
          # at NHL: a per-sport list that someone has to remember to
          # extend. NCAAB added now rather than on 11-03.
          for S in MLB NFL NCAAF NHL NBA NCAAB UFC; do
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"               --label "backfill_public_receipts.py ($S)"               python backfill_public_receipts.py --sport "$S" --days 14 || true
          done

      # ══ 2026-10-13 · ignore-duplicates CANNOT DELIVER A LATE GRADE ══
      # The step above writes with Prefer: resolution=ignore-duplicates, which
      # is right for the immutable half of a receipt — a published pick, line
      # and price must never be rewritten. But `result` and `graded_at` are
      # NULL at publish time and arrive hours later. Ignore-duplicates means a
      # receipt first written BEFORE its grade existed can never receive it.
      #
      # Whether a receipt was affected was a pure race against the grader:
      #   snapshot 390 (10-11 20:41) → receipt written AFTER grading → LOSS
      #   snapshot 389 (10-11 11:15) → receipt written BEFORE grading → NULL
      #
      # Measured on discovery: 21 of 258 ledger receipts sat permanently
      # ungraded while their snapshot carried a result, going back to 09-24.
      # The stale rows skewed toward WINs, so the receipt trail under-reported
      # the surface. 0 conflicted, so nothing was ever graded wrong — the
      # grades simply never arrived.
      #
      # This fills those NULLs and ONLY those NULLs. It never overwrites a
      # receipt that already carries a result, and it verifies the source row
      # still describes the same bet before trusting its grade (a mutable
      # source row gets regenerated under a frozen receipt — see the script's
      # header for the two measured cases).
      - name: Deliver late grades to receipts written before grading
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # 2026-10-22 · --source ledger_snapshots -> all.
          # Andy: "seeing Laker game on sweat card as undragded, when they
          # covered the 5.5". The Lakers read graded Win, refresh_card_grades
          # wrote Win into the card, and the Sweat Card RECEIPT stayed NULL -
          # because this step, the only scheduled caller, synced ONE source.
          # jerry_reads, prop_jerry_reads and the card/POTD blob pass were
          # never run on a schedule at all, so every surface except the
          # Ledger depended on someone running this by hand.
          #
          # `all` covers the three tabular sources plus the blob/POTD pass
          # (which only runs under `all`, deliberately - naming one tabular
          # source means you want that source).
          # 2026-10-22 · RESOLVE THE DEGEN BEFORE SYNCING ITS GRADE.
          # resolve_daily_degen ran ONLY in mlb_pipeline.yml, which was
          # right when the Degen was an MLB parlay. It now builds legs
          # across NCAAF, NBA and NHL, so its resolution hung off the MLB
          # workflow firing - and sat behind MLB-only table lookups that
          # left every non-MLB leg Pending forever (fixed today).
          #
          # Here it runs on the cross-sport cadence, and BEFORE the sync
          # above, so the slip is graded by the time the sync looks for its
          # grade. Ordered the other way the receipt stays NULL for a day
          # even when the slip resolved - which is what Andy saw on the
          # 10-21 degen row this morning. Idempotent: it only touches rows
          # still Pending.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "resolve_daily_degen.py" \
            python resolve_daily_degen.py --backfill || true
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "sync_receipt_grades.py (all sources)" \
            python sync_receipt_grades.py --source all --apply || true
          # And the surfaces whose bets NOBODY else publishes. The Fade's
          # whole point is taking a side no other surface took, so there is
          # never a sibling receipt to copy a grade from and
          # reconcile_receipt_results skips any group of one. These grade
          # straight from the final score: 'Under 229.5' on a 128-110 game is
          # a LOSS and needs no source row to say so.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "grade_game_market_receipts.py" \
            python grade_game_market_receipts.py --days 30 --apply || true
          # 2026-10-22 - Andy, accepting the ~250 September MLB prop
          # receipts as permanently ungraded: "as long as that many plays
          # arent going ungrqdaed going foraard across any sport."
          #
          # That is a condition, so it gets a check rather than an
          # intention. Measured that day: September ran 2.0% ungraded (the
          # accepted backlog) while October ran 0.3%, and over 14 days MLB,
          # NBA, NFL, NHL and UFC were all at ZERO. So the backlog was an
          # anomaly, not a trend - and this makes that falsifiable daily
          # instead of quarterly when someone notices a surface went dark.
          #
          # Runs AFTER the three graders above, so it measures what they
          # left behind rather than racing them. --warn-only because a
          # single stuck receipt must not stop the card being built; the
          # value is that it is visible in the log every run.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "verify_receipt_grading_coverage.py" \
            python verify_receipt_grading_coverage.py --days 14 --warn-only

      - name: Price the receipts just published
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "backfill_receipt_prices.py" \
            python backfill_receipt_prices.py --since "$SINCE" --apply

      # ══ 2026-10-07 · RESULTS MUST KEEP SETTLING AFTER THE PICK LOCK ══
      # The Sweat Card HARD-LOCKS at noon ET and refuses every republish
      # after it. That is correct for PICKS — a subscriber who acted on the
      # card must not see it change. It is wrong for yesterday's RESULTS,
      # which settle hours after the lock by definition: games finish at
      # night and grade in the morning.
      #
      # With no way to refresh them, a wrong grade sat on the home screen
      # for a full day. Andy saw it today: the recap read 2-1 with one
      # pending while the real figure was 4-0 — Yamamoto's POTD showed Loss
      # against a box score of 21 outs, and Yastrzemski showed Pending
      # having gone 0-for.
      #
      # This writes exactly ONE key (yesterday_recap) and cannot touch
      # today's picks, so it is safe to run on every slot including the
      # post-lock ones. It runs AFTER settling and receipt capture so it
      # sees the freshest grades.
      - name: Refresh yesterday's recap (post-lock safe)
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "refresh_yesterday_recap.py"             python refresh_yesterday_recap.py --apply

      # ══ 2026-10-07 · WHICH MODEL IS ACTUALLY RIGHT ══
      # Andy: "we should know how good Jerry model vs panel is."
      #
      # Grades every model against the CLOSING LINE using only values frozen
      # in jerry_reads.input_snapshot before kickoff, so nothing here can be
      # hindsight. Writes one surface_records row per (sport, model), which
      # is the same table the app already reads.
      #
      # Runs once a day on the 05 UTC slot — it re-grades history, so there
      # is nothing to gain from running it three times.
      - name: Model scorecard (once daily)
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # 2026-11-03: was `HOUR=$(date -u +%H)` matched against 05/06.
          # The 05:00 cron lands 7-10h late, so HOUR is never 05 or 06 and
          # the model scorecard silently stopped running. Key on the cron
          # that fired instead. feedback_cron_mode_from_runtime_clock.
          SCHED="${{ github.event.schedule }}"
          if [ "$SCHED" = "7 5 * * *" ]              || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"               --label "model_scorecard.py" python model_scorecard.py --apply
          else
            echo "skip: model scorecard runs on the '7 5 * * *' slot (fired: '${SCHED:-<none>}')"
          fi

      # ══ 2026-10-20 · THE FADE WAS NEVER SCHEDULED ══
      # ANDY, mid-QA: "HWy does the fade still have the split information
      # it says the fade but still has the sopkits data in it".
      #
      # Because generate_the_fade.py was in NO workflow. It shipped on
      # 10-19 and only ever ran because I invoked it by hand that day, so
      # jerry_cache held exactly one fade_<date> row (10-19) while the
      # legacy fade_public_<date> keys kept being written daily. The client
      # reads `fade_${todayET}`, found nothing for today, and the tab
      # rendered as the old Split surface under the new name.
      #
      # Third instance of the same failure shape today, after the
      # kickoff_utc SELECT and the receipt-capture sport loop: a thing that
      # works when run by hand and is in no cron.
      #
      # Placed with the other Steam Room surfaces, which is where it
      # belongs - The Fade is a Steam Room tab - and BEFORE the receipts
      # capture above would be wrong: this writes its own receipts.
      # ══ 2026-11-02 · MOVED OUT TO .github/workflows/the_fade.yml ══
      # It was HERE, at the back of ~30 steps, and on 2026-11-01 all three
      # runs hit this job's 45-minute timeout (45.1m / 45.1m / 45.1m,
      # against 2.6-21.0m on each of the previous 30 runs). Every step from
      # this point on was skipped, and because the end-heartbeat is
      # `if: always()` the runs still looked complete. Receipts written:
      #
      #                   10-30   10-31   11-01
      #     fade              6      27       0
      #     sharp_card        2      11       0
      #     daily_degen       1       1       0
      #
      # The Fade is the only football surface with a measured positive
      # record (26-12, +30.3% ROI on its validated markets), it runs in
      # seconds, and it was losing its slot to the most expensive job in
      # the repo on the one day of the week it matters most.
      #
      # It now has its own workflow on a 2-hourly cron. NOT duplicated here
      # as a backup: the cache row is merged read-then-write, so a second
      # concurrent writer can lose a play between the two.

      - name: Steam Room — Ladder + Ledger
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "steam_room_ladder.py" python steam_room_ladder.py
          # 2026-10-22 · BADGE vs READ SAFETY NET.
          # The real fix is in jerry_reads_dual_write: it now re-reads
          # primary_play at WRITE time, because the old code aligned
          # against a copy captured before the LLM calls and a mid-flight
          # re-score left the writer's own pick standing. Measured before
          # that fix: 76 of 876 reads (8.7%) disagreed with their badge on
          # the SIDE - NCAAF 14%, NFL 6%, NBA 2.4%, NHL 1.2%.
          #
          # This is the net under it. Anything that still slips - a read
          # written by a path that bypasses the dual-write, or a re-score
          # that lands after the read - gets realigned to primary_play
          # before users see it. --days 1 only: a past read has graded
          # receipts behind it and realigning those changes the record.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "backfill_jerry_pick_alignment.py" \
            python backfill_jerry_pick_alignment.py --days 1 || true
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "generate_ledger.py" python generate_ledger.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "snapshot_ledger.py" python snapshot_ledger.py

      # ══ 2026-11-07 · A WORKFLOW THAT NEVER RUNS EMITS NO FAILURE ══════
      # Andy: "Money flow not listed in app for any nba or nhl game."
      # Root cause was not the money-flow code. nba_pipeline last started
      # 2026-11-06T00:01 UTC and nhl_pipeline 2026-11-05T21:53, and neither
      # was dispatched again: every nba/nhl_game_context row carries
      # updated_at of 11-05 and both props tables stop dead there. Props,
      # contexts, reads, lines and money flow were ALL dark for ~36h and
      # nothing anywhere went red, because a cron GitHub never fires
      # produces no run, no failed step and no alert. Every guard this repo
      # has assumes a run happened.
      #
      # watchdog_workflow_heartbeat.py was written 2026-09-28 precisely to
      # answer "did today's run start at all?" -- its own docstring says the
      # telemetry "was collected and never checked" -- and it was then
      # scheduled in ZERO workflows, so it never checked it either. Fourth
      # already-written fix found sitting in no workflow in two days
      # (feedback_green_step_that_writes_nothing).
      #
      # IT LIVES HERE AND NOT IN THE SPORT PIPELINES ON PURPOSE. A watchdog
      # for dropped crons cannot sit inside a workflow that can itself be
      # dropped -- nba_pipeline cannot report nba_pipeline being dark.
      # daily_card is the most reliable host measured: 14 of 14 days in
      # 2026-10-24..11-06 and 64 firings since 11-01, and
      # project_card_builds_before_every_other_sport_1102 records it as the
      # only pipeline that was running on time.
      #
      # continue-on-error so a dropped cron reports without taking the card
      # down with it; run_step.sh records the failure and --gate turns the
      # run red at the end.
      - name: Dropped-cron watchdog (every sport)
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "dropped-cron watchdog"             python watchdog_workflow_heartbeat.py

      - name: Consistency watchdog
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # ══ 2026-09-28 · HONOUR THE WATCHDOG'S OWN EXIT CONTRACT ══
          # consistency_watchdog.py:521 is explicit about what its codes mean:
          #   sys.exit(2 if critical > 0 else (1 if tripped > 0 else 0))
          #   # 0 clean, 1 warnings, 2 critical (workflow can gate on this)
          #
          # Wrapping it in run_step.sh threw that away: run_step records ANY
          # non-zero as a failed step, and the --gate step then turns the run
          # red. So a single non-critical warning failed the whole job and
          # emailed Andy. Today it was one line — "potd_grade_mirror: 1 POTD
          # date(s) with state mismatch" — 1 of 7 checks tripped, 0 critical.
          # That is exactly the case the script assigns code 1 so it can be
          # treated as a warning.
          #
          # My own bug, introduced when this workflow was split out earlier
          # today. mlb_pipeline.yml calls the same script bare for this reason.
          # A watchdog that reddens the run on every warning gets ignored,
          # which is worse than not having one.
          set +e
          python consistency_watchdog.py
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then
            # Critical — record it so the gate fails the run.
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
              --label "consistency_watchdog.py CRITICAL (exit $code)" false
          elif [ "$code" -eq 1 ]; then
            echo "::warning::consistency_watchdog: non-critical checks tripped — see log"
          else
            echo "ok: consistency_watchdog.py (all checks clean)"
          fi

      # ══ 2026-09-28 · CROSS-SPORT MATVIEWS BELONG IN THE CROSS-SPORT JOB ══
      # team_situational_records_full and team_stats_rolling_full are refreshed
      # in ONE shot for every sport, and the only place that refresh ran was
      # mlb_grade_overnight.yml. So the Situational Records and Team Stats
      # cards for NHL, NBA and NCAAB were all downstream of the BASEBALL
      # workflow continuing to run — and MLB is in the Wild Card round with
      # about a month left. Nothing would have errored; the cards would just
      # have quietly stopped updating on whichever sports were in season.
      #
      # Duplicated rather than moved: MLB's copy runs right after grading,
      # where fresh results matter most, and removing it would couple MLB's
      # own cards to this job's schedule. A REFRESH is idempotent, so running
      # it in both places costs a little time and risks nothing.
      #
      # The status code is checked, not discarded. This RPC returned 42809 for
      # six days after the 09-16 matview rename and nobody heard, because from
      # curl's point of view a 400 and a 204 look identical.
      - name: Refresh cross-sport matviews (situational + team stats)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          for fn in refresh_team_situational_records refresh_team_stats_rolling; do
            code=$(curl -s -o /tmp/rpc_$fn.json -w '%{http_code}' -X POST \
              "$SUPABASE_URL/rest/v1/rpc/$fn" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            if [ "$code" != "200" ] && [ "$code" != "204" ]; then
              echo "::warning::$fn failed ($code): $(cat /tmp/rpc_$fn.json)"
            else
              echo "$fn ok ($code)"
            fi
          done

      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"daily_card\",\"event\":\"end\",\"sport\":\"MULTI\",\"run_id\":\"${{ github.run_id }}\"}" || true

      # Turns the run red if any step above was recorded as failed, so a
      # silently broken surface cannot show a green check.
      - name: Gate — fail the run if any step failed
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
