name: Daily Card (sport-agnostic surfaces)

# ══ WHY THIS EXISTS ══
#
# Andy, 9:26am 2026-09-28: "dont see a sweat card in app or POTD", then
# "i just want to make sure top sport picks are surfacing".
#
# Seven of the nine user-facing surfaces were produced ONLY inside
# mlb_pipeline.yml:
#
#     Sweat Card · The Sharp · POTD · Dawg of the Day
#     Ladder · Ledger · Daily Degen
#
# Only money-flow splits, game reads and externals were distributed across
# the six sport pipelines. So every headline surface in the product hung
# off the baseball workflow — and baseball's regular season ended 2026-09-27.
# The morning the card went missing was not a one-off, it was the first day
# of a permanent condition.
#
# This runs the surfaces that DO NOT need baseball, on their own schedule,
# so the product keeps producing picks through the MLB offseason and through
# every future gap between sports.
#
# ── WHAT IS HERE, AND WHY EACH ONE QUALIFIES ──
# Audited by the tables each script actually reads:
#
#   jerry_anchor_potd.py    AGNOSTIC  — reads jerry_reads (every sport
#                                       writes it) + jerry_cache. POTD has
#                                       always been able to pick from any
#                                       sport; it was only ever SCHEDULED
#                                       inside the MLB workflow.
#   settle_prop_receipts.py AGNOSTIC  — and was in NO workflow at all. It
#                                       is the fallback grader for props
#                                       whose source row was pruned, and
#                                       only ever ran when
#                                       grade_public_receipts imported it.
#   snapshot_ledger.py      AGNOSTIC
#   generate_sweat_card.py  sport-aware; counts all six sports as of
#                           2026-09-28 and composes football picks already
#   steam_room_ladder.py    sport-aware; shared ladder_* tables
#   generate_ledger.py      sport-aware; shared ledger_suggestions
#   consistency_watchdog.py sport-aware; shared watchdog_alerts
#   compute_surface_records sport-aware; already runs in four workflows
#
# ── WHAT IS DELIBERATELY NOT HERE ──
#   generate_dawg_of_day.py    reads daily_dawg + mlb_game_context +
#                              mlb_pipeline_props only — genuinely MLB-bound
#   generate_daily_degen.py    same
# Moving those needs them made multi-sport first, which is real work, not a
# scheduling change. They stay in mlb_pipeline and stop with baseball. That
# is a known gap, not an oversight.
#
# ── mlb_pipeline STILL RUNS ITS COPIES ──
# These steps are NOT removed from mlb_pipeline yet. Every one is
# idempotent (the card is wipe-and-refresh, POTD is threshold-gated,
# ladder/ledger are upserts), so running twice produces the same result,
# and leaving them in place means this workflow can be proven in
# production before anything is taken away from a pipeline that is mid
# postseason. Removal belongs to the offseason restructure.
#
# ── SCHEDULE ──
# GitHub delivers this repo's crons 3.5-6 HOURS late, measured over 20 days
# of workflow_heartbeat. Times below are therefore set early on purpose;
# the comment on each says when it actually lands.

on:
  schedule:
    - cron: '0 5 * * *'    # lands ~08:30-11:00 UTC = 04:30-07:00 ET
    - cron: '0 11 * * *'   # lands ~14:30-17:00 UTC = 10:30-13:00 ET
    - cron: '0 17 * * *'   # lands ~20:30-23:00 UTC = 16:30-19:00 ET
  workflow_dispatch:

# Serialise against itself only. The repo has history here: a single shared
# group let GitHub cancel QUEUED scheduled runs when a push queued behind
# them (2026-09-11), and splitting groups by trigger source then let two
# runs execute simultaneously against the same tables (2026-09-18). One
# group for this workflow, cancel-in-progress off so a later run waits
# rather than killing a half-written card.
concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Heartbeat — start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          CRON_SLOT="${{ github.event.schedule }}"
          case "$CRON_SLOT" in
            '0 5 * * *')   SLOT='05' ;;
            '0 11 * * *')  SLOT='11' ;;
            '0 17 * * *')  SLOT='17' ;;
            *)             SLOT='manual' ;;
          esac
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"daily_card\",\"event\":\"start\",\"sport\":\"MULTI\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"$SLOT\"}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 2026-09-29 · python-dotenv ADDED. Its absence failed three steps
          # instantly on the first real run:
          #
          #   settle_prop_receipts.py — exit 1 after 0s
          #   jerry_anchor_potd.py    — exit 1 after 0s
          #   generate_sweat_card.py  — exit 1 after 0s
          #
          # "after 0s" was the whole diagnosis: they died before doing any
          # work, i.e. at import. Each calls load_dotenv, and this workflow —
          # split out of mlb_pipeline.yml on 09-28 — inherited the scripts but
          # not their dependency list. mlb_pipeline.yml installs python-dotenv;
          # this did not.
          #
          # compute_surface_records.py runs in the SAME step and passed, which
          # ruled out env vars and working-directory as causes and pointed
          # straight at a per-script import.
          #
          # Resolved by walking the imports of all eight scripts AND the local
          # modules they import (19 files), rather than fixing the three that
          # happened to fail: dotenv and requests are the only third-party
          # needs. Deliberately NOT copying mlb_pipeline's full list —
          # scikit-learn, xgboost and playwright would add minutes to a job
          # that needs none of them.
          pip install requests python-dotenv python-dateutil pytz

      # Settle anything gradeable BEFORE composing, so today's surfaces
      # carry yesterday's results rather than a page of "Pending" — which
      # is exactly what the 09-28 card showed.
      - name: Settle receipts + refresh records
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # --commit is REQUIRED: this script defaults to a dry run and
          # prints "DRY RUN — add --commit to write." Without the flag the
          # step would pass every day and settle nothing, which is a worse
          # failure than not scheduling it at all — it would look fixed.
          #
          # 2026-10-06 · --sport is deliberately NOT passed. It used to default
          # to MLB, so this line — the settler's only scheduled caller — settled
          # MLB and silently skipped the NFL branch for the four days it
          # existed, leaving 25 settleable NFL receipts ungraded while the step
          # exited 0. The default is now ALL and the script iterates its own
          # supported-sport list, so adding a sport in the script is enough and
          # this file never has to change again. Do not "fix" this by hardcoding
          # a sport here; that reintroduces the exact failure.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "settle_prop_receipts.py" python settle_prop_receipts.py --commit
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "compute_surface_records.py" python compute_surface_records.py

      # POTD first: generate_sweat_card reads best_bet_<date> out of
      # jerry_cache, so composing the card before the anchor runs gives a
      # card with an empty POTD slot.
      - name: Play of the Day (any sport)
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "jerry_anchor_potd.py" python jerry_anchor_potd.py --threshold 70

      - name: Sweat Card
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "generate_sweat_card.py" python generate_sweat_card.py

      # 2026-10-03 · CHECK THE CARD BEFORE ANYONE ACTS ON IT.
      # The 10-02 Sharp shipped three defects at once, all of which this
      # catches: Liberty ML at -300 (past the documented -200 trap),
      # "State · 85% vs 59% implied" (team_short took the last word of
      # "Penn State"), and a write-up that closed "Delaware has value" under
      # a Liberty pick. Verified against that card: 3 FAIL, and it also
      # found the Sweat Card had published with ZERO items.
      #
      # The Sweat Card HARD-LOCKS at noon ET, so a bad card published at
      # 10:55 is awkward to retract — the check is worth more before the
      # lock than after. continue-on-error so a check bug can never block
      # the card itself; it reports, a human decides.
      - name: Card integrity check
        if: always()
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python check_card_integrity.py

      # ══ 2026-10-06 · PRICE WHAT WE JUST PUBLISHED ══
      # 2,523 of 17,932 receipts (14.1%) carry no price, and it is the
      # user-facing surfaces that are missing it:
      #
      #     dawg         130/130  100%     game_read  1014/1340  76%
      #     daily_degen  156/156  100%     potd        100/146   68%
      #     sweat_card   827/1030  80%     sharp_card    31/602   5%
      #
      # A record without prices cannot say whether the money went up: 5-3 on
      # -250 favourites loses, 5-3 on +120 dogs wins well. The Dawg is the
      # sharpest case — its real prices turn out to be -180 to -200, so every
      # Dawg figure ever shown assumed juice it never had.
      #
      # THE FIX IS NOT A NEW SCRIPT. backfill_receipt_prices.py was written
      # 2026-10-04, works, and was in NO workflow — run by hand once, never
      # again. That is why game_read sits at 24% priced instead of 0% or
      # 100%. Scheduling the thing that already exists is the whole fix.
      #
      # It runs AFTER the card, POTD and ledger so it prices the receipts
      # this run just wrote, and it only ever fills columns that are NULL —
      # it never overwrites a published price, and it reads each write back
      # (a 204 is not a write). A 7-day window keeps it cheap; the historical
      # sweep is a manual --since run.
      # ══ 2026-10-07 · CAPTURE THE RECEIPTS BEFORE PRICING THEM ══
      # backfill_public_receipts.py was in NO workflow — the same failure as
      # the price backfill below. Run by hand once, never again.
      #
      # What that cost: the Ledger went cross-sport around 09-28 (its legs
      # now pair e.g. a Yankees ML with an Avalanche ML, so sport_scope is
      # 'MULTI'), and 16 of the 17 snapshots since then had no receipt at
      # all. The app's October Ledger card read "1-0 +1.15u" while
      # ledger_snapshots held 9-4 +8.21u — including yesterday's two
      # parlays, both WON, showing as no record whatsoever.
      #
      # Runs BEFORE the pricing step so a receipt written today is priced in
      # the same pass. Idempotent: ignore-duplicates on
      # (sport, surface, game_date, source_id).
      - name: Capture receipts from the source tables
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          for S in MLB NFL NCAAF NHL; do
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"               --label "backfill_public_receipts.py ($S)"               python backfill_public_receipts.py --sport "$S" || true
          done

      - name: Price the receipts just published
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "backfill_receipt_prices.py" \
            python backfill_receipt_prices.py --since "$SINCE" --apply

      # ══ 2026-10-07 · RESULTS MUST KEEP SETTLING AFTER THE PICK LOCK ══
      # The Sweat Card HARD-LOCKS at noon ET and refuses every republish
      # after it. That is correct for PICKS — a subscriber who acted on the
      # card must not see it change. It is wrong for yesterday's RESULTS,
      # which settle hours after the lock by definition: games finish at
      # night and grade in the morning.
      #
      # With no way to refresh them, a wrong grade sat on the home screen
      # for a full day. Andy saw it today: the recap read 2-1 with one
      # pending while the real figure was 4-0 — Yamamoto's POTD showed Loss
      # against a box score of 21 outs, and Yastrzemski showed Pending
      # having gone 0-for.
      #
      # This writes exactly ONE key (yesterday_recap) and cannot touch
      # today's picks, so it is safe to run on every slot including the
      # post-lock ones. It runs AFTER settling and receipt capture so it
      # sees the freshest grades.
      - name: Refresh yesterday's recap (post-lock safe)
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "refresh_yesterday_recap.py"             python refresh_yesterday_recap.py --apply

      # ══ 2026-10-07 · WHICH MODEL IS ACTUALLY RIGHT ══
      # Andy: "we should know how good Jerry model vs panel is."
      #
      # Grades every model against the CLOSING LINE using only values frozen
      # in jerry_reads.input_snapshot before kickoff, so nothing here can be
      # hindsight. Writes one surface_records row per (sport, model), which
      # is the same table the app already reads.
      #
      # Runs once a day on the 05 UTC slot — it re-grades history, so there
      # is nothing to gain from running it three times.
      - name: Model scorecard (once daily)
        continue-on-error: true
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "05" ] || [ "$HOUR" = "06" ]              || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"               --label "model_scorecard.py" python model_scorecard.py --apply
          else
            echo "skip: model scorecard runs on the 05/06 UTC slot (now ${HOUR} UTC)"
          fi

      - name: Steam Room — Ladder + Ledger
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "steam_room_ladder.py" python steam_room_ladder.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "generate_ledger.py" python generate_ledger.py
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "snapshot_ledger.py" python snapshot_ledger.py

      - name: Consistency watchdog
        working-directory: mlb_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # ══ 2026-09-28 · HONOUR THE WATCHDOG'S OWN EXIT CONTRACT ══
          # consistency_watchdog.py:521 is explicit about what its codes mean:
          #   sys.exit(2 if critical > 0 else (1 if tripped > 0 else 0))
          #   # 0 clean, 1 warnings, 2 critical (workflow can gate on this)
          #
          # Wrapping it in run_step.sh threw that away: run_step records ANY
          # non-zero as a failed step, and the --gate step then turns the run
          # red. So a single non-critical warning failed the whole job and
          # emailed Andy. Today it was one line — "potd_grade_mirror: 1 POTD
          # date(s) with state mismatch" — 1 of 7 checks tripped, 0 critical.
          # That is exactly the case the script assigns code 1 so it can be
          # treated as a warning.
          #
          # My own bug, introduced when this workflow was split out earlier
          # today. mlb_pipeline.yml calls the same script bare for this reason.
          # A watchdog that reddens the run on every warning gets ignored,
          # which is worse than not having one.
          set +e
          python consistency_watchdog.py
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then
            # Critical — record it so the gate fails the run.
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
              --label "consistency_watchdog.py CRITICAL (exit $code)" false
          elif [ "$code" -eq 1 ]; then
            echo "::warning::consistency_watchdog: non-critical checks tripped — see log"
          else
            echo "ok: consistency_watchdog.py (all checks clean)"
          fi

      # ══ 2026-09-28 · CROSS-SPORT MATVIEWS BELONG IN THE CROSS-SPORT JOB ══
      # team_situational_records_full and team_stats_rolling_full are refreshed
      # in ONE shot for every sport, and the only place that refresh ran was
      # mlb_grade_overnight.yml. So the Situational Records and Team Stats
      # cards for NHL, NBA and NCAAB were all downstream of the BASEBALL
      # workflow continuing to run — and MLB is in the Wild Card round with
      # about a month left. Nothing would have errored; the cards would just
      # have quietly stopped updating on whichever sports were in season.
      #
      # Duplicated rather than moved: MLB's copy runs right after grading,
      # where fresh results matter most, and removing it would couple MLB's
      # own cards to this job's schedule. A REFRESH is idempotent, so running
      # it in both places costs a little time and risks nothing.
      #
      # The status code is checked, not discarded. This RPC returned 42809 for
      # six days after the 09-16 matview rename and nobody heard, because from
      # curl's point of view a 400 and a 204 look identical.
      - name: Refresh cross-sport matviews (situational + team stats)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          for fn in refresh_team_situational_records refresh_team_stats_rolling; do
            code=$(curl -s -o /tmp/rpc_$fn.json -w '%{http_code}' -X POST \
              "$SUPABASE_URL/rest/v1/rpc/$fn" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            if [ "$code" != "200" ] && [ "$code" != "204" ]; then
              echo "::warning::$fn failed ($code): $(cat /tmp/rpc_$fn.json)"
            else
              echo "$fn ok ($code)"
            fi
          done

      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"daily_card\",\"event\":\"end\",\"sport\":\"MULTI\",\"run_id\":\"${{ github.run_id }}\"}" || true

      # Turns the run red if any step above was recorded as failed, so a
      # silently broken surface cannot show a green check.
      - name: Gate — fail the run if any step failed
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
