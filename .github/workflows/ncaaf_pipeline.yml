name: NCAAF Pipeline Weekly

on:
  schedule:
    # CFB cadence — Sat is Game Day; also handles Thu/Fri weeknight games.
    - cron: '0 15 * * 2'   # Tue 11am ET  — new week schedule + opening lines
    - cron: '0 22 * * 3'   # Wed 6pm ET   — mid-week refresh + externals pull (Phase 2)
    - cron: '0 18 * * 5'   # Fri 2pm ET   — Fri night games lock + Sat prep
    - cron: '0 12 * * 6'   # Sat 8am ET   — final Sat card + line movement
    - cron: '0 13 * * 0'   # Sun 9am ET   — Sat resolver + Sun cohort refresh
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which sub-pipeline to run manually'
        required: false
        default: 'full'
        type: choice
        options: [full, odds_only, card_only, resolver_only, cohorts_only]

jobs:
  ncaaf-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4 scikit-learn numpy

      - name: Detect run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H); DOW=$(date -u +%u)
            if [ "$DOW" = "7" ] && [ "$HOUR" = "13" ]; then echo "mode=resolver_only" >> $GITHUB_OUTPUT
            elif [ "$DOW" = "6" ] && [ "$HOUR" = "12" ]; then echo "mode=card_only" >> $GITHUB_OUTPUT
            elif [ "$DOW" = "5" ] && [ "$HOUR" = "18" ]; then echo "mode=card_only" >> $GITHUB_OUTPUT
            else echo "mode=full" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Pull Odds API NCAAF lines
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'odds_only' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_odds_pull.py || echo "ncaaf_odds_pull failed (non-fatal)"

      # 2026-08-09 Phase 2: refresh returning production % from CFBD.
      # Weekly (Tue) refresh is enough — this is a season-level number.
      - name: Refresh returning production (Tue only)
        if: github.event.schedule == '0 15 * * 2' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cd mlb_pipeline
          SEASON=$(date +%Y)
          python ncaaf_returning_production_pull.py --season $SEASON || echo "returning production pull failed"

      # 2026-08-23: Roster physicality — ESPN scraper for OL/DL weights +
      # class year. Weekly (Tue) is plenty; rosters don't churn intra-week.
      # Feeds shadow signals ncaaf_ol_weight_adv_* + experience_edge_early_*.
      # Ctx enricher runs same step to populate ol_dl_weight_gap_* etc.
      # Non-fatal — signals just return None for unenriched games.
      - name: Pull NCAAF roster physicality (Tue only)
        if: github.event.schedule == '0 15 * * 2' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          SEASON=$(date +%Y)
          python pull_college_rosters.py --sport NCAAF --season $SEASON || echo "NCAAF roster pull failed (non-fatal)"

      - name: Enrich NCAAF ctx with roster physicality
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_ctx_roster_physicality.py --sport NCAAF --days-ahead 14 || echo "NCAAF physicality enrich failed (non-fatal)"

      # 2026-09-01 FRESHNESS FIX: was Tue-only which meant Sat game stats
      # didn't hit team_stats_rolling until Tue morning (3-day stale ranks
      # after weekend games). Now runs on full (Tue/Wed) AND resolver_only
      # (Sun 9am ET after Sat games grade) so ranks refresh right after
      # weekend results land. CFBD publishes daily during season so daily
      # pulls are safe. Skips silently on Sat/Fri card_only crons (no new
      # games graded yet).
      - name: Refresh CFBD team stats
        if: (steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cd mlb_pipeline
          if [ -f ncaaf_stats_pull.py ]; then
            python ncaaf_stats_pull.py || echo "stats pull failed (non-fatal)"
          else
            echo "ncaaf_stats_pull.py not yet built — Phase 1b"
          fi

      - name: Build NCAAF game context
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_game_context.py || echo "game_context failed"

      # 2026-09-01: NCAAF MC simulator (5th lens). Runs after game_context
      # since it reads projected_spread + projected_total off the ctx row.
      # Simulates 10k games per matchup with GAME_STDDEV=13.5 (CFB variance),
      # writes mc_probabilities blob. Mirrors nfl_mc_simulator.py pattern.
      # Days-forward = 8 so weekend games get MC prepped by Tue/Wed cron.
      - name: NCAAF MC simulator
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_mc_simulator.py --days 8 || echo "NCAAF MC failed (non-fatal)"

      # 2026-08-22 (silent-bug audit finding #14): NCAAF weather pull.
      # Populates temp / wind / wind_speed / dome / weather_source columns
      # so ncaaf_extreme_wind_under, ncaaf_high_wind_under,
      # ncaaf_freezing_cold_under, ncaaf_prop_freezing_rush_boost signals
      # can fire. Uses ~80-team stadium coord table + OpenWeather; unknown
      # venues + neutral sites skip cleanly.
      - name: Pull NCAAF weather (OpenWeather)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_weather_pull.py || echo "NCAAF weather pull failed (non-fatal)"

      # Backfill L5 team ATS / O/U / ML tendencies onto today's rows
      # (2026-08-17). Populates home/away_ats_last5, ou_last5_overs/unders,
      # covers_as_fav/dog%, ml_last5. Activates the 10 NCAAF team_form
      # signals seeded in signal_sources. Runs AFTER ncaaf_game_context.py
      # (rows must exist) and BEFORE game reads / sharp fade / external
      # aggregation so tendencies are on the ctx when downstream consumers
      # read it. Non-fatal — a tendencies failure just means team_form
      # signals evaluate to None and pass; ensemble still scores from
      # other signal classes.
      - name: Backfill NCAAF team ATS/OU tendencies
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # 2026-08-28: --days 10 covers today + upcoming weekend slate.
          # Prior single-day default meant Wed/Thu cron runs found "no
          # games" for the Sat slate and never wrote tendencies, so
          # Sat's picks scored without team_form data.
          python backfill_ncaaf_team_tendencies.py --days 10 || echo "ncaaf tendencies backfill failed (non-fatal)"

      # 2026-08-17: pull season aggregates from teamrankings then enrich
      # today's ctx rows with home/away season cover_pct + over_pct.
      # Activates the 10 team_form_season signals for NCAAF. Runs AFTER
      # rolling tendencies so both signal sets stack. Non-fatal.
      - name: Pull NCAAF season trends from teamrankings
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_teamrankings_trends.py --sport NCAAF || echo "teamrankings pull failed (non-fatal)"

      - name: Enrich NCAAF game context with season trends
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_trends.py --sport NCAAF || echo "trend enrichment failed (non-fatal)"

      # 2026-08-18: universal team-form (venue-split L10 + H2H last 5)
      - name: Enrich team form — venue split + H2H
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NCAAF --days-ahead 14 || echo "team_form_universal non-fatal"

      # 2026-08-28: derive per-team defense stats (PPG, pass_epa_allowed,
      # rush_epa_allowed, success_rate_allowed, explosiveness_allowed)
      # from opponent offense EPA. Fills the gap where ncaaf_team_stats
      # only tracks offense-side EPA. Fuels the 4 ncaaf_def_* signals
      # and the team-defense section of the game detail card.
      - name: NCAAF team defense stats backfill
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_team_defense_backfill.py || echo "NCAAF defense backfill non-fatal"

      # 2026-08-23 season-ready: ScoresAndOdds NCAAF splits scraper.
      # Fadereport + Cleatz already scrape NCAAF via MLB workflow's shared
      # fadereport_scraper.py / cleatz_scraper.py runs (both scrape all
      # sports in one invocation). SO needs per-sport invocation.
      - name: ScoresAndOdds — scrape NCAAF splits
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_scoresandodds.py --sport NCAAF || echo "SO NCAAF failed (non-fatal)"

      # Splits v2 aggregator — normalizes OC/FR/CZ/SO into
      # public_splits_v2, writes game_context.splits_summary JSONB.
      # Must run AFTER all source scrapers.
      - name: Splits v2 aggregator (NCAAF)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python splits_v2_pipeline.py --sport NCAAF || echo "NCAAF splits aggregator failed (non-fatal)"

      # 2026-08-28: recompute primary_play AFTER tendencies + team_form
      # + season trends + splits land. Initial score in ncaaf_game_context
      # runs on a fresh row without team_form fields (they're PATCHed in
      # by later steps), so ML-only picks dominate and 30-point favorites
      # never get spread picks. Recompute re-scores against the enriched
      # ctx rows and patches primary_play in place. Mirrors MLB's
      # recompute_primary_play.py pattern.
      - name: Recompute NCAAF primary_play with enriched signals
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python recompute_ncaaf_primary_play.py --days 10 || echo "ncaaf recompute non-fatal"

      - name: Generate NCAAF game reads (Jerry)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_ncaaf_game_reads.py || echo "game reads failed (non-fatal)"

      # 2026-08-28: NCAAF prompt template writes prose only (no structured
      # CALL block) so parse_synthesis returns empty and dual-write to
      # jerry_reads never fires. This bridge script derives jerry_reads.call_*
      # from ctx.primary_play (mechanical truth) + narrative from jerry_cache.
      # Deterministic — no LLM call. Runs today + next 7 days.
      - name: Sync NCAAF jerry_reads from ctx
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sync_jerry_reads_from_ctx.py --sport NCAAF --window 7 || echo "ncaaf jerry_reads sync failed (non-fatal)"

      - name: External source aggregation pull
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # Sat cron uses --refresh mode (subset of sources for late-week updates)
          if [ "${{ github.event.schedule }}" = "0 12 * * 6" ]; then
            python pull_externals_ncaaf.py --refresh || echo "external refresh failed"
          else
            python pull_externals_ncaaf.py || echo "external pull failed"
          fi

      - name: Detect consensus-fade alerts (NCAAF)
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python detect_consensus_fade.py --sport NCAAF || echo "fade detector failed"

      # 2026-08-22: Compute alignment + write oddscrowd_snapshot to
      # ncaaf_game_context. Prerequisite for sharp-split signals to fire
      # on NCAAF games (registry exists but was silent because
      # oddscrowd_snapshot was never populated). Runs after externals
      # pull so OC data is fresh in external_picks.
      - name: Compute alignment + oddscrowd snapshot
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_align_status_ncaaf.py || echo "align status failed (non-fatal)"

      # 2026-08-22: Flatten oddscrowd_snapshot into line_snapshot so the
      # cross-sport classify_line_moves.py --sport ALL step can generate
      # line_movement_flags for NCAAF.
      - name: Write line_snapshot from oddscrowd data
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python write_line_snapshot.py --sport NCAAF || echo "write_line_snapshot NCAAF failed (non-fatal)"

      - name: Resolve NCAAF external picks (post-game)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_externals.py --sport NCAAF --days 14 || echo "resolver failed"

      - name: Resolve completed games + refresh outcomes
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_ncaaf_results.py || echo "resolver failed"

      - name: Recompute NCAAF cohort calibration
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'cohorts_only' || steps.mode.outputs.mode == 'resolver_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaaf_cohort_backfill.py || echo "cohort backfill failed"

      # 2026-08-25: refresh home/road tendencies materialized view after
      # results resolver + cohort recompute. Powers the expanded
      # Trends & Tendencies card in the NCAAF slot redesign. Uses the
      # refresh_home_road_tendencies(sport) RPC from 20260826b migration.
      - name: Refresh NCAAF home/road tendencies view
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_home_road_tendencies" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_sport": "NCAAF"}' || echo "tendencies refresh failed"

      # 2026-09-01: refresh team_recent_games matview (universal, cross-sport).
      # Feeds the Recent Schedule card on game detail. Uses the
      # refresh_team_recent_games() RPC from 20260901_team_recent_games_matview.
      # Refresh is cross-sport (whole view refreshes in one shot), so this
      # is idempotent regardless of which sport pipeline calls it — but we
      # trigger from each pipeline's resolver so records lag <30 min behind
      # the last game finish.
      - name: Refresh team_recent_games matview
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_recent_games" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "team_recent_games refresh failed"

      # 2026-09-01: refresh team_situational_records matview. Long-format
      # per-team W-L-P by (market × filter). Powers the Situational Results
      # card w/ Spread/Total/ML × Overall/L10/L5/Home/Away/Fav/Dog sub-tabs.
      # Migration: supabase/migrations/20260901b_team_situational_records_matview.sql
      - name: Refresh team_situational_records matview
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_situational_records" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "team_situational_records refresh failed"

      # 2026-09-01: refresh team_stats_rolling matview. Universal
      # long-format per-team stat with raw value + league rank. Kills
      # the NCAAFTeamMatchupCard client-side compute + fuzzy team-match
      # anti-patterns identified in the 9/1 architecture audit.
      # Migration: supabase/migrations/20260901c_team_stats_rolling_matview.sql
      - name: Refresh team_stats_rolling matview
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_stats_rolling" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "team_stats_rolling refresh failed"

      # 2026-08-09: NCAAF sharp-money audit trail. Same infra as MLB/NFL.
      # Rules start in LOG mode until n≥12 accumulates per rule.
      - name: NCAAF — write today's sharp-fade audit rows
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_audit.py --write-today --sport NCAAF || echo "NCAAF audit write failed"

      - name: NCAAF — backfill sharp-fade audit outcomes
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sharp_fade_audit.py --backfill-results || echo "NCAAF audit backfill failed"

      # 2026-09-02: Split — per-source calibration for NCAAF. Cross-sport
      # parity with MLB (was MLB-only until 9/2). Powers The Split's
      # per-source hit% + fade/trust tag on external picks.
      - name: Refresh external source calibration (NCAAF)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
