name: MLB Line Poller

# Continuous line poll — captures Odds API market state every 15 min
# throughout the active betting window. Writes to mlb_line_history and
# updates current_total / current_total_at / line_movement /
# line_movements_count on mlb_game_context.
#
# Why this workflow exists: 2026-07-04 audit found current_total NULL for
# ALL games because line_poller.py existed but was never scheduled. Sharp
# money / reverse-line-movement detection was blind. This closes that gap.
#
# Scope: ODDS POLL ONLY. Single Odds API call per run (uses the batch
# /odds slate endpoint). ~30 runs per active day = ~30 API calls/day.
# Skips in-progress games (their live-total lines aren't comparable to
# pre-game full-game totals).
#
# Locks close_total when a game is within 10 min of first pitch — this
# is the fallback for the 2pm cron's live-game overwrite bug (see
# project_pm_cron_live_game_prop_overwrite).

on:
  schedule:
    # Every 15 minutes from 10:00 UTC (6am ET) through 04:00 UTC (12am ET)
    # covering all game times + pre-game price movement. Cron '*/15' fires
    # at :00 :15 :30 :45.
    # ══ 2026-10-05 · DEMOTED TO FALLBACK ══
    # This was every 15 min across both blocks = 72 scheduled runs/day. It
    # LANDED 3-4 of them (~5%). GitHub refuses the runners ("The job was not
    # acquired by Runner of type hosted") and the workflow reports no failure
    # because the job never starts. Counted by distinct capture minute in
    # line_history: 10-01 4/72, 10-03 4/72, 10-04 4/72, 10-05 3/72.
    #
    # The poller now runs every 15 min on a Windows Task Scheduler job
    # (mlb_pipeline/run_line_poller.cmd, registered by
    # register_line_poller_task.ps1) where it actually fires — verified
    # LastTaskResult=0 and landed runs 3 -> 6 the same afternoon.
    #
    # This stays as a FALLBACK for when that machine is asleep, at hourly
    # instead of every 15 min: 18 runs/day instead of 72, freeing 54 of the
    # 266 daily runner acquisitions that were starving every other workflow.
    # The poller writes unconditionally, so an overlapping GitHub + local run
    # only duplicates one snapshot — it cannot corrupt a price.
    #
    # Delete this schedule once the local task has proven itself over a few
    # days; keep workflow_dispatch either way.
    - cron: '0 10-23 * * *'  # hourly fallback, 6am ET → 7pm ET
    - cron: '0 0-3 * * *'    # hourly fallback, 8pm ET → 11pm ET
  workflow_dispatch:

jobs:
  poll-lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # line_poller needs requests + dotenv only — kept minimal so
        # the workflow starts in under 30 sec.
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Poll MLB lines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python line_poller.py
