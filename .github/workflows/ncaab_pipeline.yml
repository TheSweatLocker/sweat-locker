name: NCAAB Pipeline Daily

# 2026-11-03 MINUTE SPREAD. 57.1% of all cron firings landed on :00
# (60 of 105 across 20 workflows), the most contended minute on
# GitHub's scheduler, and these pipelines were running 7-10h late
# while daily_card was the only one on time
# (project_card_builds_before_every_other_sport_1102). This file now
# fires at :23. Any `github.event.schedule` comparison below was
# rewritten in lockstep -- a stale literal makes the mode fall
# through to its default silently.

on:
  schedule:
    # CBB is nightly during season (Nov-Mar). Off-season these fire as no-ops
    # (Odds API returns 0 events, game_context builds nothing). Cheap to leave
    # scheduled year-round rather than gating on month.
    - cron: '23 14 * * *'   # 10am ET  — morning slate build (Odds + context + Jerry)
    - cron: '23 20 * * *'   # 4pm  ET  — pre-tip refresh (Odds movement, externals)
    - cron: '23 11 * * *'   # 7am  ET  — overnight resolver (last night's finals + cohorts)
    - cron: '23 15 * * 1'   # 11am ET Mon — weekly KenPom refresh (uses existing ncaab_pipeline.py)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which sub-pipeline to run manually'
        required: false
        default: 'full'
        type: choice
        options: [full, odds_only, card_only, resolver_only, kenpom_only, backfill]
      backfill_season:
        description: 'Season for backfill mode (e.g., 2024-25)'
        required: false
        default: ''

env:
  # ══ 2026-11-04 · B152/B153/B154 — sb_observer, loaded for EVERY step ══
  # `site` imports `sitecustomize` at interpreter startup, searching sys.path,
  # which includes PYTHONPATH. mlb_pipeline/sitecustomize.py imports
  # sb_observer, so one variable here puts the non-2xx observer in front of
  # all 386 silent-swallow call sites without editing one of them.
  #
  # Verified before shipping: of 1,523 .py files in mlb_pipeline, ZERO shadow
  # a stdlib or third-party module name, so adding the directory to the import
  # path cannot hijack `json`, `statistics`, `requests` and friends.
  #
  # The observer only REPORTS. It never raises, retries or alters a response,
  # so a step that swallowed a 400 still swallows it — it just can no longer
  # do so silently. SB_OBSERVER_STRICT=1 is the opt-in that turns schema and
  # constraint errors into a failed run; deliberately NOT set here, so the
  # nightly gets louder without getting more fragile.
  PYTHONPATH: ${{ github.workspace }}/mlb_pipeline

jobs:
  ncaab-pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2026-09-08 heartbeat START (parity w/ mlb_pipeline).
      # Silent-failure coverage per project_pipeline_overhaul_909.
      - name: Heartbeat — start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"ncaab_pipeline\",\"event\":\"start\",\"sport\":\"NCAAB\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping start
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NCAAB_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "${HC_URL}/start" || true
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4 scikit-learn numpy playwright
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "playwright install" python -m playwright install chromium --with-deps

      - name: Detect run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            # ══ 2026-11-03 · MODE CAME FROM THE RUN-TIME CLOCK ══
            # This read `HOUR=$(date -u +%H); DOW=$(date -u +%u)` and matched
            # those against the hours the crons are SET to. GitHub Actions
            # runs this repo 7-10h late (measured; see
            # project_card_builds_before_every_other_sport_1102), so the hour
            # at run time is NOT the cron that fired and every slot lands in
            # the wrong bucket non-deterministically.
            #
            # Measured cost on ncaab_pipeline: the Monday 15:00 slot lands
            # ~21:00, `HOUR != 15`, so mode=kenpom_only NEVER happened and
            # every step gated on it has been dead since August --
            # ncaab_kenpom_snapshot.py last wrote 2026-08-24 (71 days) and
            # pull_college_rosters.py never ran. ncaab_rating_snapshots is
            # consequently haslam-only, and the Panel model needs 2+ systems
            # per team, so it could not fire at all.
            #
            # `github.event.schedule` is the cron expression that fired,
            # verbatim and immune to lateness. Match on that. An unknown or
            # empty value falls through to `full`, which is the old default.
            SCHED="${{ github.event.schedule }}"
            echo "cron that fired: '${SCHED:-<none>}'"
            case "$SCHED" in
              '23 11 * * *')  echo "mode=resolver_only" >> $GITHUB_OUTPUT ;;
              '23 20 * * *')  echo "mode=card_only"     >> $GITHUB_OUTPUT ;;
              '23 15 * * 1')  echo "mode=kenpom_only"   >> $GITHUB_OUTPUT ;;
              *)             echo "mode=full"          >> $GITHUB_OUTPUT ;;
            esac
          fi

      # ────── KENPOM (Monday 11am ET only — paid API discipline) ──────
      # ══ 2026-10-21 · DAILY IN NOV/DEC, WEEKLY AFTER ══
      #
      # ANDY: "Should ingestion of data be more frequent since there are
      # games every day enalry in season to update stat rankings"
      #
      # Yes, early. The note this replaces said "ratings converge slowly
      # during season" and that is true in February and wrong in November.
      # KenPom recomputes nightly, and the convergence argument is a
      # statement about SAMPLE SIZE: in late season a team has 25+ games and
      # two more move adj_em barely at all, while in the first month a team
      # has 3-5 games and each one is 20-30% of the sample. A weekly refresh
      # means the rating a card shows can be six days and two games stale
      # exactly while it is moving fastest.
      #
      # So the gate is now date-aware: daily through November and December,
      # weekly from January. Cost is small and this is a paid API, not a
      # scrape — ncaab_pipeline.py plus kenpom_pull.py --no-fanmatch is 4
      # endpoint calls, so the early-season window runs about 28 calls a week
      # against 17 today. Nothing near a rate concern.
      #
      # Torvik + Haslam stay daily as free scrapers either way, and fanmatch
      # stays daily below because it IS the day's slate.
      # The month gate lives in bash below, not in this `if:`. A GitHub
      # expression cannot read the clock without an extra step to publish it,
      # and a date condition that silently evaluates false is the kind of
      # thing that looks like a working weekly cron for a month.
      - name: KenPom refresh (daily early season, weekly after)
        if: steps.mode.outputs.mode == 'kenpom_only' || steps.mode.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          KENPOM_KEY:   ${{ secrets.KENPOM_KEY }}
        run: |
          cd mlb_pipeline
          if [ -z "$KENPOM_KEY" ]; then
            echo "KENPOM_KEY not set — skipping (verified working 2026-10-21, 365 teams)"
            exit 0
          fi
          # Daily in Nov/Dec while each game is a large share of a team's
          # sample; weekly (Monday = kenpom_only) from January, when 25+
          # games in means two more barely move adj_em.
          MONTH=$(date -u +%m)
          if [ "${{ steps.mode.outputs.mode }}" = "full" ] \
             && [ "$MONTH" != "11" ] && [ "$MONTH" != "12" ]; then
            echo "month $MONTH: outside the early-season window — ratings refresh is weekly (Monday) now"
            exit 0
          fi
          echo "month $MONTH mode=${{ steps.mode.outputs.mode }} — refreshing KenPom ratings"
          # --season is NOT passed. Both scripts derive it from the date via
          # ncaab_season.py. It used to be pinned here to `--season 2026`,
          # which is the 2025-26 campaign: with the 2026-27 opener on 11-03,
          # every NCAAB card would have launched on last season's final
          # ratings and never rolled over.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaab_pipeline.py" python ncaab_pipeline.py
          # 2026-09-28: fills kenpom_cache for the APP. The client used to do
          # this itself with the key bundled in the IPA; it now reads cache
          # only.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "kenpom_pull.py (ratings+FF)"             python kenpom_pull.py --no-fanmatch

      # ══ 2026-09-28 · FANMATCH IS DAILY, RATINGS ARE WEEKLY ══
      # Split deliberately. Ratings converge slowly and the step above keeps
      # them weekly to halve paid-API usage. Fanmatch IS the day's slate, so
      # it has to run daily or the app shows nothing — and it previously ran
      # on EVERY USER'S DEVICE, with the key in the bundle and no shared
      # cache, which is one subscription hit once per install per day.
      - name: KenPom fanmatch (daily, app cache)
        if: steps.mode.outputs.mode != 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          KENPOM_KEY:   ${{ secrets.KENPOM_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "kenpom_pull.py (fanmatch)"             python kenpom_pull.py --no-ratings

      # 2026-08-23: Roster physicality — ESPN scraper for frontcourt height +
      # class year. Monday-only (kenpom_only mode) — rosters don't churn
      # intra-week. Feeds shadow signals ncaab_frontcourt_height_adv_* +
      # experience_edge_*. Ctx enricher runs daily below (before card build)
      # so newly scheduled games pick up populated fields.
      - name: Pull NCAAB roster physicality (Mon only)
        if: steps.mode.outputs.mode == 'kenpom_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          SEASON=$(date +%Y)
          python pull_college_rosters.py --sport NCAAB --season $SEASON

      # ────── MULTI-SOURCE RATING SNAPSHOTS (2026-08-14 Session 1 · Panel foundation)
      # Runs 3 rating scrapers in sequence. Each writes to ncaab_rating_snapshots
      # keyed on (snapshot_date, team, season, rating_system). Panel model
      # (Session 3) reads this table + averages across systems.
      # Failures per-source are non-fatal — Panel just runs on whichever
      # sources came back (needs ≥2 systems per team to fire).
      # ══ 2026-11-03 · THE PANEL AVERAGED A DAILY FEED WITH A WEEKLY ONE ══
      # Torvik and Haslam below run on 'full' || 'kenpom_only' (i.e. daily),
      # and this ran on 'kenpom_only' alone. Combined with the mode bug fixed
      # above -- 'kenpom_only' never fired at all -- the result was
      # ncaab_rating_snapshots holding haslam 29,931 rows across 82 dates
      # against kenpom 1,094 (last write 2026-08-24) and torvik 364 (one
      # write, 2026-08-14). The Panel model needs 2+ systems per team, so it
      # could not fire for any team on any date.
      #
      # Matched to the ratings refresh step above, which is daily in Nov/Dec
      # and weekly from January. A panel whose members are sampled on
      # different cadences is comparing a fresh rating to a six-day-old one
      # (feedback_a_pair_needs_same_measure_and_scale).
      - name: NCAAB — KenPom snapshot write
        if: steps.mode.outputs.mode == 'kenpom_only' || steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          KENPOM_KEY:   ${{ secrets.KENPOM_KEY }}
        run: |
          cd mlb_pipeline
          python ncaab_kenpom_snapshot.py

      - name: NCAAB — Torvik snapshot write
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'kenpom_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaab_torvik_pull.py

      - name: NCAAB — Haslam snapshot write
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'kenpom_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # Haslam XML uses brotli compression — needed by requests lib
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "pip install brotli" pip install --quiet brotli
          python ncaab_haslam_pull.py

      # ────── ALIAS ENRICHMENT (weekly on Monday, cheap idempotent) ──────
      # Also fires on manual workflow_dispatch so testing kenpom_only
      # mode runs the full weekly-Monday routine (2026-07-25 fix —
      # was gated on schedule only, making manual runs skip enrichment).
      - name: Refresh NCAAB alias enrichment (Mon + manual)
        if: (steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'kenpom_only') && (github.event.schedule == '23 15 * * 1' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaab_enrich_aliases.py" python ncaab_enrich_aliases.py

      # ────── ODDS PULL ──────
      - name: Pull Odds API NCAAB lines
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'odds_only' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaab_odds_pull.py" python ncaab_odds_pull.py

      # ────── GAME CONTEXT ──────
      - name: Build NCAAB game context
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaab_game_context.py" python ncaab_game_context.py

      # ══ 2026-10-21 · LAUNCH READINESS, BECAUSE THERE IS NO OTA ══
      #
      # The same defect has shipped three times, once per sport, and a user
      # found it every time: NHL 09-28 (ctx chain fell through to null), NBA
      # 10-20 (five ctx fields the select never asked for, two whole cards
      # dead), NCAAB 10-21 (chain still ended at NBA, so all four NCAAB cards
      # would have gone down on opening night). The data existed every time;
      # the client either never asked for the column or never resolved the
      # row, so each card took its own "no data" path. Nothing fails and
      # nothing logs — it just looks like a quiet sport.
      #
      # NCAAB cannot be verified against live data today: basketball_ncaab is
      # not in the Odds API's active sports list yet, so ncaab_game_context is
      # EMPTY and a manual run produces nothing. With no expo-updates (B5), a
      # wiring mistake discovered after 11-03 needs another App Store review.
      # So the check runs here and fails the moment a column the client reads
      # stops existing — including the first run after rows appear.
      #
      # NOT continue-on-error: a missing column is the one failure that
      # silently blanks a sport, which is exactly what should stop a run.
      - name: NCAAB — verify client-read columns exist
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python verify_sport_launch_ready.py --sport NCAAB

      # 2026-08-17: teamrankings season aggregates for NCAAB. NCAAB is the
      # only sport where PER-GAME odds backfill is blocked (0/5911 games
      # have close_spread) — season aggregates are the practical
      # tendency signal. 10 team_form_season signals seeded in
      # 20260817_ncaab_season_signals.sql.
      - name: Pull NCAAB season trends from teamrankings
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_teamrankings_trends.py --sport NCAAB

      - name: Enrich NCAAB game context with season trends
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_trends.py --sport NCAAB

      # 2026-08-18: universal team-form (venue-split L10 + H2H last 5)
      - name: Enrich team form — venue split + H2H
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NCAAB

      # 2026-08-23: Roster physicality enricher — populates
      # home/away_frontcourt_avg_ht + class_year_edge_home etc. on
      # ncaab_game_context so shadow signals can fire. Runs daily after
      # game_context so new games pick up whatever physicality data
      # exists (Mon scraper refreshes the source table weekly).
      - name: Enrich NCAAB ctx with roster physicality
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_ctx_roster_physicality.py --sport NCAAB --days-ahead 7

      # ────── PANEL MODEL (2026-08-14 Session 3 · lens #2 of 5 - MC is #1) ──────
      # Reads latest ncaab_rating_snapshots (KenPom + Torvik + Haslam) and
      # averages into panel_prediction JSONB. Requires ≥2 systems per team
      # to fire — coverage-limited by name-alias gap (S1 followup work).
      #
      # Off-season no-op: 0 games → early exit. Fires AFTER MC so both
      # blobs land on the same PATCH sequence.
      # 2026-08-23 season-ready: SO scraper + splits_v2 aggregator (mirrors
      # NCAAF pattern shipped tonight). Silent no-op during offseason
      # (no games in ctx → 0 correlations). Populates on Nov 3+.
      - name: ScoresAndOdds — scrape NCAAB splits
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_scoresandodds.py --sport NCAAB

      # 2026-09-07: no mode gate — parity with NCAAF fix. Aggregator is
      # a lightweight no-op if no source rows landed since last run.
      - name: Splits v2 aggregator (NCAAB)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python splits_v2_pipeline.py --sport NCAAB

      # == 2026-11-11 . THE SPLITS WERE SCRAPED AND NEVER ARCHIVED =========
      # The two steps above have been writing NCAAB splits onto
      # ncaab_game_context for months, and nothing ever appended the time
      # series, because write_line_snapshot.py's CTX_TABLE had no 'NCAAB'
      # key (its _ML_COLS map already did -- the hard half was wired and
      # the easy half was not) and no workflow ever invoked it for NCAAB.
      # line_snapshot therefore held
      #   MLB 16,882 . NCAAF 2,179 . NFL 1,191 . NBA 847 . NHL 732 . NCAAB 0
      # on the sport with the most games. Two things were broken by that:
      # every NCAAB fade signal is unweightable without history, and
      # align_status_common.load_public_splits_snapshot READS line_snapshot
      # at source='so', so NCAAB alignment was computed with no public
      # splits vote at all.
      #
      # Placed immediately after the aggregator and well before
      # generate_ncaab_game_reads.py, because a splits step that lands
      # after the reads loses the scorer its vote even when it succeeds
      # (feedback_an_always_end_heartbeat_hides_a_cancelled_run).
      - name: Archive NCAAB splits to line_snapshot
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python write_line_snapshot.py --sport NCAAB

      # 2026-08-23 season-ready: signal_registry calibration. Sport-universal
      # script — reads graded games from ncaab_game_results and refreshes
      # signal_registry hit_rates. Silent no-op until Nov 3 games grade.
      - name: Refresh NCAAB signal_registry from graded games
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport NCAAB --days 30

      # 2026-09-02: Split — per-source calibration for NCAAB. Silent
      # no-op until Nov 3 season start.
      - name: Refresh external source calibration (NCAAB)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_external_source_calibration.py --sport NCAAB

      - name: Refresh sharp-source calibration (NCAAB)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_sharp_source_calibration.py --sport NCAAB

      # 2026-09-02: Split — signal-pattern rolling hit rates (NCAAB).
      - name: Refresh signal pattern registry (NCAAB)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_signal_patterns.py --sport NCAAB

      - name: NCAAB — Panel model (KenPom + Torvik + Haslam average)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaab_panel_predictor.py

      # 2026-08-25: materialize the panel into ncaab_team_efficiency so
      # downstream consumers (lens framework, PPP/tempo comparisons) can
      # read a stable team-level table instead of re-deriving from every
      # snapshot. Offseason no-op — 0 games / 0 snapshots yields 0 rows.
      # 2026-09-01 FRESHNESS FIX: also gated on resolver_only so 7am ET
      # cron (after overnight games grade) refreshes efficiency panel +
      # team_stats_rolling ranks same-morning. Was full||card_only which
      # meant efficiency refresh missed the post-grading window.
      - name: NCAAB — Materialize panel to ncaab_team_efficiency
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # 2026-09-01 FIX: NCAAB season is 'YYYY-YY' format (e.g. '2024-25')
          # not just year. Prior `SEASON=$(date +%Y)` passed '2026' which
          # never matched ncaab_rating_snapshots.season → 0 rows written to
          # ncaab_team_efficiency for entire offseason. Compute proper format:
          # Jul-Dec = upcoming season (YYYY-{YY+1}); Jan-Jun = current (YYYY-{YY+1})
          MONTH=$(date +%m)
          YEAR=$(date +%Y)
          if [ "$MONTH" -ge 7 ]; then
            START=$YEAR
          else
            START=$((YEAR - 1))
          fi
          END=$(printf '%02d' $(( (START + 1) % 100 )))
          SEASON="${START}-${END}"
          echo "NCAAB season → $SEASON"
          # Also backfill prior season for historical rankings + rollup coverage
          PRIOR_START=$((START - 1))
          PRIOR_END=$(printf '%02d' $(( (PRIOR_START + 1) % 100 )))
          PRIOR_SEASON="${PRIOR_START}-${PRIOR_END}"
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "ncaab_efficiency_model.py" python ncaab_efficiency_model.py --season "$SEASON"
          python ncaab_efficiency_model.py --season "$PRIOR_SEASON"

      # 2026-09-01: refresh cross-sport rollup matviews after NCAAB
      # resolver/efficiency updates land. Universal matviews — each call
      # refreshes NCAAB rows within them alongside all other sports.
      # See project_rolling_rollup_architecture_901 + migrations 20260901d/e/f.
      - name: Refresh team_recent_games matview
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_recent_games" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Refresh team_situational_records matview
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          # 2026-09-22: was `curl -s ... -d '{}'` with the response
          # discarded. This RPC has returned 42809 since the 09-16
          # matview rename and no one heard for six days, because a
          # 400 and a 204 looked identical from here.
          code=$(curl -s -o /tmp/rpc_out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_team_situational_records" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::refresh_team_situational_records failed ($code): $(cat /tmp/rpc_out.json)"
            exit 1
          fi
      - name: Refresh team_stats_rolling matview
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          # 2026-09-22: was `curl -s ... -d '{}'` with the response
          # discarded. This RPC has returned 42809 since the 09-16
          # matview rename and no one heard for six days, because a
          # 400 and a 204 looked identical from here.
          code=$(curl -s -o /tmp/rpc_out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_team_stats_rolling" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::refresh_team_stats_rolling failed ($code): $(cat /tmp/rpc_out.json)"
            exit 1
          fi

      # ────── MC SIMULATOR (2026-08-14 Session 2 · lens #1 of 5) ──────
      # Reads latest KenPom snapshot from ncaab_team_stats + today's games,
      # runs 10k possession-based sims per game, writes mc_probabilities
      # blob to ncaab_game_context. Anti-consensus rule + MC HIGH-CONF
      # chip both read this field.
      #
      # Off-season no-op: ncaab_game_context is empty → 0 games → early exit.
      - name: NCAAB — Monte Carlo simulator
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaab_mc_simulator.py

      # ────── JERRY GAME READS ──────
      - name: Generate NCAAB game reads (Jerry)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "generate_ncaab_game_reads.py" python generate_ncaab_game_reads.py

      # ────── 4-LENS RESOLVER (2026-08-14 Session 4) ──────
      # Runs LAST in card-build sequence (after MC + Panel + Jerry).
      # Reads all 4 lens signals, recomputes sweat_score/tier/primary_play
      # with lens-agreement logic + confidence caps. PATCHes game_context.
      #
      # 4 lenses today: KenPom-in-context + MC + Panel + Jerry.
      # V4 XGBoost slot reserved for Feb 2027 (project_ncaab_v4_deferred_814).
      - name: NCAAB — 4-lens primary_play resolver
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaab_resolve_primary_play.py

      # ══ 2026-11-06 · THE SYNC USED TO RUN BEFORE THE RESOLVER ════════
      # This step was at line 599, ABOVE the 4-lens resolver that writes the
      # primary_play it syncs, so it always carried the PREVIOUS run's pick.
      # That is why jerry_reads lagged the card: on 11-06 the reads held the
      # pre-fix call on 26 of 32 unstarted games, 11 still naming `ml` on a
      # market capped to COVERAGE that afternoon.
      #
      # It cannot simply be fixed by moving the RESOLVER earlier instead: the
      # resolver consumes the Jerry read as lens #4 (_load_jerry reads
      # ncaab_jerry_reads.recommended_pick), so generator -> resolver is
      # deliberate and the dependency is circular. The sync is what closes
      # the loop, so the sync is what has to run last.
      #
      # Order is now: generate reads -> 4-lens resolver -> sync reads back.
      #
      # NOTE this alone does not make the sync WRITE: its guard still skips
      # any read whose long_read is >= 300 real characters, which is all of
      # them, so it protects the prose by refusing to update the pick (R189).
      # Ordering had to be right first; without it, fixing the guard would
      # just have propagated a stale pick faster.
      - name: Sync NCAAB jerry_reads from ctx
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sync_jerry_reads_from_ctx.py --sport NCAAB --window 5

      # ══ 2026-11-06 · NCAAB WAS NEVER PRICED, ON ANY DATE ══════════════
      # price_picks runs per sport in the NBA, NCAAF, NFL and NHL pipelines
      # and was missing here, so `jerry_reads.price_american` was null on
      # 0 of 126 NCAAB reads across 11-05/06/07. Two causes, both fixed
      # today: this step did not exist, and price_one could not have
      # matched anyway because jerry_reads.game_id is the Odds-API hex
      # while line_history.game_id is the ncaab_YYYYMMDD_Away_Home slug
      # (see price_picks.ncaab_key). An unpriced read cannot produce a
      # priced receipt, cannot be graded for ROI or CLV, and cannot
      # qualify for the Dawg, which selects on price.
      #
      # Runs AFTER the 4-lens resolver so it prices the FINAL call_*,
      # not a pick the resolver is about to move.
      #
      # Non-fatal: a pricing miss must not fail the slate.
      # 2026-11-07: refresh the home/road tendencies matview after the
      # results resolver, same as NFL/NCAAF/NBA have since 20260826b. The
      # NCAAB view itself ships in
      # 20261107a_ncaab_nhl_home_road_tendencies.sql -- until 11-07 neither
      # the view nor this call existed, so the Trends & Tendencies panel
      # could not render on a NCAAB card at all (Andy, on Purdue: "no
      # sitaional records"). Offseason no-op.
      - name: Refresh NCAAB home/road tendencies view
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_home_road_tendencies"             -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"             -H "Content-Type: application/json"             -d '{"p_sport": "NCAAB"}'

      - name: Price NCAAB jerry_reads
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "price_picks.py --sport NCAAB" python price_picks.py --sport NCAAB --write || true

      # ────── EXTERNAL PICKS AGGREGATION ──────
      - name: External source aggregation pull
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # 4pm cron = --refresh (subset for late-day updates)
          if [ "${{ github.event.schedule }}" = "23 20 * * *" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "pull_externals_ncaab.py" python pull_externals_ncaab.py --refresh
          else
            bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "pull_externals_ncaab.py" python pull_externals_ncaab.py
          fi

      # 2026-09-25: report dark sources. NCAAB carries 3 stub fetchers (covers,
      # vsin, bettingpros) that will log status='success' with zero picks the
      # moment the season opens. Wired now so 11-03 launch does not repeat what
      # NFL just went through — offseason it simply prints "nothing to check".
      - name: Externals watchdog (NCAAB)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python watchdog_external_sources.py --sport NCAAB --days 21

      # ────── CONSENSUS FADE DETECTOR ──────
      - name: Detect consensus-fade alerts (NCAAB)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python detect_consensus_fade.py --sport NCAAB

      # ────── RESOLVE COMPLETED GAMES (ESPN) ──────
      - name: Resolve completed games + refresh outcomes
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "resolve_ncaab_results.py" python resolve_ncaab_results.py --days-back 2

      # ══ 2026-11-10 · OUR OWN NUMBER WAS ON NONE OF 11,949 RESULT ROWS ══
      # ncaab_game_results carried home_score on 99.3%, close_spread on
      # 44.5% and spread_result on 43.9% -- and projected_spread,
      # projected_total, adj_em_gap, the four adj_oe/adj_de columns and
      # pace_avg on **0.0%**. The market and the outcome were both stored
      # and the engine's own projection never was, so NCAAB's selection was
      # unmeasurable by construction.
      #
      # That is not cosmetic: it is the named prerequisite for the
      # COVERAGE cap on every NCAAB favourite ML ever lifting.
      # ncaab_game_context.py, above NCAAB_ML_TIER_CAP: "Raise it only when
      # NCAAB ML has a graded record of OUR picks that clears breakeven --
      # which first requires persisting projected_spread into
      # ncaab_game_results so the question can be asked at all."
      #
      # Nothing ever did it because the two tables use DISJOINT game_id
      # namespaces (ctx = hex hash, results = ncaab_YYYYMMDD_Away_Home), so
      # a plain join matched 0 of 320 rows and read as "no data". The script
      # bridges on (game_date, away_team, home_team) -- the key
      # grade_public_receipts already uses for this table, per
      # ncaab_result_ids.py -- and skips rather than guesses on a miss.
      #
      # Runs AFTER the resolver so the row it stamps exists. --days 3 covers
      # the resolver's own --days-back 2 plus today. Never overwrites a
      # non-null column and reads back every field it sets, so it is safe to
      # run on every cron.
      - name: Stamp NCAAB model projection onto results
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "stamp_ncaab_model_columns.py"             python stamp_ncaab_model_columns.py --days 3 --apply

      # 2026-09-08 wired: grade NCAAB jerry_reads after resolver so
      # NCAAB doesn't wait on the MLB nightly for grading. Parallels
      # NBA/NHL wiring. NCAAB in RESULTS_TABLE already. Season starts
      # Nov 3. See project_cross_sport_grading_audit_908.
      - name: Grade NCAAB jerry_reads
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_jerry_reads.py --sport NCAAB

      # ────── RESOLVE EXTERNAL PICKS ──────
      - name: Resolve NCAAB external picks (post-game)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python resolve_externals.py --sport NCAAB --days 14

      # ────── ON-DEMAND: BACKFILL ──────
      - name: Backfill historical NCAAB season
        if: steps.mode.outputs.mode == 'backfill' && github.event.inputs.backfill_season != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ncaab_backfill_results.py --season "${{ github.event.inputs.backfill_season }}" --batch-size 300

      # 2026-09-08 heartbeat END.
      # ══ 2026-11-07 · NCAAB RECORDED ZERO SIGNAL ATTRIBUTION, EVER ══
      # The 10-28 pass that fixed "NOTHING WAS WRITING NBA'S / NHL'S
      # ATTRIBUTION ROWS" added these two steps to nba_pipeline and
      # nhl_pipeline and missed NCAAB and UFC entirely - neither file
      # contained the word "attribution" at all. Same omission shape as the
      # NCAAB pricing step (project_ncaab_never_priced_1106), in the same
      # file.
      #
      # Two faults had to be fixed for this to be worth scheduling, because
      # a schedule on a broken reader is a no-op:
      #   1. _fetch_games named home_off_rating / away_off_rating, which do
      #      NOT exist on ncaab_game_context, so the select 400'd and
      #      returned [] - "NCAAB: 0 games in ctx" on an 83-game night.
      #      NCAAB now aliases KenPom adj_oe, measured 296/335 filled.
      #   2. that fetch turned any HTTP failure into an empty list, so the
      #      400 was indistinguishable from a quiet slate. It now names the
      #      column and says WIRING ERROR.
      # After both: 0 games -> 48 games, 0 signal rows -> 35.
      #
      # Why it matters beyond tidiness: NCAAB carries 65 signals in
      # signal_registry with 0 VALIDATED and 95.2% of its weighted signals
      # under n=30, because there was never an attribution row to measure
      # them FROM. This is the step that makes NCAAB tunable at all.
      # ══ 2026-11-08 · THE RANK STAMPER WAS IN FOUR PIPELINES, NOT FIVE
      # stamp_conviction_rank.py runs in nba_, nhl_, nfl_ and ncaaf_pipeline
      # and was never added to NCAAB. Consequence measured today: 0 of 157
      # NCAAB primary_play rows carry _conviction_rank OR
      # _conv_inputs.margin, so NCAAB could not be ranked on its own
      # distribution and its margin span had to be derived from NHL's ratio
      # rather than measured. Runs before the attribution snapshot so the
      # rank is on the row when the signals are recorded.
      - name: Stamp NCAAB conviction_rank
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python stamp_conviction_rank.py --sport NCAAB --days 4

      - name: Snapshot NCAAB signal attribution
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python signal_attribution_snapshot.py --sport NCAAB

      - name: Grade NCAAB signal attribution
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python signal_attribution_grade.py --sport NCAAB --days 7

      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"ncaab_pipeline\",\"event\":\"end\",\"sport\":\"NCAAB\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping end
        if: always()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NCAAB_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "$HC_URL" || true
          fi

      # 2026-09-24 B18 — turn a green-but-broken run red.
      #
      # Every masked step above used to end in `|| echo "... non-fatal"`,
      # which makes the shell succeed, so the step succeeds, so the job
      # succeeds. A grader could fail nightly and the run still showed a
      # green check. That is the mechanism behind "no games resolved
      # yesterday" and "no prime props today".
      #
      # The masks were not simply deleted: one flaky optional scraper would
      # then abort the graders and writers that run after it. Continuing is
      # correct. Continuing silently and claiming success is the bug.
      # run_step.sh records each failure and still returns 0; this gate
      # fails the run at the end with the list.
      - name: Fail the run if any step failed
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --gate
