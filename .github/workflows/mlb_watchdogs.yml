name: MLB Watchdogs

# 2026-08-20: silent-failure alerting. Runs every 2 hours during
# active game hours (12pm-11pm ET), writes tripped alerts to
# watchdog_alerts table. Every check here catches a real leak the
# user has personally been the alerting layer for.
#
# Exit codes: 0 = clean, 1 = warning/info, 2 = critical
# GitHub Actions surfaces exit != 0 as a red X — see the run tab.

on:
  schedule:
    # Every 2 hours 12pm-10pm ET = 16, 18, 20, 22, 00, 02 UTC
    - cron: '0 16,18,20,22 * * *'
    - cron: '0 0,2 * * *'
  workflow_dispatch:

jobs:
  watchdogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      # ═══ 2026-11-03 · MLB OFFSEASON GATE ═══════════════════════════════
      # ~74 of the 231.9 scheduled runs a day were MLB-only, on a season
      # whose last game was 2026-10-28. That congestion is the measured
      # cause of every other sport's pipeline landing 7-10h late, which is
      # why the Sweat Card composes on yesterday's non-MLB data
      # (project_card_builds_before_every_other_sport_1102).
      #
      # A STEP, not a separate job: a gate job costs a second runner
      # acquisition on every in-season run, and runner acquisition is the
      # scarce thing here. This workflow is 6 runs/day.
      #
      # sport_gate.py fails OPEN on any error and workflow_dispatch always
      # runs, so neither a gate bug nor a manual rerun can leave MLB dark.
      - name: Offseason gate
        id: sport_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sport_gate.py --sport MLB --require-games

      - name: Run watchdogs
        if: steps.sport_gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python watchdogs.py
