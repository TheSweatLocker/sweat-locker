name: UFC Pipeline Weekly

# UFC cadence: fight cards Saturday nights.
#   Wed 6pm ET  — scrape card + score model + pull odds + compute EV
#   Fri 10am ET — refresh odds (line-move settle) + rebuild card
#   Sun 10am ET — resolve completed card (grade all fights)
#
# Times are 30-60 min earlier than user-facing "ready by" to absorb
# GitHub Actions queue drift (same pattern as MLB + NFL).

on:
  schedule:
    - cron: '0 22 * * 3'   # Wed 6pm ET  — primary pull (score + odds + EV)
    - cron: '0 14 * * 5'   # Fri 10am ET — line-move refresh + weekly card
    - cron: '0 14 * * 6'   # Sat 10am ET — early grader (catches Fri-night prelim card + Contender Series)
    - cron: '0 14 * * 0'   # Sun 10am ET — resolver (grade main Saturday card)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which sub-pipeline to run manually'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - odds_only
          - card_only
          - resolver_only

jobs:
  ufc-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv beautifulsoup4 pandas scikit-learn numpy xgboost

      - name: Detect run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H); DOW=$(date -u +%u)
            # Sun 14:00 UTC → resolver_only; Fri 14:00 UTC → card refresh only;
            # Wed 22:00 UTC → full (fresh pull).
            if [ "$DOW" = "7" ] && [ "$HOUR" = "14" ]; then echo "mode=resolver_only" >> $GITHUB_OUTPUT
            elif [ "$DOW" = "6" ] && [ "$HOUR" = "14" ]; then echo "mode=resolver_only" >> $GITHUB_OUTPUT  # Sat early grader
            elif [ "$DOW" = "5" ] && [ "$HOUR" = "14" ]; then echo "mode=card_only" >> $GITHUB_OUTPUT
            else echo "mode=full" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Scrape upcoming UFC card (ESPN)
        if: steps.mode.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_card_scraper_v3.py || echo "card scraper failed (non-fatal)"

      - name: Refit isotonic calibrator from latest graded fights
        if: steps.mode.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_calibration_fit.py --days 365 || echo "calibrator refit failed (score card falls back to raw)"

      - name: Score card with 4-model ensemble
        if: steps.mode.outputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_score_card.py || echo "score card failed"

      - name: Pull market odds (Odds API h2h)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'odds_only' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_odds_pull.py || echo "odds pull failed"

      - name: Compute EV tiers
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'odds_only' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          # 2026-08-21: SHARP-FADE experiment disabled. Real fix (isotonic
          # calibrator v1) shipped this date + refit before every score run.
          # See project_ufc_model_broken_817 memo. Leave flag here so it can
          # be flipped back on quickly if calibrator behaves badly.
          UFC_SHARP_FADE_MODE: 'false'
        run: |
          cd mlb_pipeline
          python ufc_compute_ev.py || echo "EV compute failed"

      - name: Build weekly card payload
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_weekly_card.py --format markdown || echo "weekly card failed"

      - name: Pull external UFC picks (handicappers + BFO market)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_ufc.py || echo "externals pull failed (non-fatal)"

      - name: Resolve completed fights (grade Saturday card)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'resolver_only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_resolve_fights.py || echo "resolver failed"

      # 2026-08-08 ESPN fighter enrichment.
      # ufcstats.com scraper broken (JS anti-scraper), left 940/1000 rows
      # with corrupted finish-method columns. ESPN core API has clean data.
      # Runs BEFORE Jerry synthesis so struct has correct records + physicals.
      # --today mode only touches fighters on this card (cheap ~30s).
      - name: Enrich today's UFC fighters from ESPN
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_espn_enrich.py --today || echo "UFC ESPN enrich failed (non-fatal — synth falls back to prior stats)"

      # Per-fight Jerry synthesis (2026-08-01). Runs AFTER card is scored +
      # odds pulled + EV computed so Jerry sees the full model output. Writes
      # SHORT + LONG + verdict to jerry_reads (sport=UFC). Users now get
      # analytical voice alongside raw probs (Rakic 74%, Stirling 78%, etc).
      # 2026-08-08: prompt now enforces "cite only what's in struct" hard-guard
      # + fighter_stats block from ESPN enrichment above.
      - name: Generate UFC per-fight Jerry synthesis
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'card_only'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_ufc_fight_synthesis.py || echo "UFC Jerry synth failed (non-fatal)"

      # UFC picks grader (2026-08-09). Runs after ESPN results are available.
      # Backfills winner_actual / method_actual / pick_result onto ufc_picks
      # so track record + audit trail work for UFC. Idempotent: only touches
      # ungraded picks (graded_at IS NULL). Never blocks pipeline.
      - name: UFC grader (backfill results)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python ufc_grader.py --backfill-all || echo "UFC grader failed (non-fatal)"

      # 2026-08-09: UFC jerry_reads grader (separate table from ufc_picks).
      # jerry_reads holds the per-fight synthesis output with call_side A/B
      # and needs its own result column populated for the Receipts tab +
      # public track record to display Jerry's UFC record. 60d backfill
      # every run so late-resolved fights get picked up.
      - name: UFC jerry_reads grader
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python grade_ufc_jerry_reads.py --backfill-days 60 || echo "UFC jerry grader failed (non-fatal)"
