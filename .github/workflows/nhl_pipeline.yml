name: NHL Pipeline Daily

on:
  schedule:
    # 2026-08-28 Phase 4 kill #9: dropped from 2x/day to 1x/day pre-season.
    # All steps are silent no-ops until Oct 7 season opener. Restore
    # 20 UTC (post-market) cron once preseason starts ~late Sept.
    - cron: '5 12 * * *'  # 8:05am EDT (12:05 UTC) — staggered from 12:00 pile-up (2026-09-08)
    # ══ 2026-09-28 · SECOND RUN FOR MONEY FLOW ══
    # Andy: "When will moneyflow be present?" One run a day could only ever
    # answer that badly. Money flow is a TIME SERIES — it accumulates through
    # the day and the informative part arrives near puck drop — and NHL had a
    # single 08:05 cron against MLB's four and NFL's ten.
    #
    # Worse, that cron does not fire at 08:05. Measured from workflow_heartbeat
    # across 11 runs: median +4.7h late, so it actually lands ~12:45pm ET.
    # Tomorrow's slate starts at 17:00 ET and runs to 22:30, so the only
    # snapshot would be taken 4 hours before the first game and 10 before the
    # last — early money only, which is the half that says least.
    #
    # 15:20 UTC is chosen FROM that measured lateness, not from the nominal
    # time: 11:20am ET scheduled + ~4.7h ≈ 4pm ET actual, an hour before the
    # earliest puck drop and close enough to the rest to catch real movement.
    # Revisit if the lateness distribution shifts — watchdog_workflow_heartbeat
    # measures each slot against its own p90 for exactly this reason.
    #
    # Safe to run twice: the NHL publish lock preserves already-published
    # picks (verified — "preserved 8 published pick(s)"), so the second pass
    # refreshes lines, splits and goalies without moving a pick that shipped.
    - cron: '20 15 * * *'  # ~4pm ET actual — pre-puck-drop splits refresh
  workflow_dispatch:
    inputs:
      date:
        description: 'Target game_date (YYYY-MM-DD, default: today ET)'
        required: false

jobs:
  nhl-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          # 2026-09-25: added beautifulsoup4 + playwright. The externals
          # pullers need both and neither was here — the same omission that
          # kept dimers and action at 0 picks on NFL/NCAAF until 09-25,
          # because _playwright_helper.render_page returns (None,
          # 'unavailable') and each source then reports success with no data.
          # NHL externals have never produced a single pick, so this has to
          # be right BEFORE the Oct 8 opener rather than discovered after it.
          pip install requests python-dotenv beautifulsoup4 playwright
          python -m playwright install --with-deps chromium || echo "⚠ chromium install failed — JS-rendered externals will skip this run"

      # 2026-09-08 heartbeat START (parity w/ mlb_pipeline).
      - name: Heartbeat — start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"nhl_pipeline\",\"event\":\"start\",\"sport\":\"NHL\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping start
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NHL_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "${HC_URL}/start" || true
          fi

      # ─── Yesterday's results (resolve completed games) ───────────
      # 2026-09-21: ODDS PULL — creates the FORWARD SCHEDULE. Must run
      # BEFORE nhl_game_context, which has nothing to build from without
      # it. Before this existed nhl_game_results carried 0 forward games
      # (NFL had 241, NCAAF 104), so every downstream step — context,
      # game card, props, externals — had an empty slate and reported
      # "no games" rather than an error. Adopts the league's canonical
      # game id so results and context join.
      - name: Pull NHL forward schedule + lines (Odds API)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nhl_odds_pull.py

      - name: Resolve yesterday's NHL results
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nhl_resolve_results.py

      # ══ 2026-10-02 · NHL PROPS WERE NEVER GRADED ══
      # nhl_generate_props (step below) had written 7,587 rows since 09-29 and
      # every one sat at result=NULL, because grade_props.SPORT_PROPS_TABLE had
      # no NHL entry AND no step here ever called it. With no grades there are
      # no hit rates, no tier calibration and no surface_records rows for NHL
      # props — so no patterns could form. The props were infrastructure, not
      # product.
      #
      # Runs AFTER the results resolver (needs final scores to know which games
      # count) and BEFORE the jerry grader, which inherits from the prop row.
      #
      # Grades yesterday by default. Stats come from api-web.nhle.com per
      # player; a resolved player with no game-log row that date is Voided as a
      # DNP rather than graded against an implicit zero.
      - name: Grade NHL props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_props.py --sport NHL

      # 2026-09-08 wired: grade NHL jerry_reads immediately after resolver.
      # Prior gap: NHL not in grade_jerry_reads RESULTS_TABLE map, so
      # jerry_reads for NHL games never got a result. Season starts Oct 8;
      # this wiring is required for launch. See project_cross_sport_grading_audit_908
      # + project_nhl_resolver_build_908.
      - name: Grade NHL jerry_reads
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_jerry_reads.py --sport NHL

      # ══ 2026-10-28 · THE PLAYBOOK LEDGER WAS MLB-ONLY ══
      # prop_playbook_decisions held 12,891 NHL rows and 0 graded ones,
      # because grade_prop_playbook.SPORT_PROPS_TABLE was {'MLB': ...}.
      # NHL props themselves grade fine (69,074 of 71,470) — it was only
      # the decision ledger, which is the table the weekly signal
      # attribution reads, that had no grade to read.
      #
      # Pass 1 inherits from nhl_pipeline_props and is keyed on the base
      # stat plus `direction`, not prop_type: R4 in prop_ensemble_scorer
      # flips `direction` on a cold prop and leaves prop_type as the market
      # the book listed, so 45.6% of NHL decisions store a pair the props
      # table never holds. Keyed on prop_type, 147 of 502 rows on a single
      # date went unresolved; keyed on the stat, 7 do.
      - name: Grade NHL prop playbook decisions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_prop_playbook.py --sport NHL --backfill 3

      # ══ 2026-10-28 · ATTRIBUTION RAN FOR 3 OF 6 SPORTS ══
      # ══ 2026-10-28 · NOTHING WAS WRITING NHL'S ATTRIBUTION ROWS ══
      # The grade step below had nothing to grade: signal_attribution_snapshot
      # ran for MLB, NCAAF and NFL only, so NHL had 74 rows against NCAAF's
      # 3,101. Without snapshots there is no attribution, without attribution
      # refit_signal_registry can never compute a NHL weight, and every NHL
      # game signal stays UNVALIDATED at the 0.3 prior forever -- which is
      # exactly what the registry shows today: not ONE NHL game signal has
      # sample_n > 0. The four NHL signals carrying real weight (1.0) are all
      # PROP signals, which cannot fire on a game pick at all.
      #
      # This is the loop Andy asked for on 10-27: every signal recorded per
      # pick, graded, and the weights refit per sport week to week. The
      # snapshot is the first link and it was missing for two sports.
      - name: Snapshot NHL signal attribution
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python signal_attribution_snapshot.py --sport NHL

      - name: Grade NHL signal attribution
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python signal_attribution_grade.py --sport NHL --days 7

      # == 2026-10-28 . CLOSE THE LOOP: REFIT NHL'S OWN WEIGHTS ========
      # The snapshot and grade steps above were added today, so attribution
      # finally accumulates for NHL. But refit_signal_registry -- the step
      # that turns graded attribution into weights -- is scheduled ONLY from
      # mlb_pipeline.yml and mlb_refit_weekly.yml. MLB is in the World
      # Series; when it stops running, NHL's weights would never refit
      # again, and every NHL game signal would sit on the unmeasured
      # prior forever. That is the loop Andy asked for on 10-27 -- "every
      # signal recorded per pick and attributed WEEKLY so weighting can be
      # tuned per sport" -- and its last link was owned by another sport.
      #
      # Each sport now refits its own. min-n 10 matches the floor raised on
      # 10-27 (99 weighted signals -> 163).
      #
      # As of tonight NHL has 0 of 38 enabled GAME signals with a
      # measured hit rate, so the first runs will mostly write
      # UNVALIDATED/ANTI_VALIDATED -- which is the honest state and is what
      # makes the direction-only control (fixed 10-28) start to bite as
      # volume arrives rather than after the bias is entrenched.
      - name: Refit NHL signal weights from graded attribution
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python refit_signal_registry.py --sport NHL --days 90 --min-n 10

      # 2026-10-08: the in-calibration banner users read on the NHL tab had
      # "our graded sample is 21 games" typed into it. It was written once by
      # hand from a gitignored scratch script (_nhl_calibration_note.py), so
      # it froze: the real graded sample was 55 (28-27) by 10-08. Runs right
      # after the graders so the number it quotes is the one just written,
      # and refuses to touch hand-authored copy or to invent a banner where
      # none exists. See refresh_calibration_notice.py docstring.
      - name: Refresh NHL calibration banner
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python refresh_calibration_notice.py --sport NHL --apply

      # 2026-09-27: team ratings for all 32 clubs from MoneyPuck. Before
      # this, NHL carried advanced stats for FOUR teams — the context
      # builder wrote rows only for teams that had a game that night and
      # ranked them against each other, so a club could read "1st of 4".
      # MoneyPuck publishes the new season only once games are played, so
      # the puller holds on last season's final ratings until roughly a
      # week of games exists and then switches on its own. Must run BEFORE
      # the context build, which reads these for projections.
      - name: Pull NHL team ratings (MoneyPuck)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "nhl_team_stats_pull.py" \
            python nhl_team_stats_pull.py

      # ─── Today's game context (schedule + odds + rest) ───────────
      - name: Build NHL game context
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nhl_game_context.py --days 7

      # 2026-09-21: NHL externals. There was no nhl external puller at
      # all until today, even though the shared oddscrowd /
      # scoresandodds / pickdawgz modules were already parameterised for
      # it. oddscrowd is the MONEY FLOW source (money% / bets% /
      # divergence). Resolve runs straight after the pull so NHL never
      # repeats the NFL situation, where externals were collected every
      # week and never graded — 451 of 460 picks sat ungraded since
      # launch because no workflow called resolve_externals.
      - name: Pull + resolve NHL external picks
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_nhl.py --triggered-by cron

      # 2026-09-25 EXTERNALS WATCHDOG — parity with MLB/NFL/NCAAF.
      #
      # Every NHL source currently returns 0 picks and reports "✓ success":
      #   ✓ oddscrowd: 0 picks / 0 games
      #   ✓ scoresandodds: 0 picks / 0 games
      #   ✓ pickdawgz: 0 picks / 0 games
      #   === Summary === sources ok/fail: 3/0 · picks: 0
      #
      # That is CORRECT today — verified 09-25 that pickdawgz /nhl-picks
      # carries no article newer than the June playoffs, so there is nothing
      # to scrape in the offseason. The parse path itself is proven: article
      # discovery for 2026-06-11 returns exactly the Vegas @ Carolina preview
      # matching that game in nhl_game_results.
      #
      # The danger is that a genuinely BROKEN source on Oct 9 produces output
      # identical to a healthy offseason one. Reporting-only, so it can never
      # fail the run — it just makes the difference visible.
      - name: Externals watchdog (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python watchdog_external_sources.py --sport NHL --days 21
          python resolve_externals.py --sport NHL --days 14

      # 2026-08-18: universal team-form (venue-split L10 + H2H last 5)
      - name: Enrich team form — venue split + H2H
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NHL

      # ─── Backfill L5 team tendencies onto today's rows ───────────
      # Populates ATS / O/U / ML tendency fields so team_form signals
      # in signal_sources can fire. Runs AFTER game_context.py (rows
      # must exist to patch) and BEFORE any downstream scorer.
      # Non-fatal — signals just evaluate to None if backfill fails.
      - name: Backfill NHL team tendencies
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_nhl_team_tendencies.py

      # ─── NHL game reads (2026-09-24) ───────────────────────────────
      # Until now this workflow had NO read generator. Odds, results,
      # context, externals, tendencies and props all ran; nothing wrote
      # prose. sync_jerry_reads_from_ctx then backfilled
      # primary_play.sub as the visible short_read, so all 37 NHL cards
      # read like "Model conviction on Canucks · 64%" — 33 characters,
      # empty long_read, behind a real moneyline at conviction 64.
      #
      # Deliberately NOT wrapped in `|| echo`. A read generator that
      # fails silently is what left the NFL slate as engine stubs earlier
      # today: the failure printed one line, the week-lock froze the
      # empty slate, and the sync bridge filled it with jargon. If this
      # breaks, the step should go red.
      #
      # Runs BEFORE props so a failure here is visible on its own rather
      # than buried among prop warnings.
      - name: Generate NHL game reads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_nhl_game_reads.py
          # == 2026-10-29 . THE WRITE-UP MUST AGREE WITH THE PICK ========
          # Andy: "i want the write ups correct across all sports now and
          # going forward". On 10-29 a refit flipped 16 NCAAF badges, the
          # read generator then failed rc=1 on an expired Anthropic key,
          # and the board showed 'Washington +7.5' above prose projecting
          # "Nebraska 28.2, Washington 22.7". Nothing compared the two,
          # because the engine, the badge and the prose are written by
          # three different steps.
          # Runs IMMEDIATELY after generation so the check sees what was
          # just written. Blocks only on a write-up that declines its own
          # pick or projects the other team; everything else warns.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "audit_read_pick_consistency.py (NHL)" python audit_read_pick_consistency.py --sport NHL --days 14
          # == 2026-10-28 . PRICE THE PICK THAT WAS JUST WRITTEN ==========
          # nightly_cross_sport.sh has carried this note since 10-02:
          # "this is the daily floor, not the ideal ... the right place is
          # also immediately after each sport's read generation ... Wiring
          # that per-pipeline is queued." It stayed queued, and tonight it
          # cost us in public: 6 of 7 NBA spread picks carried a price that
          # was not a spread price --
          #     San Antonio Spurs -13.5  shown at -650 (the away MONEYLINE)
          #     Houston Rockets   -8.5   shown at -340 (ditto)
          # Every read was priced at 18:37 and REGENERATED at 22:28, and
          # nothing priced them again. Breakeven at -650 is 86.7 percent,
          # so the juice gates and every ROI figure were computed off a
          # number no book posts.
          #
          # price_picks.py already handles this correctly -- it re-prices
          # any game that has NOT started and freezes the price once it has,
          # so a repeat run cannot rewrite the record of what we published.
          # It just never ran after the pick moved. The clearing guard in
          # sync_jerry_reads_from_ctx.py does not help here: it skips every
          # read a real synthesis generator wrote, which is all of them
          # (feedback_guard_belongs_at_the_chokepoint).
          #
          # Non-fatal: a pricing miss must not fail the slate.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "price_picks.py --sport NHL (re-price the moved pick)"             python price_picks.py --sport NHL --write || true

          # ══ 2026-10-23 · THE BADGE AND GAME DETAIL CONTRADICTED ══
          # ANDY: "timberwolves pregame bage not amtchign game detail priamry
          # play". Minnesota @ Orlando carried primary_play 'Orlando Magic ML'
          # (HOME) against jerry_reads call_side AWAY -- same market, OPPOSITE
          # sides, one screen saying Minnesota and the other Orlando.
          #
          # jerry_pick_scrub exists for exactly this: Jerry's LLM writes
          # call_side at generation time, primary_play is later recomputed (MC
          # refresh, close-line update, defensive gate flip), and the two
          # diverge. It was scheduled in the MLB, NCAAF and NFL pipelines and
          # in NEITHER NBA nor NHL, so those two sports drifted with nothing
          # to reconcile them. Measured today before adding this: 5 of 12 NBA
          # games disagreed (1 opposite-side, 3 different-market, 1 line) and
          # 1 of 2 NHL.
          #
          # Note this is a sub-class the unscheduled-writer audit cannot see:
          # the script IS referenced by workflows, just not by every sport's.
          python jerry_pick_scrub.py --sport NHL

      # ─── NHL prop pipeline (2026-08-17) ────────────────────────────
      # Sweeps Odds API for goalie + skater props, upserts stubs into
      # nhl_pipeline_props. Playbook scorer (shared with MLB/NFL) runs
      # against them for shadow-mode scoring.
      - name: Generate NHL player props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nhl_generate_props.py

      # ══ 2026-10-21 · COLLAPSE SUPERSEDED PROP ROWS ══
      #
      # MUST run after the generator and BEFORE backfill_prop_lookback. Same
      # defect and same reasoning as the NBA workflow's copy of this step.
      #
      # nhl_generate_props upserts with prop_line inside the conflict key, so
      # a line move between runs INSERTS rather than updates, and the order
      # here is generate -> backfill -> score. The backfill therefore enriched
      # rows that the next generator pass orphaned: L5/L10 was fed on 0 of 420
      # props, while running the backfill by hand fed 418 of 420 immediately.
      # nhl_pipeline_props is the largest table in the system at 62,007 rows
      # and this is why.
      #
      # Deletes ONLY rows with result IS NULL and tier COVERAGE. 56,569 of
      # those 62,007 rows carry a result -- graded history feeding the records
      # surfaces -- and records are not rewritten to tidy up a key.
      - name: Collapse superseded NHL prop rows
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_slot_reconcile.py --sport NHL --apply

      # 2026-10-03 · PROP IDENTITY. Prerequisite 1 of the scoring layer.
      # nhl_generate_props above is a faithful mirror of the book and writes
      # no identity, so team_abbrev / opp_abbrev / player_position sat NULL
      # on all 13,174 rows and there was no player_id at all. The matchup
      # layer the Prop Jerry vision needs lives in nhl_player_vs_team
      # (24,450 rows, 1,094 players) keyed on player_id -- and 0 of 497 prop
      # players on the 10-03 board joined to it.
      #
      # Resolves via nhl_player_log.resolve_player: one roster call per club,
      # cached, exact-match then UNIQUE-surname only, and it refuses to pick
      # between two players sharing a name (Vancouver has two Elias
      # Petterssons) unless the book's birth-year hint settles it. An
      # unresolved player is left NULL and counted, never guessed.
      #
      # Runs AFTER generation (needs the rows) and BEFORE the lookback and
      # the scorer, so anything downstream can rely on identity being set.
      - name: Enrich NHL prop identity (player_id / team / opponent)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_nhl_prop_identity.py

      # 2026-08-22 (silent-bug audit finding #8): NHL prop L10 backfill.
      # Fetches ESPN game logs per player, computes L5/L10/season hit rates.
      # Unblocks 4 NHL prop signals (l10_extreme, l5_hot, l5_cold,
      # season_hit_pct_high). Non-fatal (season starts Oct).
      - name: Backfill NHL prop L10 lookback (ESPN game logs)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_lookback.py --sport NHL

      - name: NHL prop playbook scorer (shadow mode)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_ensemble_scorer.py --sport NHL --refresh-existing
      # 2026-10-21 PROMOTE THE SHADOW SCORE ONTO THE LIVE NHL ROWS.
      #
      # The scorer above is literally named "shadow mode" - it writes only to
      # prop_playbook_decisions. Nothing then copied those convictions onto
      # the live rows, because promote_playbook_conviction.PROPS_TABLE listed
      # MLB and NFL only and exited 2 for anything else. Measured tonight,
      # EVERY prop on this board is COVERAGE: nhl_pipeline_props 5,503 of 5,503 rows for
      # 10-20/10-21. A board that is entirely COVERAGE cannot be evaluated,
      # and a board that cannot be evaluated can never earn a graded sample.
      #
      # THIS PUBLISHES NOTHING, and that is measured rather than assumed.
      # Dry run on 10-21: 646 playbook decisions against 485 live props,
      # 17 rows to promote, and ZERO of them move tier - every one reads
      # "COVERAGE -> COVERAGE (tier held)". Tier only moves for a playbook
      # PRIME (the script's default) and this board has none. What the rows
      # gain is a real conviction (73) in place of 0, which is what makes
      # the board orderable and evaluable at all.
      #
      # Two further gates sit in front of publishing regardless:
      # v_nhl_props_publishable requires PRIME or STRONG, and
      # feature_flags(NHL, 'pipeline_props') is FALSE. Flipping that flag
      # stays a product call - see B121.
      #
      # MUST RUN BEFORE any publish-lock step. Conviction is scoring, and
      # scoring has to finish before the pick is frozen; running it after the
      # lock is how MLB's first attempt patched rows and landed none.
      - name: Promote playbook conviction to live NHL props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "promote_playbook_conviction.py (NHL)" \
            python promote_playbook_conviction.py --sport NHL

      # 2026-08-23 season-ready: SO scraper + splits_v2 aggregator + signal
      # calibration. Silent no-op during offseason (NHL 2026-27 season opens
      # Oct 8). NHL not on Cleatz (Cleatz doesn't cover hockey per Phase 3
      # audit) but SO + FR + OC do. Once season opens, 3 sources fire.
      - name: ScoresAndOdds — scrape NHL splits
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_scoresandodds.py --sport NHL

      # ══ 2026-09-28 · NHL MONEY FLOW OWNED BY THE NHL WORKFLOW ══
      # Andy: "no menye flow ... we need to work on a source for money flwo
      # right now."
      #
      # The aggregator below has supported NHL since it shipped, and it is
      # wired here. What was missing is the INPUT: every money-flow scraper
      # ran only in mlb_pipeline.yml. They do cover NHL — fadereport_scraper
      # with no --sport iterates all six sports in SPORT_URL — so NHL money
      # flow has been silently dependent on the BASEBALL workflow running.
      #
      # MLB is in the Wild Card round now and is done inside a month. When
      # that workflow goes quiet, NHL, NBA and NCAAB all lose money flow at
      # once, with no error — just empty cards on the sports that are in
      # season. Each sport's workflow should own its own inputs.
      #
      # Scoped --sport NHL so this does not duplicate the all-sports pass that
      # still runs from MLB while MLB is alive.
      #
      # 2026-10-08 SUPERSEDED, and the way it was wrong is worth keeping.
      # This block used to read "FADEREPORT IS THE ONLY ONE OF THE FADE-FAMILY
      # SCRAPERS THAT DOES NHL. Checked all three" — but the check was against
      # our own SPORT_URL dict, where a 2026-08-23 comment recorded a 404 for
      # hockey. cleatz now serves https://cleatz.com/public-betting/nhl/ with
      # 14 games, moneyline + puck line + total, bets% AND handle%. A 404 is a
      # snapshot of one day, not a property of a site; re-probe before
      # declaring a source absent. Same lesson as calling oddscrowd dead.
      #
      # Measured before this step existed: NHL money flow was 1-of-3 sources
      # (fadereport only), so there was no second opinion to diverge against
      # and the panel had nothing to render.
      #
      # fadethepublic_scraper does still declare NO_COVERAGE = ('NHL',).
      - name: Money flow source (NHL · cleatz)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python cleatz_scraper.py --sport NHL || echo "::warning::cleatz NHL failed"
      - name: Money flow source (NHL · fadereport)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python fadereport_scraper.py --sport NHL || echo "::warning::fadereport NHL failed"
          # 2026-09-28 · second real money-flow source. Needs the chromium
          # installed above: the data is in web-component SHADOW DOM, which
          # neither requests nor page.content() can see, so this is the one
          # scraper here that genuinely requires a browser. It exits non-zero
          # when it matches no games, because a shadow-DOM parse breaks
          # silently on any component rewrite and a quiet zero-row run is the
          # failure mode this repo keeps getting bitten by.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "sbd_splits_scraper.py (NHL)"             python sbd_splits_scraper.py --league nhl

      - name: Splits v2 aggregator (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python splits_v2_pipeline.py --sport NHL

      # == 2026-10-19 - THESE TWO RAN BY HAND AND WERE IN NO WORKFLOW ==
      # compute_align_status_{nba,nhl}.py were written yesterday (22363500,
      # which took The Fade from 0 plays to 2) and write_line_snapshot gained
      # NBA/NHL in the same pass - but neither was ever scheduled, so both
      # only ever ran because I invoked them manually. NFL and NCAAF have had
      # these steps since 08-22; MLB gets line_snapshot from
      # mlb_oddscrowd_refresh.yml.
      #
      # WHAT BREAKS WITHOUT THEM, and it is not subtle:
      #   * line_snapshot is where the OddsCrowd bets_pct/money_pct split
      #     lands, and that split IS the filter The Fade selects on. No
      #     snapshot, no public percentage, no NBA or NHL fade plays at all.
      #   * it is also what the cross-sport classify_line_moves.py --sport ALL
      #     step in mlb_pipeline.yml flattens into line_movement_flags.
      #   * align_status drives the alignment chips on every game card.
      # NBA opens 2026-10-21, so unscheduled meant blank on opening night.
      #
      # Placed AFTER the splits aggregator deliberately: align_status reads
      # the splits, so running it first would compute alignment against
      # yesterday's numbers. Same ordering as nfl_pipeline.yml, where the
      # comment records the same reasoning for the externals pull.
      - name: Compute alignment (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # Today AND the next THREE days. The context builder above
          # covers "today + next 3 days" and the app surfaces those
          # forward games, but every compute_align_status_* defaults
          # to today only - so tomorrow's card had no alignment chips
          # until the day it was played. Verified 2026-10-19: NBA
          # 10-21 held 11 contexts with align_status set on ZERO of
          # them. The write is an idempotent upsert, so re-running a
          # date is free. -4h matches the script's own ET rollover.
          for off in 0 1 2 3; do
            d=$(date -u -d "-4 hours +${off} days" +%F)
            python compute_align_status_nhl.py --date "$d"
          done

      - name: Write line_snapshot from oddscrowd data (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          for off in 0 1 2 3; do
            d=$(date -u -d "-4 hours +${off} days" +%F)
            python write_line_snapshot.py --sport NHL --date "$d"
          done

      - name: Refresh NHL signal_registry from graded games
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport NHL --days 30

      # 2026-09-02: Split — per-source calibration for NHL. Silent no-op
      # until Oct 8 season start. NHL only has SO source in splits stack
      # today (see project_scoresandodds_sprint_824) so per-source
      # calibration will be sparse but wire pre-season for day-1 data.
      - name: Refresh external source calibration (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_external_source_calibration.py --sport NHL

      - name: Refresh sharp-source calibration (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_sharp_source_calibration.py --sport NHL

      # 2026-09-02: Split — signal-pattern rolling hit rates (NHL).
      - name: Refresh signal pattern registry (NHL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_signal_patterns.py --sport NHL

      # Note: NHL ensemble scoring happens inside nhl_game_context.py's
      # upsert path via _apply_ensemble (same as MLB pattern). Signals
      # in signal_sources (sport='NHL') fire automatically once tendency
      # backfill lands + ensemble_scorer runs.

      # 2026-09-01: Tier 1 rollup refresh calls (mirrors NCAAF/NFL/NBA).
      # Cross-sport matviews auto-include NHL rows once nhl_game_results
      # + nhl_game_context populate (Oct season start). Refreshes are
      # cross-sport in one shot so calling from here keeps NHL rollups
      # fresh without depending on MLB grader cron. Offseason: refreshes
      # are no-ops (NHL union blocks return 0 rows).
      - name: Refresh team_recent_games matview
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_recent_games" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Refresh team_situational_records matview
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          # 2026-09-22: was `curl -s ... -d '{}'` with the response
          # discarded. This RPC has returned 42809 since the 09-16
          # matview rename and no one heard for six days, because a
          # 400 and a 204 looked identical from here.
          code=$(curl -s -o /tmp/rpc_out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_team_situational_records" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::refresh_team_situational_records failed ($code): $(cat /tmp/rpc_out.json)"
            exit 1
          fi
      - name: Refresh team_stats_rolling matview
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          # 2026-09-22: was `curl -s ... -d '{}'` with the response
          # discarded. This RPC has returned 42809 since the 09-16
          # matview rename and no one heard for six days, because a
          # 400 and a 204 looked identical from here.
          code=$(curl -s -o /tmp/rpc_out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_team_stats_rolling" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::refresh_team_stats_rolling failed ($code): $(cat /tmp/rpc_out.json)"
            exit 1
          fi

      # 2026-09-08: bridge primary_play → jerry_reads for NHL. Ensemble +
      # defensive_gates now write primary_play in nhl_game_context; without
      # this sync, app never sees NHL picks (jerry_reads is the source of
      # truth the client reads from). Mirrors NCAAF/NFL/MLB wiring.
      - name: Sync NHL jerry_reads from context
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sync_jerry_reads_from_ctx.py --sport NHL --window 7

      # 2026-09-08 heartbeat END.
      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"nhl_pipeline\",\"event\":\"end\",\"sport\":\"NHL\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping end
        if: always()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NHL_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "$HC_URL" || true
          fi

      # ══ 2026-10-20 · ASSERT THE SLATE, DO NOT ASSUME IT ══
      # B107: ncaaf_pipeline ran start-to-end on every cron slot for five weeks
      # while its weather step returned before doing any work. Heartbeat was
      # green, the step was green (continue-on-error), the table had rows --
      # and 171 games shipped with no weather. ~400 steps across these
      # workflows carry continue-on-error, so a step's exit code cannot be the
      # signal and heartbeat answers a different question.
      #
      # DELIBERATELY NO continue-on-error. This is the check that catches the
      # advisory ones failing silently, so making it advisory defeats it. It
      # fails on two things only, both near-impossible legitimately:
      #   * a DARK COLUMN -- 0 populated rows of N on a slate that HAS rows
      #   * NO ROWS at all while the upstream schedule lists games
      # Partial fill is reported and does not fail, because context genuinely
      # fills in over time.
      - name: Assert NHL slate freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python assert_slate_freshness.py --sport NHL

      # ══ 2026-10-25 · THE ONE INVARIANT (B175) — see nfl_pipeline.yml ══
      # badge == read == card == receipt, on SIDE and MARKET. Hard by design:
      # an advisory version of this check is a muted one. --fail-on side so
      # the known B144 market population shouts without pinning the build red.
      - name: Assert publish invariant (badge == read == card == receipt)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python assert_publish_invariant.py --sport NHL --fail-on side
