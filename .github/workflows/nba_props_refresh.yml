name: NBA Props (own cadence)

# ══ 2026-11-10 · THE PROP CHAIN WAS SPENDING THE WHOLE NBA JOB BUDGET ══
# These nine steps lived in nba_pipeline.yml at positions 35-43 of 55. That
# job is capped at `timeout-minutes: 45` and its own comment says normal is
# ~21m. It was CANCELLED three times for three on 11-09 -- 44m41s, 44m43s,
# 44m41s -- and again on 11-10 at 44m41s.
#
# MEASURED LOCALLY against tonight's live slate, not estimated:
#
#     nba_prop_gate.py --apply        >900s    (STILL RUNNING when I cut it
#                                               off at 15 minutes -- rc 124,
#                                               not a completed measurement)
#     backfill_prop_lookback.py       >420s    (an ESPN athlete search + game
#                                               log per player, 121 players)
#     nba_generate_props.py            287s    (upserted 808 props)
#     enrich_nba_prop_projections.py   277s    (matched 788/808, patched 788)
#     nba_sleeper_projections_pull.py    9s
#     prop_slot_reconcile.py             1s
#
# >31 MINUTES across SIX of the nine, and two of those six are lower bounds
# because I stopped them rather than let them finish. Three are still
# unmeasured: prop_ensemble_scorer, promote_playbook_conviction and
# generate_prop_jerry_synthesis. On a bigger slate it is worse -- 11-09
# generated 1,794 props to tonight's 808.
#
# WHAT IT COST. Everything after step 28 in that job stopped running: `Sync
# NBA jerry_reads from context` (50), `Assert NBA slate freshness` (54),
# `Assert publish invariant` (55). The slate-freshness assertion fails on a
# DARK COLUMN -- which is precisely the money-flow outage it was written to
# catch -- and it sat behind the same wall as the bug.
#
# AND NONE OF IT CAN REACH A USER TODAY. `feature_flags(NBA,
# 'pipeline_props')` is false and `isPropSurfaceOn` reads it FAIL-CLOSED;
# the per-sport publishable view requires PRIME or STRONG; and NBA's board
# carries 0 PRIME and 0 STRONG (measured 11-09: 1,296 COVERAGE / 332 LEAN /
# 166 SKIP, conviction 0.0 on all 1,794 rows). So the job was spending a
# third of its budget on rows nothing can display, at the direct cost of the
# steps that build the SIDES the app does show.
#
# NOT DELETED, and deliberately so. The shadow record is the documented path
# to opening that surface on evidence rather than by fiat
# (feedback_unmeasured_signal_must_not_outweigh_measured) -- `NBA prop
# measured gate` and `prop playbook scorer (shadow mode)` exist for exactly
# that. They just do not get to spend nba_pipeline's budget.
#
# PRECEDENT: court_ice_splits_refresh.yml (ece14543) and
# football_splits_refresh.yml (10-23). Same remedy both times -- give the
# work its own cadence instead of raising a cap that is itself a real signal.
# Raising `timeout-minutes` would have hidden this.
#
# KNOWN OPEN, not fixed by this move: `prop_ensemble_scorer.py --sport NBA`
# writes NOTHING. prop_playbook_decisions for NBA is 0 rows on 11-09, 11-08
# and 11-05 while NHL got 622 and 2,089 and NFL 743 off the same scorer, and
# NBA conviction is 0 of 1,794 / 0 of 348 / 0 of 2,462 / 0 of 3,363 across
# 11-09, 11-05, 11-04 and 11-02. Two of those dates COMPLETED, so that is a
# separate and older defect than the timeout. It now at least gets to run.

on:
  schedule:
    # Props are a shadow record, not a live surface, so this wants cadence
    # rather than urgency. Two passes: one after the morning slate build so
    # the board exists for the day, one in the evening to pick up line moves
    # and late scratches before tip.
    #
    # :41, not :00. 56.7% of this repo's cron firings landed on :00 (59 of
    # 104), the most contended minute on GitHub's scheduler; splits took :24
    # and football took :09, so this takes :41 and the three do not stack.
    - cron: '41 14 * * *'   # ~9:41am ET nominal -- after the slate is built
    - cron: '41 22 * * *'   # ~5:41pm ET nominal -- pre-tip refresh
  workflow_dispatch:

# cancel-in-progress: false. These steps upsert and are idempotent, but
# `prop_slot_reconcile` DELETES superseded ungraded COVERAGE rows, and
# killing it mid-pass would leave the board half-collapsed for the scorer.
concurrency:
  group: nba-props-refresh
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    # 75. The measurement above is >31m for six of nine steps with two of
    # those a lower bound and three steps never timed, so anything near 45
    # would reproduce exactly the cancellation this move exists to end. A
    # generous cap is SAFE here in a way it was not in nba_pipeline: this job
    # feeds a shadow record behind a fail-closed feature flag, so a long run
    # cannot starve a user-facing surface. It is the sides pipeline whose cap
    # must stay tight, because there a run that reaches the limit is a real
    # signal.
    #
    # Honest open item: `nba_prop_gate.py --apply` was still going at 15
    # minutes on an 808-prop board and has no internal budget. If this job
    # starts hitting 75 that step is where to look first -- cap the step, not
    # the job (feedback_green_step_that_writes_nothing).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests python-dotenv beautifulsoup4 lxml pandas numpy scikit-learn

      - name: Generate NBA player props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_generate_props.py

      # ══ 2026-10-21 · COLLAPSE SUPERSEDED PROP ROWS ══
      #
      # MUST run after the generator and BEFORE backfill_prop_lookback.
      #
      # nba_generate_props upserts with prop_line inside the conflict key, so
      # a book moving the number between runs INSERTS a new row rather than
      # updating one. It also writes slates several days out, so a slate is
      # written once early and again on game day at a different line and both
      # rows persist. Measured 2026-10-21: 4,585 live rows across 2,333 slots
      # for one week of games, one slot holding 16 rows at 16 distinct lines.
      #
      # That is not just row bloat. The order here is generate -> backfill ->
      # score, so the backfill writes L5/L10 onto the rows that exist when it
      # runs, and the next generator pass leaves those enriched rows as
      # orphans. L5/L10 was fed on 0 of 3,222 NBA props while running the
      # backfill by hand fed 1,756 of 2,188 immediately. The enrichment was
      # never broken; it was being discarded.
      #
      # Collapsing here, before the backfill, means the backfill enriches the
      # row that will still be current when the scorer reads it.
      #
      # Deletes ONLY rows with result IS NULL and tier COVERAGE. Graded rows
      # are history feeding the records surfaces and are never touched.
      - name: Collapse superseded NBA prop rows
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_slot_reconcile.py --sport NBA --apply

      # ─── Sleeper NBA projections (2026-08-17) ─────────────────────
      # Weekly refresh good enough — projections update slowly. Runs
      # here for cheap on daily cron. Requires no API key.
      - name: Pull Sleeper NBA projections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_sleeper_projections_pull.py

      - name: Enrich NBA props with Sleeper projections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_nba_prop_projections.py

      # 2026-08-22 (silent-bug audit finding #7): NBA prop L10 backfill.
      # Fetches ESPN game logs per player, computes L5/L10/season hit rates
      # vs line. Unblocks 5 NBA prop signals (l10_extreme, l5_hot, l5_cold,
      # season_hit_pct_high, minutes_low_fade) that were reading fields
      # nothing populated. Non-fatal (season starts Oct — no impact yet).
      - name: Backfill NBA prop L10 lookback (ESPN game logs)
        continue-on-error: true
        # ══ 2026-11-09 · A STEP WITH NO BUDGET SPENDS THE JOB'S ══
        # This is the only step I measured directly while chasing the
        # money-flow outage: run by hand on tonight's 1,794-prop NBA board it
        # was still going after 7 minutes with nothing written to stdout. It
        # does an ESPN athlete search + a gamelog fetch per (player, stat)
        # pair -- 121 distinct players tonight -- with timeout=10 and
        # timeout=15 and no cap on the total, so a slow or throttled ESPN
        # turns into unbounded wall clock inside a job capped at 45 minutes.
        #
        # 15 is deliberately generous: it completes (1,774 of 1,794 rows carry
        # player_l10_hit_count today), so this should never fire on a healthy
        # night. What it buys is that a bad night can no longer eat the
        # budget -- and because continue-on-error lets the job go on, the run
        # now REACHES the --gate step, which is what posts `step_durations`
        # to workflow_heartbeat. So the next run measures every step for me
        # instead of me guessing which one hangs. I have NOT established that
        # this step is the whole 45 minutes; the durations will say.
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_lookback.py --sport NBA

      # == 2026-10-28 . THE MEASURED NBA PROP GATE WAS NEVER SCHEDULED ==
      # nba_prop_gate.py was written on 10-26 to give this board its first
      # discriminator (prop_line / bounded L5, quintiles within direction,
      # monotone with a 37-point spread on overs). It was run by hand once
      # and never wired, so the board went straight back to one flat tier:
      #
      #     10-25  signals on 1,006 of 1,110 rows   tier LEAN/SKIP/COVERAGE
      #     10-26  signals on   317 of 1,650 rows
      #     10-27  signals on     0 of   642 rows   tier COVERAGE on ALL
      #     10-28  signals on     0 of 1,945 rows   tier COVERAGE on ALL
      #
      # The decay is nba_generate_props.py:209 upserting tier COVERAGE /
      # conviction 0 / signals {} on every run, which overwrites anything
      # applied out of band. In-run ordering is therefore the fix: this
      # must sit AFTER the generator, which it now does.
      #
      # PUBLISHES NOTHING. It assigns SKIP and LEAN only -- no PRIME, no
      # STRONG, because no cell measured profitably -- and publishing
      # needs PRIME plus a feature flag that is still FALSE (B121).
      - name: NBA prop measured gate (SKIP/LEAN, publishes nothing)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_prop_gate.py --apply

      - name: NBA prop playbook scorer (shadow mode)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_ensemble_scorer.py --sport NBA --refresh-existing
      # 2026-10-21 PROMOTE THE SHADOW SCORE ONTO THE LIVE NBA ROWS.
      #
      # The scorer above is literally named "shadow mode" - it writes only to
      # prop_playbook_decisions. Nothing then copied those convictions onto
      # the live rows, because promote_playbook_conviction.PROPS_TABLE listed
      # MLB and NFL only and exited 2 for anything else. Measured tonight,
      # EVERY prop on this board is COVERAGE: nba_pipeline_props 5,151 of 5,151 rows for
      # 10-20/10-21. A board that is entirely COVERAGE cannot be evaluated,
      # and a board that cannot be evaluated can never earn a graded sample.
      #
      # THIS PUBLISHES NOTHING, and that is measured rather than assumed.
      # Dry run on 10-21: 950 playbook decisions against 2,073 live props,
      # 136 rows to promote, and ZERO of them move tier - every one reads
      # "COVERAGE -> COVERAGE (tier held)". Tier only moves for a playbook
      # PRIME (the script's default) and this board has none. What the rows
      # gain is a real conviction (54-73) in place of 0, which is what makes
      # the board orderable and evaluable at all.
      #
      # Two further gates sit in front of publishing regardless:
      # v_nba_props_publishable requires PRIME or STRONG, and
      # feature_flags(NBA, 'pipeline_props') is FALSE. Flipping that flag
      # stays a product call - see B121.
      #
      # MUST RUN BEFORE any publish-lock step. Conviction is scoring, and
      # scoring has to finish before the pick is frozen; running it after the
      # lock is how MLB's first attempt patched rows and landed none.
      - name: Promote playbook conviction to live NBA props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "promote_playbook_conviction.py (NBA)" \
            python promote_playbook_conviction.py --sport NBA

      # == 2026-11-02 - NBA SCORED 18,318 PROPS AND PUBLISHED NONE ========
      # ANDY: "What are we doing to fix nba and nhl prop we have been doing
      # this song and dance for over a week and still 0 today everyday."
      #
      # Everything above this line worked. nba_generate_props writes the
      # board, the gate runs, the playbook scorer runs, conviction gets
      # promoted -- and then nothing consumed it, because
      # generate_prop_jerry_synthesis was only ever invoked by mlb_pipeline
      # and nfl_pipeline, and NBA was commented out of its PROPS_TABLE:
      #
      #     sport   source props   prop_jerry_reads
      #     MLB           38,695             11,487
      #     NFL            5,150              4,844
      #     NBA           18,318                  0   <-- here
      #     NHL           77,919                  0
      #
      # Placed AFTER promote_playbook_conviction on purpose: the synthesizer
      # reads tier and conviction off the prop row, so running it earlier
      # would score every prop against a pre-promotion tier.
      #
      # This does NOT put NBA props on a card by itself. prop_cell_allowlist
      # still gates publishing to measured cells and NBA has two
      # (ast_under/LEAN, pra_under/LEAN); everything else becomes a PASS
      # read. That is the point -- the reads start a graded record so the
      # gate can open later on evidence
      # (feedback_unmeasured_signal_must_not_outweigh_measured).
      - name: Prop Jerry reads (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          python generate_prop_jerry_synthesis.py --sport NBA --days 0 --force --tier-gate NONE
