name: NBA Pipeline Daily

on:
  schedule:
    # 2026-08-17 rebuild: NBA v1.0 scaffolding. Season opener Oct 22.
    # Preseason ~early Oct. Daily cron so preseason data flows in.
    - cron: '0 12 * * *'   # 8:00am EDT — before tip
    - cron: '0 22 * * *'   # 6:00pm EDT — post-market refresh
  workflow_dispatch:
    inputs:
      date:
        description: 'Target game_date (YYYY-MM-DD, default: today ET)'
        required: false

jobs:
  nba-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        run: pip install requests python-dotenv

      # ─── Yesterday's results ───────────────────────────────────
      - name: Resolve yesterday's NBA results
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_resolve_results.py || echo "nba resolver failed (non-fatal, likely offseason)"

      # 2026-08-25: refresh home/road tendencies materialized view after
      # results resolver. Powers the Trends & Tendencies card in the NBA
      # slot redesign. Uses refresh_home_road_tendencies(sport) RPC from
      # 20260826b migration. Offseason no-op (0 games → 0 rows).
      - name: Refresh NBA home/road tendencies view
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_home_road_tendencies" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_sport": "NBA"}' || echo "tendencies refresh failed"

      # 2026-08-23 season-ready: refresh signal_registry from graded NBA props
      # once season data lands. Sport-universal script. Silent no-op during
      # offseason (no graded prop history). Feeds v3-style refit training
      # once volume hits.
      - name: Refresh NBA signal_registry from graded props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport NBA --days 30 || echo "NBA signal calibration failed (non-fatal, likely offseason)"

      # 2026-08-25: NBA injury scrape (ESPN /nba/injuries). Populates
      # nba_injuries so the NBAInjuriesCard in GameDetailV2 has data to
      # render. Works year-round (ESPN keeps the page live in offseason
      # with rehab / surgery-recovery entries). Non-fatal — if ESPN
      # markup shifts, we get 0 rows and the card renders empty.
      - name: Pull NBA injuries (ESPN)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_injuries_pull.py || echo "NBA injuries pull failed (non-fatal)"

      # ─── Today's context (schedule + odds + rest) ──────────────
      - name: Build NBA game context (today + next 3 days)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_game_context.py --days 4 || echo "nba game_context failed (non-fatal, likely offseason)"

      # ─── L10 team tendencies backfill ──────────────────────────
      - name: Backfill NBA team tendencies (L10)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_nba_team_tendencies.py || echo "nba tendencies backfill failed (non-fatal)"

      # ─── Season-trend pull + enrichment (teamrankings) ─────────
      - name: Pull NBA season trends from teamrankings
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_teamrankings_trends.py --sport NBA || echo "NBA teamrankings pull failed (non-fatal)"

      - name: Enrich NBA game context with season trends
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_trends.py --sport NBA || echo "NBA trend enrichment failed (non-fatal)"

      # 2026-08-18: universal team-form (venue-split L10 + H2H last 5)
      - name: Enrich team form — venue split + H2H
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NBA || echo "team_form_universal non-fatal"

      # ─── NBA prop pipeline (2026-08-17) ────────────────────────────
      - name: Generate NBA player props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_generate_props.py || echo "nba props failed (non-fatal, likely offseason)"

      # ─── Sleeper NBA projections (2026-08-17) ─────────────────────
      # Weekly refresh good enough — projections update slowly. Runs
      # here for cheap on daily cron. Requires no API key.
      - name: Pull Sleeper NBA projections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_sleeper_projections_pull.py || echo "nba sleeper failed (non-fatal)"

      - name: Enrich NBA props with Sleeper projections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_nba_prop_projections.py || echo "nba proj enrich failed (non-fatal)"

      # 2026-08-22 (silent-bug audit finding #7): NBA prop L10 backfill.
      # Fetches ESPN game logs per player, computes L5/L10/season hit rates
      # vs line. Unblocks 5 NBA prop signals (l10_extreme, l5_hot, l5_cold,
      # season_hit_pct_high, minutes_low_fade) that were reading fields
      # nothing populated. Non-fatal (season starts Oct — no impact yet).
      - name: Backfill NBA prop L10 lookback (ESPN game logs)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_lookback.py --sport NBA || echo "NBA prop lookback failed (non-fatal)"

      - name: NBA prop playbook scorer (shadow mode)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_ensemble_scorer.py --sport NBA --refresh-existing || echo "NBA prop playbook failed (non-fatal)"

      # 2026-08-23 season-ready: SO scraper + splits_v2 aggregator (mirrors
      # NCAAF/NCAAB pattern). Silent no-op during offseason.
      - name: ScoresAndOdds — scrape NBA splits
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_scoresandodds.py --sport NBA || echo "SO NBA failed (non-fatal, likely offseason)"

      - name: Splits v2 aggregator (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python splits_v2_pipeline.py --sport NBA || echo "NBA splits aggregator failed (non-fatal)"

      - name: Refresh NBA signal_registry from graded games
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport NBA --days 30 || echo "NBA signal calibration failed (non-fatal, likely offseason)"

      # Model / card generation: Elo model runs inside nba_game_context.py
      # (enrich_elo). Card generation deferred until preseason validates.
