        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NBA

      # ─── NBA prop pipeline (2026-08-17) ────────────────────────────
      - name: Generate NBA player props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_generate_props.py

      # ══ 2026-10-21 · COLLAPSE SUPERSEDED PROP ROWS ══
      #
      # MUST run after the generator and BEFORE backfill_prop_lookback.
      #
      # nba_generate_props upserts with prop_line inside the conflict key, so
      # a book moving the number between runs INSERTS a new row rather than
      # updating one. It also writes slates several days out, so a slate is
      # written once early and again on game day at a different line and both
      # rows persist. Measured 2026-10-21: 4,585 live rows across 2,333 slots
      # for one week of games, one slot holding 16 rows at 16 distinct lines.
      #
      # That is not just row bloat. The order here is generate -> backfill ->
      # score, so the backfill writes L5/L10 onto the rows that exist when it
      # runs, and the next generator pass leaves those enriched rows as
      # orphans. L5/L10 was fed on 0 of 3,222 NBA props while running the
      # backfill by hand fed 1,756 of 2,188 immediately. The enrichment was
      # never broken; it was being discarded.
      #
      # Collapsing here, before the backfill, means the backfill enriches the
      # row that will still be current when the scorer reads it.
      #
      # Deletes ONLY rows with result IS NULL and tier COVERAGE. Graded rows
      # are history feeding the records surfaces and are never touched.
      - name: Collapse superseded NBA prop rows
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_slot_reconcile.py --sport NBA --apply

      # ─── Sleeper NBA projections (2026-08-17) ─────────────────────
      # Weekly refresh good enough — projections update slowly. Runs
      # here for cheap on daily cron. Requires no API key.
      - name: Pull Sleeper NBA projections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_sleeper_projections_pull.py

      - name: Enrich NBA props with Sleeper projections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_nba_prop_projections.py

      # 2026-08-22 (silent-bug audit finding #7): NBA prop L10 backfill.
      # Fetches ESPN game logs per player, computes L5/L10/season hit rates
      # vs line. Unblocks 5 NBA prop signals (l10_extreme, l5_hot, l5_cold,
      # season_hit_pct_high, minutes_low_fade) that were reading fields
      # nothing populated. Non-fatal (season starts Oct — no impact yet).
      - name: Backfill NBA prop L10 lookback (ESPN game logs)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python backfill_prop_lookback.py --sport NBA

      # == 2026-10-28 . THE MEASURED NBA PROP GATE WAS NEVER SCHEDULED ==
      # nba_prop_gate.py was written on 10-26 to give this board its first
      # discriminator (prop_line / bounded L5, quintiles within direction,
      # monotone with a 37-point spread on overs). It was run by hand once
      # and never wired, so the board went straight back to one flat tier:
      #
      #     10-25  signals on 1,006 of 1,110 rows   tier LEAN/SKIP/COVERAGE
      #     10-26  signals on   317 of 1,650 rows
      #     10-27  signals on     0 of   642 rows   tier COVERAGE on ALL
      #     10-28  signals on     0 of 1,945 rows   tier COVERAGE on ALL
      #
      # The decay is nba_generate_props.py:209 upserting tier COVERAGE /
      # conviction 0 / signals {} on every run, which overwrites anything
      # applied out of band. In-run ordering is therefore the fix: this
      # must sit AFTER the generator, which it now does.
      #
      # PUBLISHES NOTHING. It assigns SKIP and LEAN only -- no PRIME, no
      # STRONG, because no cell measured profitably -- and publishing
      # needs PRIME plus a feature flag that is still FALSE (B121).
      - name: NBA prop measured gate (SKIP/LEAN, publishes nothing)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_prop_gate.py --apply

      - name: NBA prop playbook scorer (shadow mode)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python prop_ensemble_scorer.py --sport NBA --refresh-existing
      # 2026-10-21 PROMOTE THE SHADOW SCORE ONTO THE LIVE NBA ROWS.
      #
      # The scorer above is literally named "shadow mode" - it writes only to
      # prop_playbook_decisions. Nothing then copied those convictions onto
      # the live rows, because promote_playbook_conviction.PROPS_TABLE listed
      # MLB and NFL only and exited 2 for anything else. Measured tonight,
      # EVERY prop on this board is COVERAGE: nba_pipeline_props 5,151 of 5,151 rows for
      # 10-20/10-21. A board that is entirely COVERAGE cannot be evaluated,
      # and a board that cannot be evaluated can never earn a graded sample.
      #
      # THIS PUBLISHES NOTHING, and that is measured rather than assumed.
      # Dry run on 10-21: 950 playbook decisions against 2,073 live props,
      # 136 rows to promote, and ZERO of them move tier - every one reads
      # "COVERAGE -> COVERAGE (tier held)". Tier only moves for a playbook
      # PRIME (the script's default) and this board has none. What the rows
      # gain is a real conviction (54-73) in place of 0, which is what makes
      # the board orderable and evaluable at all.
      #
      # Two further gates sit in front of publishing regardless:
      # v_nba_props_publishable requires PRIME or STRONG, and
      # feature_flags(NBA, 'pipeline_props') is FALSE. Flipping that flag
      # stays a product call - see B121.
      #
      # MUST RUN BEFORE any publish-lock step. Conviction is scoring, and
      # scoring has to finish before the pick is frozen; running it after the
      # lock is how MLB's first attempt patched rows and landed none.
      - name: Promote playbook conviction to live NBA props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "promote_playbook_conviction.py (NBA)" \
            python promote_playbook_conviction.py --sport NBA

      # 2026-08-23 season-ready: SO scraper + splits_v2 aggregator (mirrors
      # NCAAF/NCAAB pattern). Silent no-op during offseason.
      - name: ScoresAndOdds — scrape NBA splits
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_scoresandodds.py --sport NBA

      - name: Splits v2 aggregator (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python splits_v2_pipeline.py --sport NBA

      # == 2026-10-19 - THESE TWO RAN BY HAND AND WERE IN NO WORKFLOW ==
      # compute_align_status_{nba,nhl}.py were written yesterday (22363500,
      # which took The Fade from 0 plays to 2) and write_line_snapshot gained
      # NBA/NHL in the same pass - but neither was ever scheduled, so both
      # only ever ran because I invoked them manually. NFL and NCAAF have had
      # these steps since 08-22; MLB gets line_snapshot from
      # mlb_oddscrowd_refresh.yml.
      #
      # WHAT BREAKS WITHOUT THEM, and it is not subtle:
      #   * line_snapshot is where the OddsCrowd bets_pct/money_pct split
      #     lands, and that split IS the filter The Fade selects on. No
      #     snapshot, no public percentage, no NBA or NHL fade plays at all.
      #   * it is also what the cross-sport classify_line_moves.py --sport ALL
      #     step in mlb_pipeline.yml flattens into line_movement_flags.
      #   * align_status drives the alignment chips on every game card.
      # NBA opens 2026-10-21, so unscheduled meant blank on opening night.
      #
      # Placed AFTER the splits aggregator deliberately: align_status reads
      # the splits, so running it first would compute alignment against
      # yesterday's numbers. Same ordering as nfl_pipeline.yml, where the
      # comment records the same reasoning for the externals pull.
      - name: Compute alignment (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          # Today AND the next THREE days. The context builder above
          # covers "today + next 3 days" and the app surfaces those
          # forward games, but every compute_align_status_* defaults
          # to today only - so tomorrow's card had no alignment chips
          # until the day it was played. Verified 2026-10-19: NBA
          # 10-21 held 11 contexts with align_status set on ZERO of
          # them. The write is an idempotent upsert, so re-running a
          # date is free. -4h matches the script's own ET rollover.
          for off in 0 1 2 3; do
            d=$(date -u -d "-4 hours +${off} days" +%F)
            python compute_align_status_nba.py --date "$d"
          done

      - name: Write line_snapshot from oddscrowd data (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          for off in 0 1 2 3; do
            d=$(date -u -d "-4 hours +${off} days" +%F)
            python write_line_snapshot.py --sport NBA --date "$d"
          done

      # 2026-09-08: removed duplicate refresh_prop_signal_calibration call
      # — same script + args was already run at line ~156 ("graded props"
      # step). Per project_pipeline_overhaul_909 dedup pass.

      # 2026-09-02: Split — per-source calibration for NBA. Silent no-op
      # until season starts (Oct). Wire pre-season so day-1 records populate.
      - name: Refresh external source calibration (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_external_source_calibration.py --sport NBA

      - name: Refresh sharp-source calibration (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_sharp_source_calibration.py --sport NBA

      # 2026-09-02: Split — signal-pattern rolling hit rates (NBA).
      - name: Refresh signal pattern registry (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_signal_patterns.py --sport NBA

      # 2026-09-08: bridge primary_play → jerry_reads for NBA. Ensemble +
      # defensive_gates now write primary_play in nba_game_context; without
      # this sync, app never sees NBA picks (jerry_reads is the source of
      # truth the client reads from). Mirrors NCAAF/NFL/MLB wiring.
      - name: Sync NBA jerry_reads from context
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sync_jerry_reads_from_ctx.py --sport NBA --window 4

      # 2026-09-08 heartbeat END.
      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"nba_pipeline\",\"event\":\"end\",\"sport\":\"NBA\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping end
        if: always()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NBA_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "$HC_URL" || true
          fi

      # Model / card generation: Elo model runs inside nba_game_context.py
      # (enrich_elo). Card generation deferred until preseason validates.

      # ══ 2026-10-20 · ASSERT THE SLATE, DO NOT ASSUME IT ══
      # B107: ncaaf_pipeline ran start-to-end on every cron slot for five weeks
      # while its weather step returned before doing any work. Heartbeat was
      # green, the step was green (continue-on-error), the table had rows --
      # and 171 games shipped with no weather. ~400 steps across these
      # workflows carry continue-on-error, so a step's exit code cannot be the
      # signal and heartbeat answers a different question.
      #
      # DELIBERATELY NO continue-on-error. This is the check that catches the
      # advisory ones failing silently, so making it advisory defeats it. It
      # fails on two things only, both near-impossible legitimately:
      #   * a DARK COLUMN -- 0 populated rows of N on a slate that HAS rows
      #   * NO ROWS at all while the upstream schedule lists games
      # Partial fill is reported and does not fail, because context genuinely
      # fills in over time.
      - name: Assert NBA slate freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python assert_slate_freshness.py --sport NBA

      # ══ 2026-10-25 · THE ONE INVARIANT (B175) — see nfl_pipeline.yml ══
      # badge == read == card == receipt, on SIDE and MARKET. Hard by design:
      # an advisory version of this check is a muted one. --fail-on side so
      # the known B144 market population shouts without pinning the build red.
      - name: Assert publish invariant (badge == read == card == receipt)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python assert_publish_invariant.py --sport NBA --fail-on side
