      # ══ 2026-11-08 · NBA'S UNMEASURED PRIORS WERE 3.3x ITS EVIDENCE ══
      # Same unwired writer as the NFL step added today. NBA is the worst
      # case measured: four signals carry a weight of 1.000 / 1.000 / 1.000
      # / 0.500 on n=0 of their own graded outcomes, while the best NBA
      # signal that HAS evidence carries 0.300 (nba_elo_home_ml_strong,
      # 55.3% on n=38). So a prior with no samples outweighed the
      # best-evidenced signal in the sport by up to 3.3x
      # (feedback_unmeasured_signal_must_not_outweigh_measured).
      #
      # Three of the four are nba_projection_edge_* -- the family that
      # decides how much our projection disagreeing with the market is
      # worth, which is exactly the axis that put `Boston Celtics -12.5`
      # (projection 8.4, market 12.5) at the top of the NBA board today.
      #
      # The script caps to 0.300, the most any evidenced NBA signal earned.
      # It never zeroes and never raises.
      - name: Cap unmeasured NBA signal weights (runs before the scorer)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "cap_unmeasured_signal_weight.py" python cap_unmeasured_signal_weight.py --sport NBA --apply

      # ─── Today's context (schedule + odds + rest) ──────────────
      - name: Build NBA game context (today + next 3 days)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_game_context.py --days 4

      # ══ 2026-10-13 · NBA HAD NO INJURY DATA REACHING THE ENGINE ══
      # nba_game_context.home_starters_out / away_starters_out /
      # home_injury_impact / away_injury_impact were 0 of 81 populated.
      # nba_game_context.py:305 READS injury_impact and nothing had ever
      # written it, so the three star-out signals
      # (nba_home_star_out_fade, nba_away_star_out_fade,
      # nba_prop_star_out_teammate_boost) evaluated NULL every night.
      # Star availability is the most price-moving input in basketball.
      #
      # Both sources already existed and were simply never joined:
      # nba_injuries (pulled two steps above) and nba_player_game_logs,
      # which carries a real `started` boolean — so "is this a starter"
      # is measured, not inferred from a minutes threshold.
      #
      # Placed AFTER nba_game_context (the rows must exist to PATCH) and
      # BEFORE the Jerry reads below, so the read narrates a slate that
      # already knows who is out. Same ordering logic as the read step's
      # own comment.
      - name: Enrich NBA game context with injuries
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_nba_injuries_to_context.py --apply

      # ══ 2026-11-09 · MONEY FLOW MOVED TO THE FRONT OF THE JOB ══
      #
      # ANDY: "Not seeing money flow on nba games. THIS IS THE WHOLE
      # PURPOSE OF MORNING CADENCE."  Measured: oddscrowd_snapshot and
      # splits_summary were NULL on EVERY NBA game from 11-06 to 11-12,
      # and on 11-02 and 11-04 before that. 11-06..11-08 was the duplicate
      # YAML key that de-registered this workflow. 11-09 is this bug:
      #
      #   run 42710379503  start 22:17:05  end 23:01:46   44m41s
      #   run 42716527914  start 22:58:54  end 23:43:37   44m43s
      #   run 42736044477  start 01:29:15  end 02:13:56   44m41s
      #
      # Three for three against `timeout-minutes: 45`. The `end` heartbeat
      # is `if: always()`, so it fires on CANCELLATION too and the workflow
      # looked like it finished. These four steps sat at line ~960, step 38
      # of 52, and the job never got there: NBA raw splits rows were 0 from
      # 11-07 on while NCAAB wrote 116 the same night, so the scrapers were
      # never the problem. Run by hand tonight they produced 76 raw rows ->
      # 408 aggregated -> splits_summary on 8/8 games -> align on 8/8 -> 24
      # line_snapshot rows, first try.
      #
      # A SECOND REASON TO MOVE THEM, independent of the timeout: at line
      # 960 they also ran AFTER the simulator (603) and the game reads
      # (648). generate_nba_game_reads:471 lists `money_flow` in
      # absent_blocks when oddscrowd_snapshot is falsy, and
      # ensemble_scorer:2007 counts OddsCrowd money% as a VOTE. So even in a
      # run that finished, the reads were written and scored before that
      # night`s money flow existed. Here they land in the first ~5 minutes,
      # ahead of both.
      #
      # Ordering INSIDE the block is preserved and still matters: scrape ->
      # aggregate -> align (reads the splits) -> line_snapshot (reads the
      # alignment). `Derive cover probability` and `Stamp conviction_rank`
      # deliberately did NOT come along -- they read simulator and scorer
      # output and have to stay downstream of it.

      # 2026-08-23 season-ready: SO scraper + splits_v2 aggregator (mirrors
      # NCAAF/NCAAB pattern). Silent no-op during offseason.
      - name: ScoresAndOdds — scrape NBA splits
        continue-on-error: true
        env:
