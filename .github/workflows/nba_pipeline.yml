name: NBA Pipeline Daily

on:
  schedule:
    # 2026-08-28 Phase 4 kill #9: dropped from 2x/day to 1x/day pre-season.
    # All steps are silent no-ops until Oct 22 season opener. Restore
    # 22 UTC (post-market) cron once preseason starts ~early Oct.
    - cron: '0 12 * * *'   # 8:00am EDT — daily preseason placeholder
    # ══ 2026-10-13 · RESTORED, AND IT IS WHY NBA EXTERNALS WERE EMPTY ══
    # The note above prescribed this and it was never put back; preseason
    # started 2026-10-03 and NBA games are being played now.
    #
    # The 12 UTC slot alone cannot collect money flow. OddsCrowd publishes
    # its Bets%/Money% block only as a game approaches, and
    # externals_oddscrowd requires that block to emit a pick at all —
    # measured today on the SAME 25 candidate URLs: the 07:02 ET pull
    # returned 0 picks, the 12:04 ET pull returned 12. Nothing was wrong
    # with the parser or the slate match (every gate passes, find_game_id
    # resolves all three test games); the job was simply running hours
    # before the data exists, so external_picks held 0 NBA rows while 6 of
    # 6 sources reported "ok".
    #
    # ══ THE SLOT IS CHOSEN FROM MEASURED LATENESS, NOT NOMINAL TIME ══
    # These crons do not fire when they say. Measured from
    # workflow_heartbeat across 294 starts (2026-10-13), median lateness is
    # +4.38h, and it is WORSE for earlier slots:
    #     12 UTC  +4.5h      15 UTC  +4.3h to +4.8h
    #     18 UTC  +2.9h (p90 +4.6h)  20 UTC  +2.8h   22 UTC  +2.1h
    # So 22 UTC would actually land ~8:10pm ET — after the 7pm tips, which
    # is the mistake this comment exists to prevent. 18 UTC lands ~4:54pm
    # ET at the median and ~6:33pm ET at p90: both still ahead of the
    # earliest tip, and late enough for splits to be posted (the 12:04pm ET
    # manual pull already had them).
    #
    # Keeping the 12 UTC run too: it builds context/reads for the day, and
    # a second pass also re-resolves.
    - cron: '0 18 * * *'   # ~4:54pm ET actual — post-market, pre-tip
    # ══ 2026-10-21 · A THIRD SLOT, AND IT CORRECTS THE NOTE ABOVE ══
    # ANDY, 9:06am ET: "Also bot seeing moeny flwo data on nba games tighr
    # now." He was right: nba_game_context had splits_summary on 3 of 28 rows
    # and all three were YESTERDAY's games. line_snapshot's newest NBA row was
    # 2026-10-20T21:38 — nothing at all for today's 11-game slate.
    #
    # THE NOTE ABOVE ASSUMES SPLITS DO NOT EXIST IN THE MORNING. Measured
    # today, that is not true. Running the chain by hand at 13:06 UTC
    # (9:06am ET) returned:
    #
    #     pull_scoresandodds --sport NBA   116 rows across 25 games
    #     splits_v2_pipeline --sport NBA   splits_summary on 11/11 contexts
    #     write_line_snapshot --sport NBA   29 line_snapshot rows
    #
    # with real divergence already posted (Brooklyn ML money 70 vs bets 39,
    # +31pp). The 12:04pm ET measurement on 10-13 established that 07:02 ET
    # was too early; it did not establish that 9am is. So the data was there
    # and we were not asking for it.
    #
    # WHY THE GAP EXISTS. The 12 UTC slot is scheduled for 8am ET but the
    # measured median lateness for early slots is +4.4h, so it actually lands
    # around 12:30pm ET. Between midnight and then, NBA game cards have no
    # fresh money flow even though the source has published it — which is
    # exactly the window Andy was looking at.
    #
    # 13 UTC is chosen so BOTH outcomes are useful, which is the lesson of the
    # lateness table above: on time it lands 9am ET, where splits were just
    # proven to exist; at the +4.4h median it lands ~1:24pm ET, still well
    # ahead of the earliest tip. The 18 UTC slot stays as the pre-tip
    # authority and 12 UTC stays for context/reads.
    #
    # Every step is idempotent and upserts, so a third pass costs an odds
    # pull and nothing else.
    - cron: '0 13 * * *'   # 9:00am ET on time, ~1:24pm ET at median lateness
  workflow_dispatch:
    inputs:
      date:
        description: 'Target game_date (YYYY-MM-DD, default: today ET)'
        required: false

jobs:
  nba-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        run: |
          # ══ 2026-10-22 · NBA HAD 2 WORKING EXTERNAL SOURCES, NOT 6 ══
          # ANDY: "i want to assess NBA externals there should be more, what
          # about CBS they do daily, and pickdawgz they do daily and others."
          #
          # He is right that there should be more, and the cause was not a
          # missing scraper. SportPuller already offers SIX fetchers to NBA
          # and external_pull_log shows all six being attempted. Four of them
          # fail on almost every run:
          #
          #     dimers         success 12
          #     sbr            success 11
          #     covers         failed 10 / success 1
          #     pickdawgz      failed 10 / success 1
          #     scoresandodds  failed 10 / success 1
          #     oddscrowd      failed 10 / success 1
          #
          # The two that work read SSR JSON. The four that fail need a
          # browser — and this step installed neither playwright nor
          # beautifulsoup4, while nhl/mlb/ncaaf/nfl_pipeline all do. Run
          # pickdawgz for NBA by hand and it returns 4 picks on 4 games; run
          # it here and it cannot.
          #
          # This is the SAME omission nhl_pipeline documented on 2026-09-25,
          # which "kept dimers and action at 0 picks on NFL/NCAAF":
          # _playwright_helper.render_page returns (None, 'unavailable') and
          # the source then reports success with no data.
          #
          # NBA opened 2026-10-21 with 68 external rows against MLB's 9,439.
          # Most of that gap is this line.
          pip install requests python-dotenv beautifulsoup4 playwright
          python -m playwright install --with-deps chromium || echo "⚠ chromium install failed — JS-rendered externals will skip this run"

      # 2026-09-08 heartbeat START (parity w/ mlb_pipeline). See
      # project_pipeline_overhaul_909.
      - name: Heartbeat — start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"nba_pipeline\",\"event\":\"start\",\"sport\":\"NBA\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping start
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NBA_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "${HC_URL}/start" || true
          fi

      # ─── Yesterday's results ───────────────────────────────────
      # 2026-09-21: ODDS PULL — creates the FORWARD SCHEDULE. Must run
      # BEFORE nba_game_context, which has nothing to build from without
      # it. Before this existed nba_game_results carried 0 forward games
      # (NFL had 241, NCAAF 104), so every downstream step — context,
      # game card, props, externals — had an empty slate and reported
      # "no games" rather than an error. Adopts the league's canonical
      # game id so results and context join.
      - name: Pull NBA forward schedule + lines (Odds API)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_odds_pull.py

      - name: Resolve yesterday's NBA results
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_resolve_results.py
          # 2026-10-23 - B155. nba_player_log_ingest.py was in NO workflow.
          # nba_player_game_logs held 58,600 rows but ZERO for 10-20, 10-21
          # and 10-22 - the games actually played this season. Newest
          # created_at was 10-05, the day someone last ran it by hand.
          #
          # That single gap is the root of the whole NBA prop problem:
          #   no player game logs for played games
          #     -> nothing to grade props against
          #       -> 0 graded props of 7,500
          #         -> no calibration data
          #           -> tier hardcoded COVERAGE in nba_generate_props.py:209
          #             -> v_nba_props_publishable returns 0
          #               -> The Sharp has no NBA props, and no path past MLB
          #
          # Immediately AFTER nba_resolve_results and in the same step, so it
          # ingests box scores for the games this run just finalised. --since
          # is cheap: the script skips games it already holds (2,698 of 2,714
          # on the backfill run).
          #
          # Fourth script found today written-but-never-scheduled, after
          # split_sharp_card_record.py, refresh_calibration_notes.py and
          # cross_sport_lines.yml. See B157.
          python nba_player_log_ingest.py --since 2026-10-01 --apply

      # 2026-09-08 wired: grade NBA jerry_reads right after resolver so
      # NBA doesn't wait on the MLB nightly step. Parallels NHL wiring —
      # NBA in grade_jerry_reads.RESULTS_TABLE already; this ensures the
      # grader actually fires per-sport-cadence. Required for Oct 24
      # season start. See project_cross_sport_grading_audit_908.
      - name: Grade NBA jerry_reads
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_jerry_reads.py --sport NBA

      # ══ 2026-10-28 · NBA PROPS HAD NO SCHEDULED GRADER AT ALL ══
      # grade_props.py has carried 'NBA': 'nba_pipeline_props' in
      # SPORT_PROPS_TABLE since the NBA buildout, but NO workflow ever
      # called it. Every graded NBA prop in the table got there from a
      # hand run, so grading drifted days behind the slate:
      #
      #   nba_pipeline_props   12,075 rows   9,783 graded
      #   last graded game_date 2026-10-25, with 10-26 and 10-27 open
      #
      # Same failure shape as the receipt sport list and the ctx chain that
      # stopped at NHL: the capability existed and the schedule did not.
      # NHL has had this step since 10-09; this is its NBA twin.
      - name: Grade NBA props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_props.py --sport NBA

      # ══ 2026-10-28 · AND THE PLAYBOOK LEDGER BEHIND THEM ══
      # prop_playbook_decisions is Prop Jerry's decision ledger — the table
      # the weekly attribution has to read to answer "what drove the pick".
      # It held 58,405 rows, 26,299 graded, and every graded one was MLB,
      # because grade_prop_playbook.SPORT_PROPS_TABLE was {'MLB': ...} and
      # --sport took its choices from that dict. NBA put 608 rows into it
      # on 10-27 alone and none of them could ever be graded.
      #
      # --backfill 3 picks up a late box score the same way MLB's does.
      - name: Grade NBA prop playbook decisions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python grade_prop_playbook.py --sport NBA --backfill 3

      # ══ 2026-10-28 · ATTRIBUTION RAN FOR 3 OF 6 SPORTS ══
      # signal_attribution_grade.py was extended to NBA/NHL/NCAAB on 10-27,
      # but only MLB, NFL and NCAAF had a workflow step calling it — so the
      # week-to-week record of which signals drive which outcomes, which is
      # the standard Andy set, would never accumulate for NBA.
      # ══ 2026-10-28 · NOTHING WAS WRITING NBA'S ATTRIBUTION ROWS ══
      # The grade step below had nothing to grade: signal_attribution_snapshot
      # ran for MLB, NCAAF and NFL only, so NBA had 74 rows against NCAAF's
      # 3,101. Without snapshots there is no attribution, without attribution
      # refit_signal_registry can never compute a NBA weight, and every NBA
      # game signal stays UNVALIDATED at the 0.3 prior forever -- which is
      # exactly what the registry shows today: not ONE NBA game signal has
      # sample_n > 0. The four NBA signals carrying real weight (1.0) are all
      # PROP signals, which cannot fire on a game pick at all.
      #
      # This is the loop Andy asked for on 10-27: every signal recorded per
      # pick, graded, and the weights refit per sport week to week. The
      # snapshot is the first link and it was missing for two sports.
      - name: Snapshot NBA signal attribution
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python signal_attribution_snapshot.py --sport NBA

      - name: Grade NBA signal attribution
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python signal_attribution_grade.py --sport NBA --days 7

      # == 2026-10-28 . CLOSE THE LOOP: REFIT NBA'S OWN WEIGHTS ========
      # The snapshot and grade steps above were added today, so attribution
      # finally accumulates for NBA. But refit_signal_registry -- the step
      # that turns graded attribution into weights -- is scheduled ONLY from
      # mlb_pipeline.yml and mlb_refit_weekly.yml. MLB is in the World
      # Series; when it stops running, NBA's weights would never refit
      # again, and every NBA game signal would sit on the unmeasured
      # prior forever. That is the loop Andy asked for on 10-27 -- "every
      # signal recorded per pick and attributed WEEKLY so weighting can be
      # tuned per sport" -- and its last link was owned by another sport.
      #
      # Each sport now refits its own. min-n 10 matches the floor raised on
      # 10-27 (99 weighted signals -> 163).
      #
      # As of tonight NBA has 0 of 32 enabled GAME signals with a
      # measured hit rate, so the first runs will mostly write
      # UNVALIDATED/ANTI_VALIDATED -- which is the honest state and is what
      # makes the direction-only control (fixed 10-28) start to bite as
      # volume arrives rather than after the bias is entrenched.
      - name: Refit NBA signal weights from graded attribution
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python refit_signal_registry.py --sport NBA --days 90 --min-n 10

      # 2026-08-25: refresh home/road tendencies materialized view after
      # results resolver. Powers the Trends & Tendencies card in the NBA
      # slot redesign. Uses refresh_home_road_tendencies(sport) RPC from
      # 20260826b migration. Offseason no-op (0 games → 0 rows).
      - name: Refresh NBA home/road tendencies view
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_home_road_tendencies" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_sport": "NBA"}'

      # 2026-09-01: NBA four-factors + pace puller (basketball-reference).
      # Populates efg_pct / tov_pct / orb_pct / ft_rate + opp variants +
      # pace on nba_team_stats — fills the visible NBA Team Stats card
      # block that was blank pre-9/1. Runs daily so 2025-26 season data
      # updates as bref publishes. In offseason: returns prior season
      # (dev-configurable via --season arg; default computes current).
      - name: NBA four-factors pull (basketball-reference)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_four_factors_pull.py

      # ── NBA ELO RATINGS (2026-09-29) ────────────────────────────────
      # nba_elo was in NO workflow. It had been run by hand once during
      # 2024-25 and never again, so every net/off/def rating in
      # nba_team_stats was from 2024-25 — two seasons stale — while the
      # four-factors pull above kept pace and eFG% current. nba_game_context
      # merges per-field newest-season-first keeping the first non-null, so it
      # silently served current pace alongside two-year-old ratings, and the
      # 2026-10-21 opening-night picks were built on that.
      #
      # Runs immediately AFTER the four-factors pull because both write
      # nba_team_stats and should land together, and BEFORE the
      # team_stats_rolling refresh below so the matview sees both, and well
      # before nba_game_context so the context build reads fresh numbers.
      #
      # No --season: the script resolves the most recent season with enough
      # finished games and falls back one when the new season is empty. A
      # hard-coded season here is the exact timebomb season_gate.py exists to
      # prevent.
      - name: NBA Elo ratings (train + persist)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "nba_elo.py train"             python nba_elo.py train

      # 2026-09-01: refresh team_stats_rolling after four-factors write
      - name: Refresh team_stats_rolling (NBA follow-up)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          # 2026-09-22: was `curl -s ... -d '{}'` with the response
          # discarded. This RPC has returned 42809 since the 09-16
          # matview rename and no one heard for six days, because a
          # 400 and a 204 looked identical from here.
          code=$(curl -s -o /tmp/rpc_out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_team_stats_rolling" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::refresh_team_stats_rolling failed ($code): $(cat /tmp/rpc_out.json)"
            exit 1
          fi

      # 2026-09-01: refresh cross-sport rollup matviews (team_recent_games,
      # team_situational_records, team_stats_rolling). Universal matviews —
      # this call refreshes NBA rows within them alongside all other sports.
      # See project_rolling_rollup_architecture_901 + migrations 20260901d/e.
      # NBA team_stats_rolling coverage deferred (nba_team_stats keys on
      # team_abbrev vs game_results' full team names — needs name-mapping).
      - name: Refresh team_recent_games matview
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_team_recent_games" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Refresh team_situational_records matview
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          # 2026-09-22: was `curl -s ... -d '{}'` with the response
          # discarded. This RPC has returned 42809 since the 09-16
          # matview rename and no one heard for six days, because a
          # 400 and a 204 looked identical from here.
          code=$(curl -s -o /tmp/rpc_out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_team_situational_records" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::refresh_team_situational_records failed ($code): $(cat /tmp/rpc_out.json)"
            exit 1
          fi

      # 2026-08-23 season-ready: refresh signal_registry from graded NBA props
      # once season data lands. Sport-universal script. Silent no-op during
      # offseason (no graded prop history). Feeds v3-style refit training
      # once volume hits.
      - name: Refresh NBA signal_registry from graded props
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python refresh_prop_signal_calibration.py --sport NBA --days 30

      # 2026-08-25: NBA injury scrape (ESPN /nba/injuries). Populates
      # nba_injuries so the NBAInjuriesCard in GameDetailV2 has data to
      # render. Works year-round (ESPN keeps the page live in offseason
      # with rehab / surgery-recovery entries). Non-fatal — if ESPN
      # markup shifts, we get 0 rows and the card renders empty.
      # ══ 2026-10-29 · IT HAS BEEN FAILING SILENTLY SINCE NBA OPENED ══
      # assert_slate_freshness caught it: nba_injuries last written 192h ago
      # against a 40h limit — i.e. nothing since roughly 10-21, the day the
      # season started. The script is FINE: run by hand the same day it
      # printed "86 injury rows parsed / 86/86 rows persisted", exit 0.
      #
      # So the step runs (nba_pipeline fires several times a day), fails in
      # CI, and nobody hears it: `continue-on-error: true` swallows the exit
      # code AND this was the one step here not wrapped in run_step.sh, so
      # no step_failed heartbeat was ever recorded either. Working locally
      # and failing in CI points at ESPN refusing the runner's IP, which is
      # not fixable from this repo — but an invisible failure is, and that
      # is the actual defect (feedback_green_step_that_writes_nothing).
      #
      # continue-on-error STAYS: stale injuries must not block the slate.
      # run_step.sh is added so the failure lands in workflow_heartbeat with
      # its label and rc, which is how every other failing step here gets
      # found.
      - name: Pull NBA injuries (ESPN)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "nba_injuries_pull.py" python nba_injuries_pull.py

      # ─── Today's context (schedule + odds + rest) ──────────────
      - name: Build NBA game context (today + next 3 days)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd mlb_pipeline
          python nba_game_context.py --days 4

      # ══ 2026-10-13 · NBA HAD NO INJURY DATA REACHING THE ENGINE ══
      # nba_game_context.home_starters_out / away_starters_out /
      # home_injury_impact / away_injury_impact were 0 of 81 populated.
      # nba_game_context.py:305 READS injury_impact and nothing had ever
      # written it, so the three star-out signals
      # (nba_home_star_out_fade, nba_away_star_out_fade,
      # nba_prop_star_out_teammate_boost) evaluated NULL every night.
      # Star availability is the most price-moving input in basketball.
      #
      # Both sources already existed and were simply never joined:
      # nba_injuries (pulled two steps above) and nba_player_game_logs,
      # which carries a real `started` boolean — so "is this a starter"
      # is measured, not inferred from a minutes threshold.
      #
      # Placed AFTER nba_game_context (the rows must exist to PATCH) and
      # BEFORE the Jerry reads below, so the read narrates a slate that
      # already knows who is out. Same ordering logic as the read step's
      # own comment.
      - name: Enrich NBA game context with injuries
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_nba_injuries_to_context.py --apply

      # ══ 2026-10-13 · NBA HAD NO MONTE CARLO ══
      # mc_probabilities was populated on NFL 106/316, NCAAF 382/536, NHL
      # 136/187 and MLB 26/36 — and 0 of 81 on NBA. Not a nice-to-have: in
      # the NFL model audit mc_expected_margin was the best voter available,
      # the only one at market scale and the most independent of the others.
      #
      # Built from nba_team_stats (off_rating / def_rating / pace) and
      # NOTHING from the existing model stack, deliberately. Building an
      # "MC" on top of projected_spread would have produced another
      # duplicate voter, which is the exact failure documented today (NCAAF:
      # six spread columns, one real opinion).
      #
      # Every constant measured from our own 2,755 graded NBA games rather
      # than borrowed: HFA +1.82 (not the 2.5-3.0 usually quoted), margin sd
      # 16.22, team sd 13.41, total sd 21.41. Variance is two-component
      # because one component cannot fit all three moments at once.
      # Self-check reproduces margin +1.72/sd 16.00, total 228.8/sd 21.29,
      # team sd 13.28 — all within ~1%.
      #
      # Runs after the injury enrichment so a sim is never built on a slate
      # whose availability data is a step behind.
      - name: NBA Monte Carlo simulator
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python nba_mc_simulator.py --days 10

      # ══ 2026-10-13 · STAR-OUT FADE, SHADOW ONLY ══
      # The three star-out signals were rewired from the nonexistent
      # ctx.*_star_out to the injury columns the step above now writes, and
      # left enabled=FALSE. They contribute nothing to a published pick.
      #
      # The bar — differential injury_impact >= 15 ppg WITH a starter
      # actually out — is a reasoned guess with no graded NBA history
      # behind it (the season opens 10-20), so it gets tested rather than
      # asserted. This logs each fire to rule_shadow_log and grades past
      # ones on the real closing moneyline, recording ROI at 10/15/20/30 ppg
      # so the threshold can be chosen from the record instead of re-guessed.
      #
      # Promotion stays manual: backtest_rules may flip this rule's
      # registry mode to active, but nothing consumes that mode — only
      # flipping the three signal_sources rows to enabled=true can affect
      # picks, and that is a human decision on the graded evidence.
      - name: Shadow NBA star-out fade (log + grade)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python shadow_nba_star_out.py --apply --days 3
          python shadow_nba_star_out.py --grade --apply

      # 2026-10-10 · B74c · NBA JERRY READS. jerry_reads held ZERO NBA rows
      # (MLB 812, NCAAF 499, NHL 163, NFL 127, UFC 88, NBA 0) because
      # generate_nba_game_reads.py did not exist — every other sport had a
      # generator. So NBA published no per-game read and had no entry in the
      # game_read record the Receipts tab now rolls up (B74a).
      #
      # Runs immediately AFTER nba_game_context so the read sees the same
      # night's projections, efficiency ratings and primary_play. Ordering
      # matters: the generator reads nba_game_context and would otherwise
      # narrate yesterday's numbers.
      - name: Generate NBA game reads (Jerry)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "generate_nba_game_reads.py" python generate_nba_game_reads.py
          # == 2026-10-29 . THE WRITE-UP MUST AGREE WITH THE PICK ========
          # Andy: "i want the write ups correct across all sports now and
          # going forward". On 10-29 a refit flipped 16 NCAAF badges, the
          # read generator then failed rc=1 on an expired Anthropic key,
          # and the board showed 'Washington +7.5' above prose projecting
          # "Nebraska 28.2, Washington 22.7". Nothing compared the two,
          # because the engine, the badge and the prose are written by
          # three different steps.
          # Runs IMMEDIATELY after generation so the check sees what was
          # just written. Blocks only on a write-up that declines its own
          # pick or projects the other team; everything else warns.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" --label "audit_read_pick_consistency.py (NBA)" python audit_read_pick_consistency.py --sport NBA --days 14
          # == 2026-10-28 . PRICE THE PICK THAT WAS JUST WRITTEN ==========
          # nightly_cross_sport.sh has carried this note since 10-02:
          # "this is the daily floor, not the ideal ... the right place is
          # also immediately after each sport's read generation ... Wiring
          # that per-pipeline is queued." It stayed queued, and tonight it
          # cost us in public: 6 of 7 NBA spread picks carried a price that
          # was not a spread price --
          #     San Antonio Spurs -13.5  shown at -650 (the away MONEYLINE)
          #     Houston Rockets   -8.5   shown at -340 (ditto)
          # Every read was priced at 18:37 and REGENERATED at 22:28, and
          # nothing priced them again. Breakeven at -650 is 86.7 percent,
          # so the juice gates and every ROI figure were computed off a
          # number no book posts.
          #
          # price_picks.py already handles this correctly -- it re-prices
          # any game that has NOT started and freezes the price once it has,
          # so a repeat run cannot rewrite the record of what we published.
          # It just never ran after the pick moved. The clearing guard in
          # sync_jerry_reads_from_ctx.py does not help here: it skips every
          # read a real synthesis generator wrote, which is all of them
          # (feedback_guard_belongs_at_the_chokepoint).
          #
          # Non-fatal: a pricing miss must not fail the slate.
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh"             --label "price_picks.py --sport NBA (re-price the moved pick)"             python price_picks.py --sport NBA --write || true

          # ══ 2026-10-23 · THE BADGE AND GAME DETAIL CONTRADICTED ══
          # ANDY: "timberwolves pregame bage not amtchign game detail priamry
          # play". Minnesota @ Orlando carried primary_play 'Orlando Magic ML'
          # (HOME) against jerry_reads call_side AWAY -- same market, OPPOSITE
          # sides, one screen saying Minnesota and the other Orlando.
          #
          # jerry_pick_scrub exists for exactly this: Jerry's LLM writes
          # call_side at generation time, primary_play is later recomputed (MC
          # refresh, close-line update, defensive gate flip), and the two
          # diverge. It was scheduled in the MLB, NCAAF and NFL pipelines and
          # in NEITHER NBA nor NHL, so those two sports drifted with nothing
          # to reconcile them. Measured today before adding this: 5 of 12 NBA
          # games disagreed (1 opposite-side, 3 different-market, 1 line) and
          # 1 of 2 NHL.
          #
          # Note this is a sub-class the unscheduled-writer audit cannot see:
          # the script IS referenced by workflows, just not by every sport's.
          python jerry_pick_scrub.py --sport NBA

      # 2026-09-21: NBA externals. There was no nba external puller at
      # all until today, even though the shared oddscrowd /
      # scoresandodds / pickdawgz modules were already parameterised for
      # it. oddscrowd is the MONEY FLOW source (money% / bets% /
      # divergence). Resolve runs straight after the pull so NBA never
      # repeats the NFL situation, where externals were collected every
      # week and never graded — 451 of 460 picks sat ungraded since
      # launch because no workflow called resolve_externals.
      - name: Pull + resolve NBA external picks
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python pull_externals_nba.py --triggered-by cron
          python resolve_externals.py --sport NBA --days 14

      # ─── L10 team tendencies backfill ──────────────────────────
      - name: Backfill NBA team tendencies (L10)
        continue-on-error: true
        env:
