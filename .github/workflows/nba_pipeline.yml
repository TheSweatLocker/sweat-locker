      - name: Enrich NBA game context with season trends
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_trends.py --sport NBA

      # 2026-08-18: universal team-form (venue-split L10 + H2H last 5)
      - name: Enrich team form — venue split + H2H
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python enrich_team_form_universal.py --sport NBA

      # ══ 2026-11-10 · THE PROP CHAIN WAS SPENDING THE WHOLE JOB BUDGET ══
      # The nine NBA prop steps that used to sit here now run in
      # `nba_props_refresh.yml`. Measured locally against tonight's slate:
      #
      #     nba_generate_props.py            287s   (808 props)
      #     enrich_nba_prop_projections.py   277s   (matched 788/808)
      #     backfill_prop_lookback.py       >420s   (ESPN game log per player)
      #     nba_sleeper_projections_pull.py    9s
      #     prop_slot_reconcile.py             1s
      #
      # That is ~16 minutes across FIVE of the nine, with four unmeasured,
      # inside a job capped at `timeout-minutes: 45` whose own comment says
      # normal is ~21m. It is why this job was CANCELLED three times for
      # three on 11-09 (44m41s / 44m43s / 44m41s) and why steps 29-57 --
      # `Sync NBA jerry_reads from context`, `Assert NBA slate freshness`,
      # `Assert publish invariant` -- have not run in days. The detector was
      # behind the same wall as the defect.
      #
      # And none of it can reach a user: `feature_flags(NBA,'pipeline_props')`
      # is false and read fail-closed, the publishable view needs PRIME or
      # STRONG, and NBA's board is 0 PRIME / 0 STRONG. So ~16+ minutes of a
      # 45-minute budget was being spent generating rows nothing can display,
      # at the cost of the steps that build the SIDES the app does show.
      #
      # They are not deleted -- the shadow record is the documented path to
      # opening that surface on evidence. They just do not get to spend this
      # job's budget. Same remedy as the splits chain (ece14543): give the
      # work its own cadence rather than raise a cap that is a real signal.


      # ══ 2026-10-30 · conviction_rank ══
      # The ensemble's `conviction` saturates at win_score 3.0 and is
      # sport-blind, so NBA's picks all land in a few points of each other and
      # cannot be ranked against one another. stamp_conviction_rank writes a
      # separate per-sport-normalised `_conviction_rank` (plus the inputs, so
      # weekly attribution can retune the spans) and leaves `conviction`
      # alone, because model_edge consumes that one as a win probability.
      # ══ 2026-10-30 · COVER PROBABILITY, OR THE LADDER STAYS PARKED ══
      # steam_room_ladder reads a COVER probability for a spread pick, and
      # only the NBA simulator ever wrote one. NCAAF/NFL/NHL published
      # mc_p_home (outright win), a different question, so every spread
      # candidate came back win_prob=None and the edge gate saw -999. This
      # derives P(home covers) from the margin mean and sd those simulators
      # already publish, and self-checks the threshold against spread_result
      # on completed games before writing anything (NFL currently FAILS that
      # check at 93% because ctx.close_spread disagrees with
      # results.close_spread on 46 of 100 games -- logged, not papered over).
      - name: Derive cover probability (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python derive_cover_probability.py --sport NBA --days 8

      - name: Stamp conviction_rank (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python stamp_conviction_rank.py --sport NBA --days 5

      # 2026-09-08: removed duplicate refresh_prop_signal_calibration call
      # — same script + args was already run at line ~156 ("graded props"
      # step). Per project_pipeline_overhaul_909 dedup pass.

      # 2026-09-02: Split — per-source calibration for NBA. Silent no-op
      # until season starts (Oct). Wire pre-season so day-1 records populate.
      - name: Refresh external source calibration (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_external_source_calibration.py --sport NBA

      - name: Refresh sharp-source calibration (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python audit_sharp_source_calibration.py --sport NBA

      # 2026-09-02: Split — signal-pattern rolling hit rates (NBA).
      - name: Refresh signal pattern registry (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python compute_signal_patterns.py --sport NBA

      # 2026-09-08: bridge primary_play → jerry_reads for NBA. Ensemble +
      # defensive_gates now write primary_play in nba_game_context; without
      # this sync, app never sees NBA picks (jerry_reads is the source of
      # truth the client reads from). Mirrors NCAAF/NFL/MLB wiring.
      # ══ 2026-11-05 · A PICK WITH NO LINE IS NOT A BET ═════════════
      # repair_spread_labels.py was written 2026-10-30 and scheduled NOWHERE,
      # so the defect it fixes came back every night. On 2026-11-05 three NHL
      # puck-line picks were published as "Anaheim Ducks PL" with line=None
      # while close_puckline held -1.5 on the same row -- composed before the
      # odds pull landed, then frozen by the pick lock while ctx filled in
      # behind them. receipt_invariants refuses a line-bearing market with no
      # pick_line, so each one was published AND ungradeable, and the POTD
      # price path falls back to -110 on a dog puck line that closes near
      # -195. It fills the NUMBER only, from the same ctx column the label
      # builder would have used; the side is read off the stored pick and
      # never re-derived.
      - name: Repair spread picks published without a line (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "repair_spread_labels.py (NBA)" \
            python repair_spread_labels.py --sport NBA --days 2 --apply

      - name: Sync NBA jerry_reads from context
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          python sync_jerry_reads_from_ctx.py --sport NBA --window 4

      # == 2026-11-08 . THIS STEP AND THE SYNC STEP ABOVE WERE ONE STEP ==
      # The 11-05 edit (bb7250f5) that added this step put its `- name:`
      # header BETWEEN the Sync step's header and the Sync step's body. The
      # Sync step lost its header, so a single step carried TWO
      # `continue-on-error`, `env` and `run` keys. GitHub rejects duplicate
      # mapping keys and DE-REGISTERS the whole workflow: nba_ and
      # nhl_pipeline.yml vanished from the Actions sidebar (listed by raw
      # path instead of `name:`), every push produced an instant
      # "Invalid workflow file" run, and NO scheduled run fired from 11-06
      # through 11-08 -- 8 of 12 NHL reads for 11-07 went ungraded as a
      # direct result.
      #
      # yaml.safe_load ACCEPTS duplicate keys silently (last wins), so a
      # permissive parse check reports "PARSE OK" on a file GitHub refuses.
      # Validate with a strict loader: .github/scripts/validate_workflows.py
      #
      # The repair above writes primary_play; the reads are a COPY of it and
      # do not update themselves. --line-only patches call_line/call_text
      # ONLY when side and market already agree, so it can never change a
      # pick -- which is also why it is safe past the NFL week lock.
      - name: Propagate repaired lines onto the published reads (NBA)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          cd mlb_pipeline
          bash "$GITHUB_WORKSPACE/.github/scripts/run_step.sh" \
            --label "jerry line alignment (NBA)" \
            python backfill_jerry_pick_alignment.py --sport NBA \
              --days 2 --line-only

      # 2026-09-08 heartbeat END.
      - name: Heartbeat — end
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/workflow_heartbeat" \
               -H "apikey: $SUPABASE_KEY" \
               -H "Authorization: Bearer $SUPABASE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: return=minimal" \
               -d "{\"workflow\":\"nba_pipeline\",\"event\":\"end\",\"sport\":\"NBA\",\"run_id\":\"${{ github.run_id }}\",\"cron_slot\":\"${{ github.event.schedule }}\"}"

      - name: External monitor — ping end
        if: always()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_NBA_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 --max-time 10 -o /dev/null "$HC_URL" || true
          fi

      # Model / card generation: Elo model runs inside nba_game_context.py
      # (enrich_elo). Card generation deferred until preseason validates.

      # ══ 2026-10-20 · ASSERT THE SLATE, DO NOT ASSUME IT ══
      # B107: ncaaf_pipeline ran start-to-end on every cron slot for five weeks
      # while its weather step returned before doing any work. Heartbeat was
      # green, the step was green (continue-on-error), the table had rows --
      # and 171 games shipped with no weather. ~400 steps across these
      # workflows carry continue-on-error, so a step's exit code cannot be the
      # signal and heartbeat answers a different question.
      #
      # DELIBERATELY NO continue-on-error. This is the check that catches the
      # advisory ones failing silently, so making it advisory defeats it. It
      # fails on two things only, both near-impossible legitimately:
      #   * a DARK COLUMN -- 0 populated rows of N on a slate that HAS rows
      #   * NO ROWS at all while the upstream schedule lists games
      # Partial fill is reported and does not fail, because context genuinely
      # fills in over time.
      - name: Assert NBA slate freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python assert_slate_freshness.py --sport NBA

      # ══ 2026-10-25 · THE ONE INVARIANT (B175) — see nfl_pipeline.yml ══
      # badge == read == card == receipt, on SIDE and MARKET. Hard by design:
      # an advisory version of this check is a muted one. --fail-on side so
      # the known B144 market population shouts without pinning the build red.
      - name: Assert publish invariant (badge == read == card == receipt)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd mlb_pipeline
          python assert_publish_invariant.py --sport NBA --fail-on side
